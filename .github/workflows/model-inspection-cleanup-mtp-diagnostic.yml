name: Model Inspection cleanup MTP diagnostic

on:
  push:
    branches:
      - refactor/model-inspection-cleanup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-inspection-cleanup-mtp-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-trx-reporter:
    name: Prove native MTP TRX reporting
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      CONTRACT_TEST_PROJECT: tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/GraniteEdgeAI.ModelInspection.Contracts.Tests.csproj
      RESULTS_DIRECTORY: TestResults/DiagnosticContracts
      TRX_FILE: GraniteEdgeAI.ModelInspection.Contracts.Tests.trx

    steps:
      - name: Check out diagnostic inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          sparse-checkout: |
            .github
            IBM Granite with TurboQuant (Intel)
            infrastructure
            shared
            workers
            tests

      - name: Set up repository .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json

      - name: Add TRX reporter to diagnostic workspace
        run: |
          $ErrorActionPreference = 'Stop'
          $projectPath = $env:CONTRACT_TEST_PROJECT
          $projectText = Get-Content -LiteralPath $projectPath -Raw
          $anchor = '    <PackageReference Include="Microsoft.NET.Test.Sdk" Version="18.8.1" />'
          if (-not $projectText.Contains($anchor, [System.StringComparison]::Ordinal)) {
            throw 'expected package anchor was not found'
          }
          $reporter = '    <PackageReference Include="Microsoft.Testing.Extensions.TrxReport" Version="2.3.2" />'
          $projectText = $projectText.Replace($anchor, "$anchor`n$reporter")
          Set-Content -LiteralPath $projectPath -Value $projectText -NoNewline -Encoding utf8

      - name: Restore contract tests
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore "$env:CONTRACT_TEST_PROJECT"
          if ($LASTEXITCODE -ne 0) {
            throw "contract restore failed: $LASTEXITCODE"
          }

      - name: Verify restored TRX reporter dependency
        run: |
          $ErrorActionPreference = 'Stop'
          $assetsPath = 'tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/obj/project.assets.json'
          $assets = Get-Content -LiteralPath $assetsPath -Raw
          if (-not $assets.Contains('Microsoft.Testing.Extensions.TrxReport/2.3.2', [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'TRX reporter 2.3.2 was not restored'
          }

      - name: Run complete contract project with native TRX reporter
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test "$env:CONTRACT_TEST_PROJECT" `
            --configuration Release `
            --no-restore `
            --minimum-expected-tests 75 `
            --results-directory "$env:RESULTS_DIRECTORY" `
            --report-trx `
            --report-trx-filename "$env:TRX_FILE"
          if ($LASTEXITCODE -ne 0) {
            throw "contract diagnostic failed: $LASTEXITCODE"
          }

      - name: Verify diagnostic TRX
        run: |
          $ErrorActionPreference = 'Stop'
          $trxPath = Join-Path $env:RESULTS_DIRECTORY $env:TRX_FILE
          if (-not (Test-Path -LiteralPath $trxPath -PathType Leaf)) {
            throw "expected TRX was not created: $trxPath"
          }
          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          if ([int]$counters.total -lt 75 -or [int]$counters.failed -ne 0 -or [int]$counters.notExecuted -ne 0) {
            throw 'diagnostic TRX contains an invalid test result'
          }
          Write-Host "trx_total=$($counters.total)"
          Write-Host "trx_passed=$($counters.passed)"

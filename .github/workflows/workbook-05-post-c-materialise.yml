name: Workbook 05 post-C materialisation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-post-c-materialise.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: workbook-05-post-c-materialise-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialise:
    name: Generate, verify and commit WB-07 through WB-13
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      generated_sha: ${{ steps.commit-pack.outputs.generated_sha }}

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Restore the exact reviewed workbook source payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
              Get-ChildItem `
                  -LiteralPath '.\.bootstrap' `
                  -Filter 'workbook05-post-c-source.b64.part-*' `
                  -File |
                  Sort-Object Name
          )
          if ($parts.Count -ne 3) {
              throw "Expected three payload parts; found $($parts.Count)."
          }
          $encoded = [string]::Concat(@(
              $parts | ForEach-Object {
                  (Get-Content -LiteralPath $_.FullName -Raw -Encoding utf8).Trim()
              }
          ))
          $archive = Join-Path $env:RUNNER_TEMP 'workbook05-post-c-source.tar.gz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          $expected = 'fa2bfe925a95fcf9849941bad568cbd5638eb71a58d9fc6aafa621928c48bc0e'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) {
              throw "Payload digest mismatch. Expected $expected; observed $actual."
          }
          python -c "import pathlib,sys,tarfile; tarfile.open(sys.argv[1], 'r:gz').extractall(pathlib.Path(sys.argv[2]), filter='data')" `
              $archive `
              $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
              throw "Payload extraction exited with code $LASTEXITCODE."
          }

      - name: Apply the Windows PowerShell 5.1 relative-path compatibility seam
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.\scripts\testing\Validate-Workbook05-PostC-Workbooks.ps1'
          $text = [IO.File]::ReadAllText($path)
          $needle = '[IO.Path]::GetRelativePath'
          $anchor = 'Set-StrictMode -Version Latest'
          if (-not $text.Contains($needle) -or -not $text.Contains($anchor)) {
              throw 'Expected relative-path seam was not found.'
          }
          $helper = @'

          # Windows PowerShell 5.1 runs on .NET Framework and does not expose
          # System.IO.Path.GetRelativePath. Preserve canonical relative paths
          # through a small URI-based compatibility helper.
          if (-not ('Wb05PathCompat' -as [type])) {
              Add-Type -TypeDefinition @"
          using System;
          using System.IO;
          public static class Wb05PathCompat
          {
              public static string GetRelativePath(string relativeTo, string path)
              {
                  string basePath = Path.GetFullPath(relativeTo);
                  if (!basePath.EndsWith(Path.DirectorySeparatorChar.ToString(), StringComparison.Ordinal))
                  {
                      basePath += Path.DirectorySeparatorChar;
                  }
                  Uri baseUri = new Uri(basePath, UriKind.Absolute);
                  Uri targetUri = new Uri(Path.GetFullPath(path), UriKind.Absolute);
                  string value = Uri.UnescapeDataString(baseUri.MakeRelativeUri(targetUri).ToString());
                  return value.Replace('/', Path.DirectorySeparatorChar);
              }
          }
          "@
          }
          '@
          $text = $text.Replace($needle, '[Wb05PathCompat]::GetRelativePath')
          $text = $text.Replace($anchor, $anchor + $helper)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Install pinned workbook dependencies
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\requirements.txt'

      - name: Generate all workbooks and machine-readable controls
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m scripts.testing.workbook05.bootstrap_post_c_workbooks `
              --repository-root $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
              throw "Workbook generation exited with code $LASTEXITCODE."
          }

      - name: Run the complete controlled workbook gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'workbook-05-post-c-pack'
          & '.\scripts\testing\Validate-Workbook05-PostC-Workbooks.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python' `
              -ArtifactDirectory $artifactRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Post-C workbook gate exited with code $LASTEXITCODE."
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) {
              throw "git diff --check exited with code $LASTEXITCODE."
          }

      - name: Upload the exact validated package before repository mutation
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-post-c-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-post-c-pack
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

      - name: Commit only non-workflow workbook sources and generated records
        id: commit-pack
        shell: powershell
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A -- '.bootstrap'
          git add -- `
              'docs/superpowers/plans/2026-08-22-workbook-05-post-c-workbook-pack.md' `
              'docs/testing/Workbook-05-Post-C-Configuration-Matrix-v1.csv' `
              'docs/testing/Workbook-05-Post-C-Evidence-Register-v1.csv' `
              'docs/testing/Workbook-05-Post-C-Execution-Index-v1.csv' `
              'docs/testing/Workbook-05-Post-C-Revision-Register-v1.csv' `
              'docs/testing/workbooks/Controlled-Workbook-Manifest.csv' `
              'docs/testing/workbooks/README.md' `
              'docs/testing/workbooks/Workbook-05-Post-C-Pack-Manifest-v1.json' `
              'docs/testing/workbooks/generated' `
              'docs/testing/workbooks/text-templates' `
              'scripts/testing/Generate-Controlled-Workbooks.py' `
              'scripts/testing/Validate-Workbook05-PostC-Workbooks.ps1' `
              'scripts/testing/workbook05/bootstrap_post_c_workbooks.py' `
              'scripts/testing/workbook05/post_c_workbook_pack.py' `
              'tests/testing/workbook05/test_post_c_workbook_pack.py'

          if (git diff --cached --quiet) {
              throw 'Workbook materialisation produced no staged repository change.'
          }
          git commit -m 'chore(workbook05): materialise post-C workbook pack'
          if ($LASTEXITCODE -ne 0) {
              throw "git commit exited with code $LASTEXITCODE."
          }
          git push origin "HEAD:$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) {
              throw "git push exited with code $LASTEXITCODE."
          }
          $sha = (git rev-parse HEAD).Trim()
          "generated_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Generated workbook-pack head: $sha"

  independently-validate:
    name: Independently validate the uploaded workbook package
    needs: materialise
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact generated source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ needs.materialise.outputs.generated_sha }}
          fetch-depth: 1

      - name: Set up independent Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned validator dependencies
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\requirements.txt'

      - name: Download exact same-attempt artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: workbook-05-post-c-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-post-c-pack

      - name: Validate uploaded data without executing it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m scripts.testing.workbook05.post_c_workbook_pack `
              --repository-root $env:GITHUB_WORKSPACE `
              --artifact-root (Join-Path $env:RUNNER_TEMP 'workbook-05-post-c-pack') `
              --report (Join-Path $env:RUNNER_TEMP 'independent-validation.json')
          if ($LASTEXITCODE -ne 0) {
              throw "Independent validation exited with code $LASTEXITCODE."
          }
          Write-Host 'WORKBOOK05_POST_C_MATERIALISATION_INDEPENDENT_PASS'

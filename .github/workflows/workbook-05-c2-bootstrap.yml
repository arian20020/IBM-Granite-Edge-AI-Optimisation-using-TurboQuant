name: Workbook 05 C2 process-harness bootstrap

on:
  pull_request:
    branches:
      - main
      - fix/workbook-05-c1-controlled-source-resume
    paths:
      - '.github/workflows/workbook-05-c2-bootstrap.yml'
      - '.bootstrap-c2/workbook05-c2-source.b64.part-*'
  workflow_dispatch:

# This workflow has one narrow purpose: restore the reviewed C2 payload,
# verify it on hosted Windows, commit it to the same feature branch, and then
# delete both the payload and this one-time bootstrap workflow. It cannot reach
# the self-hosted Lenovo or execute a model.
permissions:
  contents: write
  actions: read

concurrency:
  group: workbook-05-c2-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialise-c2-process-harness:
    name: Materialise and verify the C2 process harness
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      generated_sha: ${{ steps.commit-c2.outputs.generated_sha }}

    steps:
      - name: Check out the exact C2 bootstrap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .bootstrap-c2
            .github/workflows
            docs/testing/workbook05
            experiments/granite_turboquant_intel/manifests
            experiments/granite_turboquant_intel/schemas
            scripts/testing
            tests/testing/workbook05

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Restore and verify the reviewed C2 source payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $parts = @(
              Get-ChildItem `
                  -LiteralPath '.\.bootstrap-c2' `
                  -Filter 'workbook05-c2-source.b64.part-*' `
                  -File |
                  Sort-Object Name
          )
          if ($parts.Count -ne 6) {
              throw "Expected exactly six reviewed C2 payload parts; found $($parts.Count)."
          }

          $encoded = [string]::Concat(@(
              $parts | ForEach-Object {
                  Get-Content -LiteralPath $_.FullName -Raw -Encoding utf8
              }
          ))
          $archivePath = Join-Path $env:RUNNER_TEMP 'workbook05-c2-source.tar.gz'
          [IO.File]::WriteAllBytes(
              $archivePath,
              [Convert]::FromBase64String($encoded)
          )

          $expectedDigest = '86d65d644cd2d6e3e69dbc324c0d11895ae4139e060648e552baccb796806e72'
          $actualDigest = (
              Get-FileHash -LiteralPath $archivePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualDigest -cne $expectedDigest) {
              throw "Reviewed C2 payload digest mismatch. Expected $expectedDigest; observed $actualDigest."
          }

          python -c "import pathlib,sys,tarfile; tarfile.open(sys.argv[1], 'r:gz').extractall(pathlib.Path(sys.argv[2]), filter='data')" `
              $archivePath `
              $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
              throw "C2 payload extraction exited with code $LASTEXITCODE."
          }

          # Python bytecode was produced while the payload was assembled. It is
          # never part of reviewed source or evidence and must not enter Git.
          Get-ChildItem `
              -LiteralPath '.\tests\testing\workbook05\fixtures\phase3\process' `
              -Directory `
              -Filter '__pycache__' `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          Get-ChildItem `
              -LiteralPath '.\tests\testing\workbook05\fixtures\phase3\process' `
              -File `
              -Filter '*.pyc' `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Remove-Item -Force

          $required = @(
              '.\.github\workflows\workbook-05-phase3-harness-tests.yml',
              '.\scripts\testing\workbook05\Workbook05.Run.psm1',
              '.\scripts\testing\workbook05\Invoke-Workbook05Phase3HarnessFixture.ps1',
              '.\scripts\testing\workbook05\phase3\process_policy.py',
              '.\scripts\testing\workbook05\phase3\checkpoint.py',
              '.\scripts\testing\workbook05\phase3\process_bundle_validation.py',
              '.\experiments\granite_turboquant_intel\schemas\workbook05\process-attempt.schema.json',
              '.\experiments\granite_turboquant_intel\schemas\workbook05\resource-summary.schema.json',
              '.\experiments\granite_turboquant_intel\schemas\workbook05\phase3-checkpoint.schema.json',
              '.\docs\testing\workbook05\phase3-harness-runbook.md'
          )
          foreach ($path in $required) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Restored C2 source is missing: $path"
              }
          }

      - name: Install the pinned Workbook 05 validation dependency
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\workbook05\requirements.txt'

      - name: Run the complete Workbook 05 Phase 3 gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = @(
              & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
                  -RepositoryRoot $env:GITHUB_WORKSPACE `
                  -PythonPath 'python'
          )
          $output | ForEach-Object { Write-Host $_ }
          if ($output -notcontains 'WORKBOOK05_PHASE3_GATE_PASS') {
              throw 'The complete Phase 3 PASS marker was not emitted.'
          }

      - name: Verify only the reviewed C2 surfaces changed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) {
              throw "git diff --check exited with code $LASTEXITCODE."
          }

          $allowedPrefixes = @(
              '.bootstrap-c2/',
              '.github/workflows/workbook-05-c2-bootstrap.yml',
              '.github/workflows/workbook-05-phase3-harness-tests.yml',
              'docs/testing/workbook05/phase3-harness-runbook.md',
              'experiments/granite_turboquant_intel/manifests/templates/workbook05/phase3-checkpoint-template.json',
              'experiments/granite_turboquant_intel/manifests/templates/workbook05/process-attempt-template.json',
              'experiments/granite_turboquant_intel/manifests/templates/workbook05/resource-summary-template.json',
              'experiments/granite_turboquant_intel/schemas/workbook05/phase3-checkpoint.schema.json',
              'experiments/granite_turboquant_intel/schemas/workbook05/process-attempt.schema.json',
              'experiments/granite_turboquant_intel/schemas/workbook05/resource-summary.schema.json',
              'scripts/testing/workbook05/Invoke-Workbook05Phase3HarnessFixture.ps1',
              'scripts/testing/workbook05/Workbook05.Run.psm1',
              'scripts/testing/workbook05/phase3/checkpoint.py',
              'scripts/testing/workbook05/phase3/contracts.py',
              'scripts/testing/workbook05/phase3/process_bundle_validation.py',
              'scripts/testing/workbook05/phase3/process_policy.py',
              'tests/testing/workbook05/fixtures/phase3/process/',
              'tests/testing/workbook05/fixtures/phase3/process-bundles/valid/'
          )
          $changed = @(
              git status --porcelain=v1 --untracked-files=all |
                  ForEach-Object { $_.Substring(3).Replace('\', '/') }
          )
          $unexpected = @(
              $changed |
                  Where-Object {
                      $path = $_
                      -not ($allowedPrefixes | Where-Object { $path.StartsWith($_) })
                  }
          )
          if ($unexpected.Count -ne 0) {
              throw (
                  "Files outside the reviewed C2 implementation changed:`n" +
                  ($unexpected -join "`n")
              )
          }

      - name: Remove one-time C2 bootstrap material
        shell: powershell
        run: |
          Remove-Item -LiteralPath '.\.bootstrap-c2' -Recurse -Force
          Remove-Item `
              -LiteralPath '.\.github\workflows\workbook-05-c2-bootstrap.yml' `
              -Force

      - name: Commit the verified C2 implementation to the PR branch
        id: commit-c2
        shell: powershell
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if (-not (git diff --cached --quiet)) {
              git commit -m 'feat(workbook05): implement C2 process harness'
              if ($LASTEXITCODE -ne 0) {
                  throw "git commit exited with code $LASTEXITCODE."
              }
              git push origin "HEAD:$env:TARGET_BRANCH"
              if ($LASTEXITCODE -ne 0) {
                  throw "git push exited with code $LASTEXITCODE."
              }
          }

          $generatedSha = (git rev-parse HEAD).Trim()
          "generated_sha=$generatedSha" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append
          Write-Host "Verified C2 implementation head: $generatedSha"

  independently-verify-c2-process-harness:
    name: Independently verify the materialised C2 harness
    needs: materialise-c2-process-harness
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out the exact generated C2 revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ needs.materialise-c2-process-harness.outputs.generated_sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/testing/workbook05
            experiments/granite_turboquant_intel/manifests
            experiments/granite_turboquant_intel/schemas
            scripts/testing
            tests/testing/workbook05

      - name: Set up independent Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install the pinned validation dependency
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\workbook05\requirements.txt'

      - name: Re-run the complete Phase 3 gate independently
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = @(
              & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
                  -RepositoryRoot $env:GITHUB_WORKSPACE `
                  -PythonPath 'python'
          )
          $output | ForEach-Object { Write-Host $_ }
          if ($output -notcontains 'WORKBOOK05_PHASE3_GATE_PASS') {
              throw 'Independent Phase 3 validation did not emit the PASS marker.'
          }

      - name: Validate the committed fixture bundle as untrusted data
        shell: powershell
        run: |
          python -m scripts.testing.workbook05.phase3.process_bundle_validation `
              --bundle '.\tests\testing\workbook05\fixtures\phase3\process-bundles\valid' `
              --repository-root $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
              throw "Independent bundle validation exited with code $LASTEXITCODE."
          }
          Write-Host 'WORKBOOK05_C2_BOOTSTRAP_INDEPENDENT_PASS'

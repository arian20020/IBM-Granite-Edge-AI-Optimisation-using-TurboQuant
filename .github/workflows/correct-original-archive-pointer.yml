name: Correct original archive pointer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the research branch
        uses: actions/checkout@v4
        with:
          ref: research/provenance-library-v2
          fetch-depth: 0

      - name: Correct the archive pointer and refresh the Git manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('research')
          archive_readme = root / '99-original-docx' / 'README.md'
          archive_readme.write_text('''---
title: "Original DOCX Archive Pointer"
status: "preservation-guide"
version: "1.1"
last_updated: "2026-07-14"
source_documents:
  - "All supplied research DOCX files"
verification_note: "Exact DOCX and extracted PNG files are retained in the controlled provenance ZIP; Git contains the archive record and checksums."
---

# Original DOCX archive pointer

This Git folder does **not** contain the 44 DOCX binaries. The exact, unchanged source documents and their extracted PNG assets are retained in `IBM-Granite-TurboQuant-Research-GitHub-Ready-v2-Provenance.zip`.

Use [`BINARY-ARCHIVE-NOTICE.md`](BINARY-ARCHIVE-NOTICE.md) for the archive policy and retrieval record. SHA-256 checksums and original relative paths are recorded in `../00-governance/source-register.csv` and `../00-governance/package-manifest.json`.

Do not replace the controlled archive with edited copies. Add new findings to the curated Markdown folders and update the provenance records when a source changes.
''', encoding='utf-8')

          manifest_path = root / '00-governance' / 'git-tree-manifest.json'
          manifest_path.unlink(missing_ok=True)
          files = []
          for path in sorted(item for item in root.rglob('*') if item.is_file()):
              data = path.read_bytes()
              files.append({
                  'path': path.relative_to(root).as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest_path.write_text(
              json.dumps({
                  'manifest_version': '1.0',
                  'generated_on': '2026-07-14',
                  'manifest_scope': 'Git /research tree after provenance finalisation, excluding this manifest itself.',
                  'tracked_file_count_excluding_manifest': len(files),
                  'expected_total_file_count_including_manifest': len(files) + 1,
                  'archive_policy': 'Exact DOCX and extracted PNG binaries are held in the controlled provenance ZIP; Git contains written extracts, archive markers, checksums, and two archive-pointer documents.',
                  'files': files,
              }, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          print(f'Files represented before manifest: {len(files)}')
          print(f'Expected files including manifest: {len(files) + 1}')
          PY

      - name: Commit the corrected archive record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/correct-original-archive-pointer.yml
          git add --all
          git commit \
            -m "docs(research): correct original archive pointer" \
            -m "State clearly that the 44 DOCX and extracted PNG binaries remain in the controlled provenance ZIP, retain two Git archive-pointer documents, and refresh every SHA-256 entry in the Git-tree manifest."
          git push origin HEAD:research/provenance-library-v2

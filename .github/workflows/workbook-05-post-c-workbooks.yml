name: Workbook 05 post-C controlled workbooks

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-post-c-workbooks.yml'
      - 'docs/testing/Workbook-05-Post-C-**'
      - 'docs/testing/workbooks/**'
      - 'scripts/testing/Generate-Controlled-Workbooks.py'
      - 'scripts/testing/Validate-Workbook05-PostC-Workbooks.ps1'
      - 'scripts/testing/workbook05/**'
      - 'tests/testing/workbook05/test_post_c_workbook_pack.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-post-c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce-post-c-workbook-pack:
    name: Produce controlled workbook package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned workbook dependencies
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\requirements.txt'

      - name: Materialise and validate WB-07 through WB-13
        shell: powershell
        run: |
          python -m scripts.testing.workbook05.bootstrap_post_c_workbooks `
              --repository-root $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
              throw "Workbook bootstrap exited with code $LASTEXITCODE."
          }

          $artifactRoot = Join-Path $env:RUNNER_TEMP 'workbook-05-post-c-pack'
          & '.\scripts\testing\Validate-Workbook05-PostC-Workbooks.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python' `
              -ArtifactDirectory $artifactRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Workbook gate exited with code $LASTEXITCODE."
          }

      - name: Upload exact package and validation records
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-post-c-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-post-c-pack
          if-no-files-found: error
          retention-days: 30

  validate-post-c-workbook-pack:
    name: Independently validate untrusted package
    needs: produce-post-c-workbook-pack
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out validator from exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up independent Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned validator dependencies
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\requirements.txt'

      - name: Download exact same-attempt artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: workbook-05-post-c-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-post-c-pack

      - name: Validate artifact as untrusted data
        shell: powershell
        run: |
          python -m scripts.testing.workbook05.post_c_workbook_pack `
              --repository-root $env:GITHUB_WORKSPACE `
              --artifact-root (Join-Path $env:RUNNER_TEMP 'workbook-05-post-c-pack') `
              --report (Join-Path $env:RUNNER_TEMP 'post-c-independent-validation.json')
          if ($LASTEXITCODE -ne 0) {
              throw "Independent validation exited with code $LASTEXITCODE."
          }
          Write-Host 'WORKBOOK05_POST_C_WORKBOOK_PACK_PASS'

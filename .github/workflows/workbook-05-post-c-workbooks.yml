name: Workbook 05 post-C controlled workbooks

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-post-c-workbooks.yml'
      - 'docs/testing/Workbook-05-Post-C-*.csv'
      - 'docs/testing/workbooks/Controlled-Workbook-Manifest.csv'
      - 'docs/testing/workbooks/Workbook-05-Post-C-Pack-Manifest-v1.json'
      - 'docs/testing/workbooks/text-templates/0[7-9]_*.md'
      - 'docs/testing/workbooks/text-templates/1[0-3]_*.md'
      - 'docs/testing/workbooks/generated/0[7-9]_*.docx'
      - 'docs/testing/workbooks/generated/1[0-3]_*.docx'
      - 'scripts/testing/Generate-Controlled-Workbooks.py'
      - 'scripts/testing/Validate-Workbook05-PostC-Workbooks.ps1'
      - 'scripts/testing/workbook05/post_c_workbook_pack.py'
      - 'tests/testing/workbook05/test_post_c_workbook_pack.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-post-c-workbooks.yml'
      - 'docs/testing/Workbook-05-Post-C-*.csv'
      - 'docs/testing/workbooks/Controlled-Workbook-Manifest.csv'
      - 'docs/testing/workbooks/Workbook-05-Post-C-Pack-Manifest-v1.json'
      - 'docs/testing/workbooks/text-templates/0[7-9]_*.md'
      - 'docs/testing/workbooks/text-templates/1[0-3]_*.md'
      - 'docs/testing/workbooks/generated/0[7-9]_*.docx'
      - 'docs/testing/workbooks/generated/1[0-3]_*.docx'
      - 'scripts/testing/Generate-Controlled-Workbooks.py'
      - 'scripts/testing/Validate-Workbook05-PostC-Workbooks.ps1'
      - 'scripts/testing/workbook05/post_c_workbook_pack.py'
      - 'tests/testing/workbook05/test_post_c_workbook_pack.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-post-c-workbooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce-post-c-workbook-pack:
    name: Produce and verify post-C workbook pack
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact workbook revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/testing
            scripts/testing
            tests/testing/workbook05

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Install the pinned workbook toolchain
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\requirements.txt'

      - name: Run deterministic workbook production gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'workbook-05-post-c-pack'
          & '.\scripts\testing\Validate-Workbook05-PostC-Workbooks.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python' `
              -ArtifactDirectory $artifactDirectory
          if ($LASTEXITCODE -ne 0) {
              throw "Post-C workbook gate exited with code $LASTEXITCODE."
          }
          Write-Host 'WORKBOOK05_POST_C_WORKBOOK_PACK_PASS'

      - name: Upload exact same-attempt workbook artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-post-c-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-post-c-pack
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  validate-post-c-workbook-pack:
    name: Independently validate post-C workbook pack
    needs: produce-post-c-workbook-pack
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact validation revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/testing
            scripts/testing
            tests/testing/workbook05

      - name: Set up independent Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Install the pinned validation toolchain
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\requirements.txt'

      - name: Download the exact same-attempt artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: workbook-05-post-c-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-post-c-pack

      - name: Validate downloaded artifact as untrusted data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest -v `
              tests.testing.workbook05.test_post_c_workbook_pack
          if ($LASTEXITCODE -ne 0) {
              throw "Post-C workbook contracts exited with code $LASTEXITCODE."
          }

          $artifactRoot = Join-Path $env:RUNNER_TEMP 'workbook-05-post-c-pack'
          $reportPath = Join-Path $env:RUNNER_TEMP 'post-c-workbook-independent-validation.json'
          python -m scripts.testing.workbook05.post_c_workbook_pack `
              --repository-root $env:GITHUB_WORKSPACE `
              --artifact-root $artifactRoot `
              --report $reportPath
          if ($LASTEXITCODE -ne 0) {
              throw "Independent post-C artifact validation exited with code $LASTEXITCODE."
          }
          Write-Host 'WORKBOOK05_POST_C_INDEPENDENT_VALIDATION_PASS'

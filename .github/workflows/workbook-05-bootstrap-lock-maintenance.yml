name: Workbook 05 bootstrap lock maintenance

on:
  push:
    branches:
      - design/workbook-05-phase3-dependency-preflight
    paths:
      - '.github/workflows/workbook-05-bootstrap-lock-maintenance.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-bootstrap-lock-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-bootstrap-lock:
    name: Generate and verify the reviewed bootstrap lock
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      # Use one immutable checkout so the lock validator and generator input are
      # taken from the same exact feature-branch revision.
      - name: Check out the exact maintenance revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/workbook-05-bootstrap-lock-maintenance.yml
            scripts/testing/workbook05/phase3

      # The approved bootstrap is generated under the same interpreter version
      # used by the Lenovo dependency-preflight design.
      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Generate and independently reinstall the bootstrap lock
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # Resolve exactly one hosted Python executable rather than allowing a
          # multi-entry PATH result to become an invalid executable argument.
          $pythonPath = (
              Get-Command -Name python -CommandType Application -All -ErrorAction Stop |
                  Select-Object -First 1
          ).Source
          $pythonVersion = ((& $pythonPath --version 2>&1) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $pythonVersion -ne 'Python 3.12.10') {
              throw "Expected Python 3.12.10, observed: $pythonVersion"
          }

          # All one-time maintenance state stays beneath RUNNER_TEMP and is
          # discarded with the hosted runner. Nothing is installed globally.
          $root = Join-Path $env:RUNNER_TEMP 'wb05-bootstrap-lock-maintenance'
          $downloadRoot = Join-Path $root 'downloads'
          $generatorRoot = Join-Path $root 'generator-venv'
          $verificationRoot = Join-Path $root 'verification-venv'
          $artifactRoot = Join-Path $root 'artifact'
          foreach ($path in @($root, $downloadRoot, $artifactRoot)) {
              if (Test-Path -LiteralPath $path) {
                  throw "Unexpected retained maintenance path: $path"
              }
              New-Item -ItemType Directory -Path $path -Force:$false | Out-Null
          }

          # Download the exact official pip-tools and pip wheels only. Their
          # SHA-256 identities were checked against PyPI Trusted Publishing
          # metadata before this maintenance workflow was introduced.
          & $pythonPath -m pip download `
              --isolated `
              --disable-pip-version-check `
              --only-binary=:all: `
              --no-deps `
              --dest $downloadRoot `
              'pip-tools==7.6.0' `
              'pip==26.1.2'
          if ($LASTEXITCODE -ne 0) {
              throw "Official wheel download exited with code $LASTEXITCODE."
          }

          $pipToolsWheel = @(
              Get-ChildItem -LiteralPath $downloadRoot -Filter 'pip_tools-7.6.0-*.whl' -File
          )
          $pipWheel = @(
              Get-ChildItem -LiteralPath $downloadRoot -Filter 'pip-26.1.2-*.whl' -File
          )
          if ($pipToolsWheel.Count -ne 1 -or $pipWheel.Count -ne 1) {
              throw 'Expected exactly one pip-tools wheel and one pip wheel.'
          }

          $expectedPipToolsSha256 = '4bd99155b6d8de358a214b0865e1a2855a453570c1a83d40f7b564870b8657be'
          $expectedPipSha256 = '382ff9f685ee3bc25864f820aa50505825f10f5458ffff07e30a6d96e5715cab'
          $actualPipToolsSha256 = (
              Get-FileHash -LiteralPath $pipToolsWheel[0].FullName -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $actualPipSha256 = (
              Get-FileHash -LiteralPath $pipWheel[0].FullName -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualPipToolsSha256 -ne $expectedPipToolsSha256) {
              throw "Unexpected pip-tools wheel SHA-256: $actualPipToolsSha256"
          }
          if ($actualPipSha256 -ne $expectedPipSha256) {
              throw "Unexpected pip wheel SHA-256: $actualPipSha256"
          }

          # Build a disposable generator environment. Pin pip to the latest
          # 26.1 patch because pip-tools 7.6.0 explicitly supports pip 26.1,
          # while the newer pip 26.2 line is outside that reviewed guarantee.
          & $pythonPath -m venv $generatorRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Generator venv creation exited with code $LASTEXITCODE."
          }
          $generatorPython = Join-Path $generatorRoot 'Scripts\python.exe'
          & $generatorPython -m pip install `
              --isolated `
              --disable-pip-version-check `
              --no-deps `
              $pipWheel[0].FullName
          if ($LASTEXITCODE -ne 0) {
              throw "Pinned pip installation exited with code $LASTEXITCODE."
          }
          & $generatorPython -m pip install `
              --isolated `
              --disable-pip-version-check `
              $pipToolsWheel[0].FullName
          if ($LASTEXITCODE -ne 0) {
              throw "Pinned pip-tools installation exited with code $LASTEXITCODE."
          }

          $observedPipVersion = ((
              & $generatorPython -m pip --version
          ) | Out-String).Trim()
          $observedPipToolsVersion = ((
              & $generatorPython -c "import importlib.metadata; print(importlib.metadata.version('pip-tools'))"
          ) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedPipToolsVersion -ne '7.6.0') {
              throw "Expected pip-tools 7.6.0, observed: $observedPipToolsVersion"
          }
          if ($observedPipVersion -notmatch '^pip 26\.1\.2 ') {
              throw "Expected pip 26.1.2, observed: $observedPipVersion"
          }

          # Write the approved two-line input in the checkout only for this
          # hosted maintenance job. The final committed file is added later by
          # the test-first implementation commit.
          $inputPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\testing\workbook05\requirements.phase3-bootstrap.in'
          $outputPath = Join-Path $artifactRoot 'requirements.phase3-bootstrap.txt'
          [IO.File]::WriteAllText(
              $inputPath,
              "pip-tools==7.6.0`npip==26.1.2`n",
              [Text.UTF8Encoding]::new($false)
          )

          Push-Location -LiteralPath $env:GITHUB_WORKSPACE
          try {
              & $generatorPython -m piptools compile `
                  --no-config `
                  --resolver=backtracking `
                  --generate-hashes `
                  --strip-extras `
                  --allow-unsafe `
                  --no-emit-index-url `
                  --no-emit-trusted-host `
                  --no-header `
                  --output-file $outputPath `
                  'scripts/testing/workbook05/requirements.phase3-bootstrap.in'
              if ($LASTEXITCODE -ne 0) {
                  throw "Bootstrap lock generation exited with code $LASTEXITCODE."
              }
          }
          finally {
              Pop-Location
          }

          # Normalise the generated text to UTF-8 without BOM and LF endings so
          # repository bytes do not depend on the Windows host newline mode.
          $lockText = [IO.File]::ReadAllText($outputPath)
          $lockText = $lockText.Replace("`r`n", "`n").Replace("`r", "`n")
          if (-not $lockText.EndsWith("`n")) {
              $lockText += "`n"
          }
          [IO.File]::WriteAllText(
              $outputPath,
              $lockText,
              [Text.UTF8Encoding]::new($false)
          )

          # Reuse the repository's generic parser to prove the generated lock
          # contains both exact approved direct versions and only hashed pins.
          $lockValidationPath = Join-Path $artifactRoot 'lock-validation.json'
          & $generatorPython -m scripts.testing.workbook05.phase3.dependency_lock_cli `
              validate-lock `
              --lock $outputPath `
              --output $lockValidationPath `
              --required-direct 'pip-tools==7.6.0' `
              --required-direct 'pip==26.1.2' `
              --forbidden-name optimum `
              --forbidden-name optimum-intel
          if ($LASTEXITCODE -ne 0) {
              throw "Generated lock validation exited with code $LASTEXITCODE."
          }

          # Install the generated lock into a second clean environment with
          # hash checking enabled. This verifies the committed candidate does
          # not merely parse; every selected artifact is actually available.
          & $pythonPath -m venv $verificationRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Verification venv creation exited with code $LASTEXITCODE."
          }
          $verificationPython = Join-Path $verificationRoot 'Scripts\python.exe'
          $installReportPath = Join-Path $artifactRoot 'bootstrap-install-report.json'
          & $verificationPython -m pip install `
              --isolated `
              --disable-pip-version-check `
              --require-hashes `
              --no-deps `
              --report $installReportPath `
              -r $outputPath
          if ($LASTEXITCODE -ne 0) {
              throw "Hash-enforced bootstrap installation exited with code $LASTEXITCODE."
          }

          $reportValidationPath = Join-Path $artifactRoot 'report-validation.json'
          & $verificationPython -m scripts.testing.workbook05.phase3.dependency_lock_cli `
              validate-report `
              --lock $outputPath `
              --report $installReportPath `
              --output $reportValidationPath `
              --required-direct 'pip-tools==7.6.0' `
              --required-direct 'pip==26.1.2' `
              --forbidden-name optimum `
              --forbidden-name optimum-intel
          if ($LASTEXITCODE -ne 0) {
              throw "Bootstrap installation-report validation exited with code $LASTEXITCODE."
          }

          # Record the immutable generator inputs and official wheel identities
          # alongside the generated lock for independent review.
          $generation = [ordered]@{
              schema_version = '1.0'
              python_version = $pythonVersion
              pip_tools_version = $observedPipToolsVersion
              pip_version = '26.1.2'
              pip_tools_wheel_sha256 = $actualPipToolsSha256
              pip_wheel_sha256 = $actualPipSha256
              lock_sha256 = (
                  Get-FileHash -LiteralPath $outputPath -Algorithm SHA256
              ).Hash.ToLowerInvariant()
          }
          $generationPath = Join-Path $artifactRoot 'generation.json'
          [IO.File]::WriteAllText(
              $generationPath,
              (($generation | ConvertTo-Json -Depth 8) + "`n"),
              [Text.UTF8Encoding]::new($false)
          )

      - name: Upload generated text-only maintenance evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-bootstrap-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wb05-bootstrap-lock-maintenance/artifact
          if-no-files-found: error
          retention-days: 7

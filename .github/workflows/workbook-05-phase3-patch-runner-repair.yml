name: Workbook 05 Phase 3 patch runner repair

on:
  push:
    branches:
      - design/workbook-05-phase3-dependency-preflight
    paths:
      - '.github/maintenance/workbook05-phase3-repair-patch-runner.txt'

# Temporary, same-repository maintenance only. This workflow changes two
# pre-reviewed lines in the temporary patch runner and removes its trigger file.
# It is deleted before the pull request is offered for merge.
permissions:
  contents: write

concurrency:
  group: workbook-05-phase3-patch-runner-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-temporary-patch-runner:
    if: >-
      github.repository == 'arian20020/IBM-Granite-Edge-AI-Optimisation-using-TurboQuant' &&
      github.ref == 'refs/heads/design/workbook-05-phase3-dependency-preflight' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the exact repair request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Apply the closed two-line repair and push it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # Bind the repair to the exact reviewed temporary workflow blob. A
          # changed file must be reviewed again rather than edited implicitly.
          $workflowPath = '.github/workflows/workbook-05-phase3-text-patch-maintenance.yml'
          $expectedBlob = '1abc2fbbbdf59bd5f1b4c52834ee51ea0a43dc91'
          $actualBlob = ((git hash-object -- $workflowPath) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualBlob -ne $expectedBlob) {
              throw "Temporary patch-runner blob mismatch: $actualBlob"
          }

          # Move only the temporary runner to Linux so unrelated Windows-long
          # research paths cannot prevent checkout. Also parenthesise the
          # closed-key comparison to make PowerShell precedence explicit.
          $text = [IO.File]::ReadAllText($workflowPath)
          $oldRunner = '    runs-on: windows-2025'
          $newRunner = '    runs-on: ubuntu-24.04'
          $oldKeys = "          if (@(`$metadata.Keys | Sort-Object) -join ',' -ne @(`$requiredKeys | Sort-Object) -join ',') {"
          $newKeys = "          if ((@(`$metadata.Keys | Sort-Object) -join ',') -ne (@(`$requiredKeys | Sort-Object) -join ',')) {"
          if (-not $text.Contains($oldRunner) -or -not $text.Contains($oldKeys)) {
              throw 'The temporary patch runner does not have the reviewed source shape.'
          }
          $text = $text.Replace($oldRunner, $newRunner).Replace($oldKeys, $newKeys)
          [IO.File]::WriteAllText(
              $workflowPath,
              $text,
              [Text.UTF8Encoding]::new($false)
          )

          # The trigger is maintenance input, never repository content.
          Remove-Item -LiteralPath '.github/maintenance/workbook05-phase3-repair-patch-runner.txt' -Force
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Temporary patch-runner repair has whitespace errors.' }

          git config user.name 'arian20020'
          git config user.email 'arian20020@outlook.com'
          git add --all
          git commit -m 'chore(workbook05): repair temporary patch runner checkout'
          if ($LASTEXITCODE -ne 0) { throw 'Temporary patch-runner repair commit failed.' }
          git push origin "HEAD:$($env:GITHUB_REF_NAME)"
          if ($LASTEXITCODE -ne 0) { throw 'Temporary patch-runner repair push failed.' }

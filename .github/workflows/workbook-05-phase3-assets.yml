name: Workbook 05 Phase 3 assets

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-phase3-assets.yml'
      - '.github/workflows/build-and-test.yml'
      - 'docs/testing/workbook05/**'
      - 'docs/superpowers/**'
      - 'experiments/granite_turboquant_intel/configurations/workbook05/**'
      - 'experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1/**'
      - 'experiments/granite_turboquant_intel/manifests/templates/workbook05/**'
      - 'experiments/granite_turboquant_intel/schemas/workbook05/**'
      - 'scripts/testing/**'
      - 'tests/testing/workbook05/**'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Repository-safe offline fixture or the accepted live Granite 4.1 3B asset lock.'
        required: true
        type: choice
        default: offline-fixture
        options:
          - offline-fixture
          - live-asset-lock
      confirm_live_asset_lock:
        description: 'Required only for the accepted live model acquisition and conversion.'
        required: false
        type: boolean
        default: false
      accepted_dependency_preflight_sha256:
        description: 'Exact lowercase SHA-256 of the independently accepted dependency decision.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-phase3-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-contract:
    name: Verify Phase 3 repository contract
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # Both pull-request and manual checks inspect one exact immutable head.
      - name: Check out the exact Phase 3 revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      # Keep the repository-pinned schema validator outside the checkout and
      # outside the hosted Python installation.
      - name: Install pinned Phase 3 validation dependency
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonCommand = Get-Command -Name python -CommandType Application -All -ErrorAction Stop |
              Select-Object -First 1
          $pythonPath = $pythonCommand.Source
          $dependencyDirectory = Join-Path $env:RUNNER_TEMP 'workbook05-phase3-python'

          if (Test-Path -LiteralPath $dependencyDirectory) {
              Remove-Item -LiteralPath $dependencyDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $dependencyDirectory -Force:$false | Out-Null

          & $pythonPath `
              -m pip install `
              --disable-pip-version-check `
              --target $dependencyDirectory `
              -r 'scripts/testing/workbook05/requirements.txt'
          if ($LASTEXITCODE -ne 0) {
              throw "Phase 3 validation dependency installation exited with code $LASTEXITCODE."
          }

          $env:PYTHONPATH = $dependencyDirectory
          $observedVersion = ((
              & $pythonPath -c "import importlib.metadata; print(importlib.metadata.version('jsonschema'))"
          ) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne '4.25.1') {
              throw "Expected jsonschema 4.25.1, observed: $observedVersion"
          }
          "PYTHONPATH=$dependencyDirectory" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Run focused dependency-fixture diagnostic
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\tests\testing\workbook05\Invoke-Phase3DependencyPreflightTests.Tests.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python'

      # Pull requests can reach only this hosted repository contract.
      - name: Run the complete Phase 3 repository gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python'

  collect-assets:
    name: Collect controlled C1 asset evidence
    needs: repository-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - workbook05
      - intel-target
    timeout-minutes: 720

    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Check out the exact Phase 3 revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Verify pinned machine Python and manual-input boundary
        id: boundary
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonPath = 'C:\Program Files\Python312\python.exe'
          if (-not (Test-Path -LiteralPath $pythonPath -PathType Leaf)) {
              throw "Pinned Python was not found: $pythonPath"
          }
          $version = ((& $pythonPath --version 2>&1) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'Python 3.12.10') {
              throw "Expected Python 3.12.10, observed: $version"
          }

          $operation = '${{ inputs.operation }}'
          $confirmed = '${{ inputs.confirm_live_asset_lock }}'
          $digest = '${{ inputs.accepted_dependency_preflight_sha256 }}'
          $acceptedDigest = '429b90548ce2b4c8463941c5b2983c8ff0cf6cc3ea3865375c8cae78d7193b49'

          if ($operation -notin @('offline-fixture', 'live-asset-lock')) {
              throw "Unsupported Phase 3 asset operation: $operation"
          }
          if ($operation -eq 'live-asset-lock') {
              if ($confirmed -ne 'true') {
                  throw 'Live asset locking requires explicit confirmation.'
              }
              if ($digest -notmatch '^[0-9a-f]{64}$') {
                  throw 'Live asset locking requires a lowercase dependency decision SHA-256.'
              }
              if ($digest -ne $acceptedDigest) {
                  throw 'The supplied dependency decision is not the independently accepted C1 prerequisite.'
              }
          }
          elseif ($confirmed -eq 'true' -or -not [string]::IsNullOrEmpty($digest)) {
              throw 'Offline fixture mode must not receive live asset-lock authority inputs.'
          }

          "python_path=$pythonPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "operation=$operation" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      # This job-local dependency is used only by repository and evidence
      # validators. It is never installed into the accepted conversion venv.
      - name: Install pinned Phase 3 validation dependency
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonPath = '${{ steps.boundary.outputs.python_path }}'
          $dependencyDirectory = Join-Path $env:RUNNER_TEMP 'workbook05-phase3-python'

          if (Test-Path -LiteralPath $dependencyDirectory) {
              Remove-Item -LiteralPath $dependencyDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $dependencyDirectory -Force:$false | Out-Null

          & $pythonPath `
              -m pip install `
              --disable-pip-version-check `
              --target $dependencyDirectory `
              -r 'scripts/testing/workbook05/requirements.txt'
          if ($LASTEXITCODE -ne 0) {
              throw "Phase 3 validation dependency installation exited with code $LASTEXITCODE."
          }

          $env:PYTHONPATH = $dependencyDirectory
          $observedVersion = ((
              & $pythonPath -c "import importlib.metadata; print(importlib.metadata.version('jsonschema'))"
          ) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne '4.25.1') {
              throw "Expected jsonschema 4.25.1, observed: $observedVersion"
          }
          "PYTHONPATH=$dependencyDirectory" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Run the complete Phase 3 repository gate
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath '${{ steps.boundary.outputs.python_path }}'

      - name: Verify accepted dependency binding before model access
        if: ${{ inputs.operation == 'live-asset-lock' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:RUNNER_TEMP 'workbook05-c1-dependency-proof.json'
          if (Test-Path -LiteralPath $proof) {
              throw "Unexpected dependency proof destination: $proof"
          }

          & '${{ steps.boundary.outputs.python_path }}' `
              -m scripts.testing.workbook05.phase3.dependency_acceptance `
              --repository-root $env:GITHUB_WORKSPACE `
              --accepted-decision-sha256 '${{ inputs.accepted_dependency_preflight_sha256 }}' `
              --output $proof
          if ($LASTEXITCODE -ne 0) {
              throw "Accepted dependency verification exited with code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath $proof -PathType Leaf)) {
              throw 'Accepted dependency verification did not publish its proof.'
          }

      # The offline route remains deterministic, network-free, and model-free.
      - name: Collect text-only offline fixture evidence
        if: ${{ inputs.operation == 'offline-fixture' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-assets'
          $modelRoot = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-fixture-models'

          if (Test-Path -LiteralPath $workspace) {
              throw "Unexpected retained evidence workspace: $workspace"
          }
          if (Test-Path -LiteralPath $modelRoot) {
              throw "Unexpected retained fixture model root: $modelRoot"
          }

          & '.\scripts\testing\workbook05\Invoke-Workbook05Phase3AssetLock.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -WorkspaceRoot $workspace `
              -ModelRoot $modelRoot `
              -PythonPath '${{ steps.boundary.outputs.python_path }}' `
              -OfflineFixtureMode

      # Live C1 re-verifies the accepted dependency inside the controlled script
      # before C:\w5m is created or the Hub is contacted.
      - name: Collect accepted live Granite 4.1 3B asset evidence
        if: ${{ inputs.operation == 'live-asset-lock' }}
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\workbook05\Invoke-Workbook05Phase3AssetLockLive.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -RunId '${{ github.run_id }}' `
              -RunAttempt ${{ github.run_attempt }} `
              -AcceptedDependencyDecisionSha256 '${{ inputs.accepted_dependency_preflight_sha256 }}' `
              -BasePythonPath '${{ steps.boundary.outputs.python_path }}'

      # Upload only the text evidence subtree. Model weights and OpenVINO IR
      # remain outside the artifact under the retained C:\w5m model root.
      - name: Stage live text-only C1 evidence for upload
        if: ${{ always() && inputs.operation == 'live-asset-lock' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (
              'C:\w5c\phase3-assets-${{ github.run_id }}-' +
              '${{ github.run_attempt }}\evidence'
          )
          $destination = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-assets'

          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
              throw "Live C1 evidence root is missing: $source"
          }
          if (Test-Path -LiteralPath $destination) {
              throw "Unexpected staged C1 evidence destination: $destination"
          }
          $sourceItem = Get-Item -LiteralPath $source -Force -ErrorAction Stop
          if (($sourceItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Live C1 evidence root is a reparse point: $source"
          }

          $forbidden = @(
              '.7z', '.bin', '.ckpt', '.dll', '.exe', '.gguf', '.gz',
              '.lib', '.onnx', '.pt', '.pth', '.pyd', '.safetensors',
              '.so', '.tar', '.tgz', '.whl', '.xml', '.zip'
          )
          foreach ($item in Get-ChildItem -LiteralPath $source -Recurse -Force) {
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                  throw "Live C1 evidence contains a reparse point: $($item.FullName)"
              }
              if (-not $item.PSIsContainer -and $item.Extension.ToLowerInvariant() -in $forbidden) {
                  throw "Live C1 evidence contains a forbidden payload: $($item.FullName)"
              }
          }

          New-Item -ItemType Directory -Path $destination -Force:$false | Out-Null
          Get-ChildItem -LiteralPath $source -Force |
              Copy-Item -Destination $destination -Recurse -ErrorAction Stop

      - name: Upload exact text-only C1 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-phase3-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbook-05-phase3-assets
          if-no-files-found: error
          retention-days: 30

  validate-assets:
    name: Validate C1 artifact as untrusted data
    needs: collect-assets
    if: ${{ always() && needs.collect-assets.result != 'skipped' }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact Phase 3 revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Set up independent validation Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Install pinned Phase 3 validation dependency
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonCommand = Get-Command -Name python -CommandType Application -All -ErrorAction Stop |
              Select-Object -First 1
          $pythonPath = $pythonCommand.Source
          $dependencyDirectory = Join-Path $env:RUNNER_TEMP 'workbook05-phase3-python'

          if (Test-Path -LiteralPath $dependencyDirectory) {
              Remove-Item -LiteralPath $dependencyDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $dependencyDirectory -Force:$false | Out-Null

          & $pythonPath `
              -m pip install `
              --disable-pip-version-check `
              --target $dependencyDirectory `
              -r 'scripts/testing/workbook05/requirements.txt'
          if ($LASTEXITCODE -ne 0) {
              throw "Phase 3 validation dependency installation exited with code $LASTEXITCODE."
          }

          $env:PYTHONPATH = $dependencyDirectory
          $observedVersion = ((
              & $pythonPath -c "import importlib.metadata; print(importlib.metadata.version('jsonschema'))"
          ) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne '4.25.1') {
              throw "Expected jsonschema 4.25.1, observed: $observedVersion"
          }
          "PYTHONPATH=$dependencyDirectory" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Run the complete Phase 3 repository gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python'

      - name: Download the exact same-attempt C1 artifact
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561
        with:
          name: workbook-05-phase3-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbook-05-phase3-assets

      - name: Validate the artifact strictly as untrusted data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-assets'
          $report = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-assets-validation.md'

          $validator = if ('${{ inputs.operation }}' -eq 'live-asset-lock') {
              'scripts.testing.workbook05.phase3.live_asset_bundle_validation'
          }
          else {
              'scripts.testing.workbook05.phase3.asset_bundle_validation'
          }

          & python -m $validator `
              --bundle-root $bundle `
              --repository-root $env:GITHUB_WORKSPACE `
              --report $report
          $validationExitCode = $LASTEXITCODE

          if (Test-Path -LiteralPath $report -PathType Leaf) {
              Get-Content -LiteralPath $report |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          if ($validationExitCode -ne 0) {
              throw "C1 artifact validation exited with code $validationExitCode."
          }

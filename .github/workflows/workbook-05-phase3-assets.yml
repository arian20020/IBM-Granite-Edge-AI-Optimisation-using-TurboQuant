name: Workbook 05 Phase 3 assets

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-phase3-assets.yml'
      - '.github/workflows/build-and-test.yml'
      - 'docs/testing/workbook05/**'
      - 'docs/superpowers/**'
      - 'experiments/granite_turboquant_intel/configurations/workbook05/**'
      - 'experiments/granite_turboquant_intel/manifests/templates/workbook05/**'
      - 'experiments/granite_turboquant_intel/schemas/workbook05/**'
      - 'scripts/testing/**'
      - 'tests/testing/workbook05/**'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Repository-safe offline fixture, or the later accepted live asset lock.'
        required: true
        type: choice
        default: offline-fixture
        options:
          - offline-fixture
          - live-asset-lock
      confirm_live_asset_lock:
        description: 'Required only for live asset locking after dependency-preflight acceptance.'
        required: false
        type: boolean
        default: false
      accepted_dependency_preflight_sha256:
        description: 'Lowercase SHA-256 of the independently accepted dependency-preflight decision.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-phase3-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-contract:
    name: Verify Phase 3 repository contract
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # Both pull-request and manual checks inspect one exact immutable head.
      - name: Check out the exact Phase 3 revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      # This job has no model path, model dependency environment, or self-hosted
      # runner access. Pull requests can reach only this repository contract.
      - name: Run the complete Phase 3 repository gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python'

  collect-assets:
    name: Collect controlled C1 asset evidence
    needs: repository-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - workbook05
      - intel-target
    timeout-minutes: 720

    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Check out the exact Phase 3 revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Verify pinned machine Python and live-input boundary
        id: boundary
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonPath = 'C:\Program Files\Python312\python.exe'
          if (-not (Test-Path -LiteralPath $pythonPath -PathType Leaf)) {
              throw "Pinned Python was not found: $pythonPath"
          }
          $version = ((& $pythonPath --version 2>&1) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'Python 3.12.10') {
              throw "Expected Python 3.12.10, observed: $version"
          }

          $operation = '${{ inputs.operation }}'
          if ($operation -eq 'live-asset-lock') {
              $confirmed = '${{ inputs.confirm_live_asset_lock }}'
              $digest = '${{ inputs.accepted_dependency_preflight_sha256 }}'
              if ($confirmed -ne 'true') {
                  throw 'Live asset locking is blocked until explicit confirmation is true.'
              }
              if ($digest -notmatch '^[0-9a-f]{64}$') {
                  throw 'Live asset locking is blocked until an accepted lowercase preflight SHA-256 is supplied.'
              }
              throw (
                  'Live asset locking is blocked in this revision because the clean ' +
                  'Windows dependency-preflight lock has not yet been accepted into main.'
              )
          }

          "python_path=$pythonPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Run the complete Phase 3 repository gate
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath '${{ steps.boundary.outputs.python_path }}'

      # The current safe operation is an offline fixture. It proves workflow,
      # ordering, atomic evidence, and hosted validation without network/model use.
      - name: Collect text-only offline fixture evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-assets'
          $modelRoot = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-fixture-models'

          if (Test-Path -LiteralPath $workspace) {
              throw "Unexpected retained evidence workspace: $workspace"
          }
          if (Test-Path -LiteralPath $modelRoot) {
              throw "Unexpected retained fixture model root: $modelRoot"
          }

          & '.\scripts\testing\workbook05\Invoke-Workbook05Phase3AssetLock.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -WorkspaceRoot $workspace `
              -ModelRoot $modelRoot `
              -PythonPath '${{ steps.boundary.outputs.python_path }}' `
              -OfflineFixtureMode

      - name: Upload exact text-only C1 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-phase3-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbook-05-phase3-assets
          if-no-files-found: error
          retention-days: 30

  validate-assets:
    name: Validate C1 artifact as untrusted data
    needs: collect-assets
    if: ${{ always() && needs.collect-assets.result != 'skipped' }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact Phase 3 revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Set up independent validation Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Run the complete Phase 3 repository gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python'

      - name: Download the exact same-attempt C1 artifact
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561
        with:
          name: workbook-05-phase3-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbook-05-phase3-assets

      - name: Validate the artifact strictly as untrusted data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-assets'
          $report = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-assets-validation.md'

          python -m scripts.testing.workbook05.phase3.asset_bundle_validation `
              --bundle-root $bundle `
              --repository-root $env:GITHUB_WORKSPACE `
              --report $report
          $validationExitCode = $LASTEXITCODE

          if (Test-Path -LiteralPath $report -PathType Leaf) {
              Get-Content -LiteralPath $report |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          if ($validationExitCode -ne 0) {
              throw "C1 artifact validation exited with code $validationExitCode."
          }

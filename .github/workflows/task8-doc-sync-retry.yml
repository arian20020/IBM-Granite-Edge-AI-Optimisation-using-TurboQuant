name: Task 8 documentation sync retry

on:
  push:
    branches:
      - refactor/model-inspection-cleanup

permissions:
  contents: write

jobs:
  refresh-docs:
    runs-on: windows-latest

    steps:
      - name: Check out complete verification inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          sparse-checkout: |
            .github
            docs
            IBM Granite with TurboQuant (Intel)
            infrastructure
            scripts
            shared
            tests
            tools
            workers

      - name: Apply only stale Phase 1 documentation corrections
        shell: pwsh
        run: ./.github/workflows/task8-doc-sync-helper.ps1

      - name: Verify documentation scope and permanent cleanup contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $docs = @(
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Contracts/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Controls/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Models/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Presentation/README.md'
          )

          $combined = ($docs | ForEach-Object { Get-Content -Raw $_ }) -join "`n"
          foreach ($text in @(
              'SelectedModelPath',
              'Features/Onboarding/Controls/InspectionContentTemplateSelectorTests.cs',
              'Shared-instance caution',
              'Gate 2 should add the worker executable boundary',
              'no production worker executable or launch path'
          )) {
              if ($combined.Contains($text)) {
                  throw "Stale Phase 1 documentation text remains: $text"
              }
          }

          if (-not $combined.Contains('controlled unavailable inspection engine')) {
              throw 'Controlled unavailable-engine limitation is missing'
          }
          if (-not $combined.Contains('fixed ARGB values')) {
              throw 'Deferred fixed-brush theming debt was removed'
          }

          ./scripts/model-inspection/Verify-ModelInspectionCleanupInventory.ps1

      - name: Commit documentation and remove temporary Task 8 machinery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          git rm -- '.github/workflows/task8-doc-sync-temp.yml'
          git rm -- '.github/workflows/task8-doc-sync-retry.yml'
          git rm -- '.github/workflows/task8-doc-sync-helper.ps1'

          $allowed = @(
              '.github/workflows/task8-doc-sync-temp.yml',
              '.github/workflows/task8-doc-sync-retry.yml',
              '.github/workflows/task8-doc-sync-helper.ps1',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Contracts/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Controls/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Models/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Presentation/README.md'
          )

          $changed = @(git diff --name-only HEAD)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -ne 0) {
              throw "Unexpected Task 8 changes: $($unexpected -join ', ')"
          }

          foreach ($required in $allowed[3..7]) {
              if ($required -notin $changed) {
                  throw "Expected Task 8 documentation change is missing: $required"
              }
          }

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'docs(model-inspection): align Phase 1 boundary documentation'
          git push origin HEAD:refactor/model-inspection-cleanup

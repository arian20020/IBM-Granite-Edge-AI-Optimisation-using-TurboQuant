name: OpenVINO trusted UCL Intel CPU evidence

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Exact reviewed lowercase 40-character commit SHA
        required: true
        type: string
      authorization:
        description: Explicit UCL gate identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openvino-ucl-intel-cpu
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  OPENVINO_UCL_01_AUTHORIZED: ${{ vars.OPENVINO_UCL_01_AUTHORIZED }}
  OPENVINO_EVIDENCE_COMMIT: ${{ inputs.target_commit }}
  OPENVINO_ARCHIVES: ${{ vars.OPENVINO_UCL_ARCHIVE_DIRECTORY }}
  OPENVINO_CONTROLLED_FIXTURE: ${{ vars.OPENVINO_UCL_FIXTURE_ROOT }}
  OPENVINO_EXPECTED_MODEL_LENGTH: ${{ vars.OPENVINO_UCL_MODEL_LENGTH }}
  OPENVINO_EXPECTED_MODEL_SHA256: ${{ vars.OPENVINO_UCL_MODEL_SHA256 }}
  OPENVINO_BUILD_A: ${{ runner.temp }}/openvino-ucl-build-a
  OPENVINO_BUILD_B: ${{ runner.temp }}/openvino-ucl-build-b
  OPENVINO_STAGE_A: ${{ runner.temp }}/openvino-ucl-stage-a
  OPENVINO_STAGE_B: ${{ runner.temp }}/openvino-ucl-stage-b
  OPENVINO_RESULTS: ${{ runner.temp }}/openvino-ucl-results
  OPENVINO_EVIDENCE: artifacts/openvino/evidence

jobs:
  trusted-intel-cpu:
    name: Controlled Intel CPU official route
    environment: openvino-ucl-01
    runs-on:
      - self-hosted
      - Windows
      - X64
      - workbook05
      - intel-target
    timeout-minutes: 120

    steps:
      - name: Fail closed before repository code on UCL-01 and immutable inputs
        timeout-minutes: 2
        run: |
          if ($env:OPENVINO_UCL_01_AUTHORIZED -cne 'UCL-01-approved' -or
              '${{ inputs.authorization }}' -cne 'UCL-01') {
            throw 'UCL-01 authorization is absent.'
          }
          if ($env:OPENVINO_EVIDENCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The reviewed target commit is not an exact lowercase SHA.'
          }
          foreach ($value in @(
            $env:OPENVINO_ARCHIVES,
            $env:OPENVINO_CONTROLLED_FIXTURE,
            $env:OPENVINO_EXPECTED_MODEL_LENGTH,
            $env:OPENVINO_EXPECTED_MODEL_SHA256)) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw 'A controlled UCL input is unavailable.'
            }
          }

      - name: Check out the exact reviewed commit without retained credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout and controlled read-only Intel inputs
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -cne $env:OPENVINO_EVIDENCE_COMMIT -or
              (git status --porcelain).Count -ne 0) {
            throw 'The trusted checkout is not the exact clean reviewed commit.'
          }
          if ($env:RUNNER_ARCH -cne 'X64') {
            throw 'The trusted job requires the exact X64 runner architecture.'
          }
          $manufacturer = [string](Get-CimInstance Win32_Processor |
            Select-Object -First 1 -ExpandProperty Manufacturer)
          if ($manufacturer -notmatch 'GenuineIntel|Intel') {
            throw 'The trusted CPU is not GenuineIntel.'
          }

          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          $workspacePrefix = $workspace + '\'
          $fixture = [IO.Path]::GetFullPath($env:OPENVINO_CONTROLLED_FIXTURE)
          $archives = [IO.Path]::GetFullPath($env:OPENVINO_ARCHIVES)
          $ModelOutsideWorkspace = -not $fixture.StartsWith(
            $workspacePrefix, [StringComparison]::OrdinalIgnoreCase)
          if (-not $ModelOutsideWorkspace -or
              $archives.StartsWith($workspacePrefix,[StringComparison]::OrdinalIgnoreCase)) {
            throw 'Controlled UCL inputs must remain outside the repository workspace.'
          }
          $modelPath = Join-Path $fixture 'package/openvino_model.bin'
          $model = Get-Item -LiteralPath $modelPath -Force
          $ExpectedModelLength = [long]$env:OPENVINO_EXPECTED_MODEL_LENGTH
          $ExpectedModelSha256 = $env:OPENVINO_EXPECTED_MODEL_SHA256
          $IsReadOnly = $model.IsReadOnly
          $actualModelSha = (Get-FileHash -LiteralPath $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $IsReadOnly -or $model.Length -ne $ExpectedModelLength -or
              $ExpectedModelSha256 -cnotmatch '^[0-9a-f]{64}$' -or
              $actualModelSha -cne $ExpectedModelSha256) {
            throw 'The controlled model failed read-only length/SHA-256 verification.'
          }
          foreach ($entry in Get-ChildItem -LiteralPath $fixture -Recurse -Force) {
            if (($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                (-not $entry.PSIsContainer -and -not $entry.IsReadOnly)) {
              throw 'The controlled fixture is not a closed read-only tree.'
            }
          }
          foreach ($archive in Get-ChildItem -LiteralPath $archives -File -Force) {
            if (-not $archive.IsReadOnly) {
              throw 'Every controlled dependency archive must be read-only.'
            }
          }

      - name: Set up repository .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

      - name: Verify controlled official dependencies and external fixture
        timeout-minutes: 15
        run: |
          $dependency = & powershell.exe -NoLogo -NoProfile -NonInteractive `
            -ExecutionPolicy Bypass -File scripts/openvino/Test-OpenVinoDependencyLocks.ps1 `
            -ClosureDirectory $env:OPENVINO_ARCHIVES -Scope Official
          if ($LASTEXITCODE -ne 0 -or [string]$dependency -cne 'dependency_lock_valid') {
            throw 'Controlled official dependencies failed verification.'
          }
          $fixture = & powershell.exe -NoLogo -NoProfile -NonInteractive `
            -ExecutionPolicy Bypass -File scripts/openvino/Test-OpenVinoGenAiFixture.ps1 `
            -FixtureRoot $env:OPENVINO_CONTROLLED_FIXTURE
          if ($LASTEXITCODE -ne 0 -or [string]$fixture -cne 'fixture_valid') {
            throw 'Controlled external fixture failed verification.'
          }

      - name: Build independent reviewed Release x64 closure A
        timeout-minutes: 35
        run: |
          foreach ($owned in @($env:OPENVINO_BUILD_A,$env:OPENVINO_STAGE_A,$env:OPENVINO_RESULTS)) {
            if (Test-Path -LiteralPath $owned) { throw 'An operation-owned UCL path already exists.' }
          }
          New-Item -ItemType Directory -Path $env:OPENVINO_RESULTS | Out-Null
          & powershell.exe -NoLogo -NoProfile -NonInteractive `
            -ExecutionPolicy Bypass -File scripts/openvino/Build-OpenVinoOfficialWorker.ps1 `
            -OfficialArchiveDirectory $env:OPENVINO_ARCHIVES `
            -BuildDirectory $env:OPENVINO_BUILD_A -StageDirectory $env:OPENVINO_STAGE_A
          if ($LASTEXITCODE -ne 0) { throw 'Trusted native closure A failed.' }

      - name: Build independent reviewed Release x64 closure B
        timeout-minutes: 35
        run: |
          foreach ($owned in @($env:OPENVINO_BUILD_B,$env:OPENVINO_STAGE_B)) {
            if (Test-Path -LiteralPath $owned) { throw 'An operation-owned UCL path already exists.' }
          }
          & powershell.exe -NoLogo -NoProfile -NonInteractive `
            -ExecutionPolicy Bypass -File scripts/openvino/Build-OpenVinoOfficialWorker.ps1 `
            -OfficialArchiveDirectory $env:OPENVINO_ARCHIVES `
            -BuildDirectory $env:OPENVINO_BUILD_B -StageDirectory $env:OPENVINO_STAGE_B
          if ($LASTEXITCODE -ne 0) { throw 'Trusted native closure B failed.' }

      - name: Record trusted native unit count
        timeout-minutes: 8
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $ctest = Join-Path $installation 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/ctest.exe'
          & $ctest --test-dir (Join-Path $env:OPENVINO_BUILD_A 'native') `
            -C Release --output-on-failure `
            --output-junit (Join-Path $env:OPENVINO_RESULTS 'native.xml')
          if ($LASTEXITCODE -ne 0) { throw 'Trusted native unit evidence failed.' }

      - name: Run reviewed contract static adapter and tamper partitions
        timeout-minutes: 30
        env:
          GRANITE_OPENVINO_OFFICIAL_WORKER_STAGE: ${{ env.OPENVINO_STAGE_B }}
        run: |
          dotnet test --project tests/ContractTests/GraniteEdgeAI.OpenVino.Contracts.Tests/GraniteEdgeAI.OpenVino.Contracts.Tests.csproj `
            --configuration Release -p:Platform=x64 --minimum-expected-tests 60 `
            --results-directory $env:OPENVINO_RESULTS --report-trx --report-trx-filename contracts.trx
          if ($LASTEXITCODE -ne 0) { throw 'Trusted contract tests failed.' }
          dotnet test --project tests/UnitTests/GraniteEdgeAI.OpenVino.Tests/GraniteEdgeAI.OpenVino.Tests.csproj `
            --configuration Release -p:Platform=x64 --minimum-expected-tests 177 `
            --results-directory $env:OPENVINO_RESULTS --report-trx --report-trx-filename static-inspection.trx
          if ($LASTEXITCODE -ne 0) { throw 'Trusted static route tests failed.' }
          dotnet test --project tests/UnitTests/GraniteEdgeAI.OpenVino.Tests/GraniteEdgeAI.OpenVino.Tests.csproj `
            --configuration Release -p:Platform=x64 `
            --filter "FullyQualifiedName~OpenVinoPromptAdapterTests|FullyQualifiedName~OpenVinoRouteStateMachineTests" `
            --minimum-expected-tests 35 --results-directory $env:OPENVINO_RESULTS `
            --report-trx --report-trx-filename app-adapter.trx
          if ($LASTEXITCODE -ne 0) { throw 'Trusted app adapter tests failed.' }
          dotnet test --project tests/UnitTests/GraniteEdgeAI.OpenVino.Tests/GraniteEdgeAI.OpenVino.Tests.csproj `
            --configuration Release -p:Platform=x64 `
            --filter FullyQualifiedName~OpenVinoWorkerPackagingTargetTests `
            --minimum-expected-tests 5 --results-directory $env:OPENVINO_RESULTS `
            --report-trx --report-trx-filename package-tamper.trx
          if ($LASTEXITCODE -ne 0) { throw 'Trusted package tamper tests failed.' }

      - name: Run one-turn two-turn cancellation hostile and containment gates
        timeout-minutes: 25
        env:
          OPENVINO_OFFICIAL_WORKER_STAGE_A: ${{ env.OPENVINO_STAGE_A }}
          OPENVINO_OFFICIAL_WORKER_STAGE_B: ${{ env.OPENVINO_STAGE_B }}
        run: |
          dotnet test --project tests/UnitTests/GraniteEdgeAI.OpenVino.WorkerClient.Tests/GraniteEdgeAI.OpenVino.WorkerClient.Tests.csproj `
            --configuration Release -p:Platform=x64 --minimum-expected-tests 13 `
            --results-directory $env:OPENVINO_RESULTS --report-trx --report-trx-filename worker-client.trx
          if ($LASTEXITCODE -ne 0) { throw 'Trusted WorkerClient tests failed.' }
          $durations = New-Object 'System.Collections.Generic.List[long]'
          foreach ($run in 1..3) {
            $watch = [Diagnostics.Stopwatch]::StartNew()
            dotnet test --project tests/IntegrationTests/GraniteEdgeAI.OpenVino.WorkerProcess.Tests/GraniteEdgeAI.OpenVino.WorkerProcess.Tests.csproj `
              --configuration Release -p:Platform=x64 --minimum-expected-tests 40 `
              --results-directory $env:OPENVINO_RESULTS --report-trx `
              --report-trx-filename "process-containment-$run.trx"
            $watch.Stop()
            if ($LASTEXITCODE -ne 0) { throw 'Trusted protected process tests failed.' }
            $durations.Add($watch.ElapsedMilliseconds)
          }
          Copy-Item -LiteralPath (Join-Path $env:OPENVINO_RESULTS 'process-containment-3.trx') `
            -Destination (Join-Path $env:OPENVINO_RESULTS 'process-containment.trx')
          "OPENVINO_PERFORMANCE_MS=$($durations -join ',')" |
            Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release x64 app against trusted closure
        timeout-minutes: 25
        run: |
          $manifestSha = (Get-FileHash `
            -LiteralPath (Join-Path $env:OPENVINO_STAGE_B 'worker-manifest.json') `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          msbuild 'IBM Granite with TurboQuant (Intel)/IBM Granite with TurboQuant (Intel).csproj' `
            /restore /target:Build /maxCpuCount /verbosity:minimal `
            /property:Configuration=Release /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64 /property:PublishProfile= `
            /property:PublishTrimmed=false /property:PublishReadyToRun=false `
            /property:AppxPackageSigningEnabled=false /property:GenerateAppxPackageOnBuild=false `
            /property:OpenVinoOfficialWorkerStageDirectory=$env:OPENVINO_STAGE_B `
            /property:OpenVinoOfficialWorkerManifestSha256=$manifestSha
          if ($LASTEXITCODE -ne 0) { throw 'Trusted Release x64 app build failed.' }

      - name: Create typed sanitized UCL Intel evidence
        id: evidence
        timeout-minutes: 5
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File scripts/openvino/Invoke-OpenVinoOfficialEvidence.ps1 `
            -EvidenceKind ucl -ExpectedCommitSha $env:OPENVINO_EVIDENCE_COMMIT `
            -OfficialArchiveDirectory $env:OPENVINO_ARCHIVES `
            -WorkerStageDirectory $env:OPENVINO_STAGE_B `
            -FixtureRoot $env:OPENVINO_CONTROLLED_FIXTURE `
            -TestResultsDirectory $env:OPENVINO_RESULTS `
            -NativeResultsPath (Join-Path $env:OPENVINO_RESULTS 'native.xml') `
            -CpuVendor Intel -PerformanceDurationsMilliseconds $env:OPENVINO_PERFORMANCE_MS `
            -ExpectedModelLength ([long]$env:OPENVINO_EXPECTED_MODEL_LENGTH) `
            -ExpectedModelSha256 $env:OPENVINO_EXPECTED_MODEL_SHA256 `
            -EvidencePath (Join-Path $env:OPENVINO_EVIDENCE 'ucl.json')
          if ($LASTEXITCODE -ne 0) { throw 'Trusted UCL evidence generation failed.' }

      - name: Verify pre-post integrity zero residue and clean operation-owned state
        id: integrity
        if: ${{ always() }}
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Continue'
          $failed = $false
          foreach ($stage in @($env:OPENVINO_STAGE_A,$env:OPENVINO_STAGE_B)) {
            $output = & powershell.exe -NoLogo -NoProfile -NonInteractive `
              -ExecutionPolicy Bypass -File scripts/openvino/Test-OpenVinoOfficialWorkerManifest.ps1 `
              -StageDirectory $stage
            if ($LASTEXITCODE -ne 0 -or [string]$output -cne 'worker_manifest_valid') { $failed = $true }
          }
          $dependency = & powershell.exe -NoLogo -NoProfile -NonInteractive `
            -ExecutionPolicy Bypass -File scripts/openvino/Test-OpenVinoDependencyLocks.ps1 `
            -ClosureDirectory $env:OPENVINO_ARCHIVES -Scope Official
          if ($LASTEXITCODE -ne 0 -or [string]$dependency -cne 'dependency_lock_valid') { $failed = $true }
          $fixture = & powershell.exe -NoLogo -NoProfile -NonInteractive `
            -ExecutionPolicy Bypass -File scripts/openvino/Test-OpenVinoGenAiFixture.ps1 `
            -FixtureRoot $env:OPENVINO_CONTROLLED_FIXTURE
          if ($LASTEXITCODE -ne 0 -or [string]$fixture -cne 'fixture_valid') { $failed = $true }
          $modelPath = Join-Path $env:OPENVINO_CONTROLLED_FIXTURE 'package/openvino_model.bin'
          $model = Get-Item -LiteralPath $modelPath -Force -ErrorAction SilentlyContinue
          $postHash = (Get-FileHash -LiteralPath $modelPath -Algorithm SHA256 -ErrorAction SilentlyContinue).Hash.ToLowerInvariant()
          if ($null -eq $model -or -not $model.IsReadOnly -or
              $model.Length -ne [long]$env:OPENVINO_EXPECTED_MODEL_LENGTH -or
              $postHash -cne $env:OPENVINO_EXPECTED_MODEL_SHA256) { $failed = $true }
          $remaining = @(Get-Process -Name 'OpenVinoOfficial.Worker','GraniteEdgeAI.OpenVino.ProtocolTestWorker','GraniteEdgeAI.OpenVino.ParentExitFixture' -ErrorAction SilentlyContinue)
          if ($remaining.Count -ne 0) {
            $remaining | Stop-Process -Force -ErrorAction SilentlyContinue
            $failed = $true
          }
          $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          foreach ($owned in @($env:OPENVINO_BUILD_A,$env:OPENVINO_BUILD_B,$env:OPENVINO_STAGE_A,$env:OPENVINO_STAGE_B,$env:OPENVINO_RESULTS)) {
            $full = [IO.Path]::GetFullPath($owned)
            if (-not $full.StartsWith($tempRoot,[StringComparison]::OrdinalIgnoreCase)) { $failed = $true; continue }
            if (Test-Path -LiteralPath $full) { Remove-Item -LiteralPath $full -Recurse -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $full) { $failed = $true }
          }
          if ($failed) { throw 'Trusted UCL integrity or zero-residue cleanup failed.' }

      - name: Privacy-check sanitized UCL evidence
        id: privacy
        if: ${{ always() }}
        timeout-minutes: 3
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File scripts/openvino/Test-OpenVinoEvidencePrivacy.ps1 `
            -EvidencePath (Join-Path $env:OPENVINO_EVIDENCE 'ucl.json')
          if ($LASTEXITCODE -ne 0) { throw 'Trusted evidence privacy verification failed.' }

      - name: Upload sanitized UCL evidence only
        if: ${{ always() && steps.evidence.outcome == 'success' && steps.integrity.outcome == 'success' && steps.privacy.outcome == 'success' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: openvino-ucl-intel-${{ env.OPENVINO_EVIDENCE_COMMIT }}
          path: artifacts/openvino/evidence/*.json
          if-no-files-found: error
          retention-days: 30

name: Model Inspection worker process tests

on:
  push:
    paths:
      - 'infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient/**'
      - 'shared/GraniteEdgeAI.ModelInspection.Contracts/**'
      - 'shared/GraniteEdgeAI.ModelInspection.Transport/**'
      - 'workers/GraniteEdgeAI.ModelInspection.Worker/**'
      - 'IBM Granite with TurboQuant (Intel)/**'
      - 'tests/IntegrationTests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests/**'
      - 'tests/ProcessFixtures/GraniteEdgeAI.ModelInspection.ProtocolTestWorker/**'
      - '.github/workflows/model-inspection-worker-process-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient/**'
      - 'shared/GraniteEdgeAI.ModelInspection.Contracts/**'
      - 'shared/GraniteEdgeAI.ModelInspection.Transport/**'
      - 'workers/GraniteEdgeAI.ModelInspection.Worker/**'
      - 'IBM Granite with TurboQuant (Intel)/**'
      - 'tests/IntegrationTests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests/**'
      - 'tests/ProcessFixtures/GraniteEdgeAI.ModelInspection.ProtocolTestWorker/**'
      - '.github/workflows/model-inspection-worker-process-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-inspection-worker-process-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh
    working-directory: D:\s

jobs:
  worker-process-tests:
    name: Run protected worker process tests
    runs-on: windows-latest
    timeout-minutes: 22

    steps:
      - name: Check out process-boundary inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          sparse-checkout: |
            infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient
            shared/GraniteEdgeAI.ModelInspection.Contracts
            shared/GraniteEdgeAI.ModelInspection.Transport
            workers/GraniteEdgeAI.ModelInspection.Worker
            IBM Granite with TurboQuant (Intel)
            tests/IntegrationTests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests
            tests/ProcessFixtures/GraniteEdgeAI.ModelInspection.ProtocolTestWorker

      - name: Stage process-boundary inputs at a short path
        working-directory: ${{ github.workspace }}
        run: |
          $buildRoot = 'D:\s'
          if (Test-Path -LiteralPath $buildRoot) {
            Remove-Item -LiteralPath $buildRoot -Recurse -Force
          }
          robocopy $env:GITHUB_WORKSPACE $buildRoot /E /XD .git
          if ($LASTEXITCODE -ge 8) {
            throw "Failed to stage process-boundary inputs at $buildRoot."
          }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path (Join-Path $buildRoot 'global.json'))) {
            throw 'The staged checkout is incomplete: global.json was not found.'
          }

      - name: Set up repository .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: D:/s/global.json

      # The filter and minimum count guarantee that launcher, fixture isolation,
      # handshake, conversation, cancellation, timeout, process-tree, stderr,
      # environment, and concurrency tests all execute.
      - name: Run process and fixture-boundary tests
        run: >-
          dotnet test
          tests/IntegrationTests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~WorkerLaunchContainmentTests|FullyQualifiedName~TestWorkerScenarioParserTests|FullyQualifiedName~TestFixtureIsolationTests|FullyQualifiedName~WorkerHandshakeTests|FullyQualifiedName~WorkerProtocolIntegrityTests|FullyQualifiedName~WorkerCancellationAndTimeoutTests|FullyQualifiedName~WorkerProcessTreeContainmentTests|FullyQualifiedName~WorkerEnvironmentAndHandleTests|FullyQualifiedName~WorkerStandardErrorTests|FullyQualifiedName~WorkerConcurrencyTests"
          --minimum-expected-tests 27
          -p:Platform=x64

      # Repeat the timing-sensitive Task 10 cases to expose cancellation races,
      # process-tree leaks, stream deadlocks, and cross-session interference.
      # The already-built test assembly is reused so the loop measures runtime
      # stability rather than repeated compilation.
      - name: Repeat Task 10 process scenarios five times
        run: |
          $project = 'tests/IntegrationTests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests.csproj'
          $filter = 'FullyQualifiedName~WorkerCancellationAndTimeoutTests|FullyQualifiedName~WorkerProcessTreeContainmentTests|FullyQualifiedName~WorkerEnvironmentAndHandleTests|FullyQualifiedName~WorkerStandardErrorTests|FullyQualifiedName~WorkerConcurrencyTests'
          $fixtureProcessName = 'GraniteEdgeAI.ModelInspection.ProtocolTestWorker'

          for ($iteration = 1; $iteration -le 5; $iteration++) {
            Write-Host "Task 10 stability iteration $iteration of 5."
            dotnet test $project `
              --configuration Release `
              --no-build `
              --filter $filter `
              --minimum-expected-tests 9 `
              -p:Platform=x64

            if ($LASTEXITCODE -ne 0) {
              throw "Task 10 stability iteration $iteration failed."
            }

            $remaining = Get-Process `
              -Name $fixtureProcessName `
              -ErrorAction SilentlyContinue
            if ($remaining) {
              $processIds = ($remaining | Select-Object -ExpandProperty Id) -join ','
              $remaining | Stop-Process -Force -ErrorAction SilentlyContinue
              throw "Task 10 stability iteration $iteration left fixture process IDs: $processIds."
            }
          }

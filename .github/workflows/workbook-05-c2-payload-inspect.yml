name: Workbook 05 C2 payload inspection

on:
  pull_request:
    branches:
      - main
      - fix/workbook-05-c1-controlled-source-resume
    paths:
      - '.github/workflows/workbook-05-c2-payload-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  expose-reviewed-source:
    name: Verify and expose reviewed C2 source for debugging
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out only the C2 payload
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .bootstrap-c2
            .github/workflows

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Verify and extract the exact payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
              Get-ChildItem '.\.bootstrap-c2\workbook05-c2-source.b64.part-*' -File |
              Sort-Object Name
          )
          if ($parts.Count -ne 6) {
              throw "Expected six payload parts; found $($parts.Count)."
          }
          $encoded = [string]::Concat(@(
              $parts | ForEach-Object {
                  (Get-Content $_.FullName -Raw -Encoding utf8).Trim()
              }
          ))
          $archive = Join-Path $env:RUNNER_TEMP 'workbook05-c2-source.tar.gz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          $expected = '86d65d644cd2d6e3e69dbc324c0d11895ae4139e060648e552baccb796806e72'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) {
              throw "Payload digest mismatch. Expected $expected; observed $actual."
          }
          $destination = Join-Path $env:RUNNER_TEMP 'workbook05-c2-source'
          New-Item -ItemType Directory -Path $destination | Out-Null
          python -c "import pathlib,sys,tarfile; tarfile.open(sys.argv[1],'r:gz').extractall(pathlib.Path(sys.argv[2]),filter='data')" `
              $archive $destination
          if ($LASTEXITCODE -ne 0) {
              throw "Payload extraction exited with code $LASTEXITCODE."
          }
          Get-ChildItem $destination -Recurse -File -Force | ForEach-Object {
              Write-Host $_.FullName.Substring($destination.Length + 1)
          }

      - name: Upload the verified source tree
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook05-c2-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook05-c2-source
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

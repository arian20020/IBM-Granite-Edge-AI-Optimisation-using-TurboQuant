name: Workbook 05 Phase 3 dependency preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-phase3-dependency-preflight.yml'
      - '.github/workflows/workbook-05-phase3-assets.yml'
      - '.github/workflows/build-and-test.yml'
      - 'docs/superpowers/**'
      - 'docs/testing/workbook05/**'
      - 'experiments/granite_turboquant_intel/configurations/workbook05/**'
      - 'experiments/granite_turboquant_intel/manifests/templates/workbook05/**'
      - 'experiments/granite_turboquant_intel/schemas/workbook05/**'
      - 'scripts/testing/**'
      - 'tests/testing/workbook05/**'
  workflow_dispatch:
    inputs:
      confirm_live_dependency_preflight:
        description: 'Run the clean Windows dependency preflight on the controlled Intel laptop.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-phase3-dependency-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-contract:
    name: Verify dependency-preflight repository contract
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact dependency-preflight revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Install pinned Phase 3 validation dependency
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonCommand = Get-Command -Name python -CommandType Application -All -ErrorAction Stop |
              Select-Object -First 1
          $pythonPath = $pythonCommand.Source
          $dependencyDirectory = Join-Path $env:RUNNER_TEMP 'workbook05-phase3-python'

          if (Test-Path -LiteralPath $dependencyDirectory) {
              Remove-Item -LiteralPath $dependencyDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $dependencyDirectory -Force:$false | Out-Null

          & $pythonPath `
              -m pip install `
              --disable-pip-version-check `
              --target $dependencyDirectory `
              -r 'scripts/testing/workbook05/requirements.txt'
          if ($LASTEXITCODE -ne 0) {
              throw "Phase 3 validation dependency installation exited with code $LASTEXITCODE."
          }

          $env:PYTHONPATH = $dependencyDirectory
          $observedVersion = ((
              & $pythonPath -c "import importlib.metadata; print(importlib.metadata.version('jsonschema'))"
          ) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne '4.25.1') {
              throw "Expected jsonschema 4.25.1, observed: $observedVersion"
          }
          "PYTHONPATH=$dependencyDirectory" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Run dependency-preflight repository simulations
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\tests\testing\workbook05\Invoke-Phase3DependencyPreflightLiveTests.Tests.ps1'

      - name: Run the complete Phase 3 repository gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python'

  collect-dependencies:
    name: Collect clean dependency-preflight evidence
    needs: repository-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_live_dependency_preflight == true
    runs-on:
      - self-hosted
      - Windows
      - X64
      - workbook05
      - intel-target
    timeout-minutes: 240

    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Check out the exact dependency-preflight revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Verify fixed Python and manual boundary
        id: boundary
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.confirm_live_dependency_preflight }}' -ne 'true') {
              throw 'Live dependency preflight requires explicit confirmation.'
          }
          $pythonPath = 'C:\Program Files\Python312\python.exe'
          if (-not (Test-Path -LiteralPath $pythonPath -PathType Leaf)) {
              throw "Pinned Python was not found: $pythonPath"
          }
          $version = ((& $pythonPath --version 2>&1) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'Python 3.12.10') {
              throw "Expected Python 3.12.10, observed: $version"
          }
          "python_path=$pythonPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Install pinned Phase 3 validation dependency
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonPath = '${{ steps.boundary.outputs.python_path }}'
          $dependencyDirectory = Join-Path $env:RUNNER_TEMP 'workbook05-phase3-python'

          if (Test-Path -LiteralPath $dependencyDirectory) {
              Remove-Item -LiteralPath $dependencyDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $dependencyDirectory -Force:$false | Out-Null

          & $pythonPath `
              -m pip install `
              --disable-pip-version-check `
              --target $dependencyDirectory `
              -r 'scripts/testing/workbook05/requirements.txt'
          if ($LASTEXITCODE -ne 0) {
              throw "Phase 3 validation dependency installation exited with code $LASTEXITCODE."
          }

          $env:PYTHONPATH = $dependencyDirectory
          $observedVersion = ((
              & $pythonPath -c "import importlib.metadata; print(importlib.metadata.version('jsonschema'))"
          ) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne '4.25.1') {
              throw "Expected jsonschema 4.25.1, observed: $observedVersion"
          }
          "PYTHONPATH=$dependencyDirectory" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Run the complete Phase 3 repository gate
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath '${{ steps.boundary.outputs.python_path }}'

      - name: Collect clean dependency evidence
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\workbook05\Invoke-Workbook05Phase3DependencyPreflightLive.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -RunId $env:GITHUB_RUN_ID `
              -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT) `
              -BasePythonPath 'C:\Program Files\Python312\python.exe'

      - name: Upload exact text-only dependency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-phase3-dependency-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:\w5c\dependency-preflight-${{ github.run_id }}-${{ github.run_attempt }}\evidence
          if-no-files-found: error
          retention-days: 30

  validate-dependencies:
    name: Validate dependency artifact as untrusted data
    needs: collect-dependencies
    if: ${{ always() && needs.collect-dependencies.result != 'skipped' }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact dependency-preflight revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Set up independent validation Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Install pinned Phase 3 validation dependency
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonCommand = Get-Command -Name python -CommandType Application -All -ErrorAction Stop |
              Select-Object -First 1
          $pythonPath = $pythonCommand.Source
          $dependencyDirectory = Join-Path $env:RUNNER_TEMP 'workbook05-phase3-python'

          if (Test-Path -LiteralPath $dependencyDirectory) {
              Remove-Item -LiteralPath $dependencyDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $dependencyDirectory -Force:$false | Out-Null

          & $pythonPath `
              -m pip install `
              --disable-pip-version-check `
              --target $dependencyDirectory `
              -r 'scripts/testing/workbook05/requirements.txt'
          if ($LASTEXITCODE -ne 0) {
              throw "Phase 3 validation dependency installation exited with code $LASTEXITCODE."
          }

          $env:PYTHONPATH = $dependencyDirectory
          $observedVersion = ((
              & $pythonPath -c "import importlib.metadata; print(importlib.metadata.version('jsonschema'))"
          ) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne '4.25.1') {
              throw "Expected jsonschema 4.25.1, observed: $observedVersion"
          }
          "PYTHONPATH=$dependencyDirectory" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Run the complete Phase 3 repository gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python'

      - name: Download the exact same-attempt dependency artifact
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561
        with:
          name: workbook-05-phase3-dependency-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbook-05-phase3-dependency-preflight

      - name: Validate the artifact strictly as untrusted data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-dependency-preflight'
          $report = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-dependency-preflight-validation.md'

          python -m scripts.testing.workbook05.phase3.dependency_bundle_validation `
              --bundle-root $bundle `
              --repository-root $env:GITHUB_WORKSPACE `
              --require-passed `
              --report $report
          $validationExitCode = $LASTEXITCODE

          if (Test-Path -LiteralPath $report -PathType Leaf) {
              Get-Content -LiteralPath $report | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          if ($validationExitCode -ne 0) {
              throw "Dependency artifact validation exited with code $validationExitCode."
          }

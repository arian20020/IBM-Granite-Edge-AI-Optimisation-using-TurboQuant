name: Apply Workbook 05 C1 repair

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-workbook05-c1-repair.yml'

permissions:
  contents: write

concurrency:
  group: apply-workbook05-c1-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-repair:
    name: Apply exact C1 RED-to-GREEN repair
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/workbook-05-c1-live-asset-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact pull-request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: feature/workbook-05-c1-live-asset-lock
          fetch-depth: 0

      - name: Verify the temporary control commit
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='4b388cdd6ce5669bb55565b77b2fbcf752b872cb'
          observed_parent="$(git rev-parse HEAD^)"
          if [[ "$observed_parent" != "$expected_parent" ]]; then
            echo "Expected temporary workflow parent $expected_parent, found $observed_parent." >&2
            exit 1
          fi
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != '.github/workflows/apply-workbook05-c1-repair.yml' ]]; then
            printf 'Unexpected temporary control commit paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'The temporary repair checkout is not clean.' >&2
            exit 1
          fi

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Materialise the reviewed repair bundle
        shell: bash
        env:
          REPAIR_ZIP_BASE64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          expected = '24bb3fea0a82c65e11c84820497a40ba87caa245cf2723db6cce993375f3e2aa'
          payload = base64.b64decode(os.environ['REPAIR_ZIP_BASE64'], validate=True)
          observed = hashlib.sha256(payload).hexdigest()
          if observed != expected:
              raise SystemExit(f'Repair ZIP digest mismatch: {observed} != {expected}')
          path = Path(os.environ['RUNNER_TEMP']) / 'workbook05-c1-repair.zip'
          path.write_bytes(payload)
          print(path)
          PY
          python -m zipfile -e "$RUNNER_TEMP/workbook05-c1-repair.zip" "$RUNNER_TEMP/workbook05-c1-repair"

      - name: Apply the repair to the exact temporary head
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(git rev-parse HEAD)"
          python - "$RUNNER_TEMP/workbook05-c1-repair/c1fix/apply_c1_fix.py" "$current_head" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          current = sys.argv[2]
          text = path.read_text(encoding='utf-8')
          old = 'EXPECTED_HEAD = "4b388cdd6ce5669bb55565b77b2fbcf752b872cb"'
          new = f'EXPECTED_HEAD = "{current}"'
          if text.count(old) != 1:
              raise SystemExit('The reviewed repair script head guard is missing or ambiguous.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python "$RUNNER_TEMP/workbook05-c1-repair/c1fix/apply_c1_fix.py" "$GITHUB_WORKSPACE"

      - name: Install the pinned repository validation dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            -r scripts/testing/workbook05/requirements.txt

      - name: Run focused C1 repair tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.testing.workbook05.test_phase3_live_asset_bundle_validation \
            tests.testing.workbook05.test_phase3_live_asset_environment_contract

      - name: Verify and commit only the reviewed production files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          expected=(
            '.github/workflows/workbook-05-phase3-assets.yml'
            'scripts/testing/workbook05/Invoke-Workbook05Phase3AssetLockLive.ps1'
            'scripts/testing/workbook05/phase3/live_asset_bundle_validation.py'
          )
          mapfile -t sorted_changed < <(printf '%s\n' "${changed[@]}" | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${sorted_changed[@]}")" != "$(printf '%s\n' "${sorted_expected[@]}")" ]]; then
            printf 'Unexpected repair paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'fix(workbook05): close live C1 validation boundaries'
          git push origin HEAD:feature/workbook-05-c1-live-asset-lock

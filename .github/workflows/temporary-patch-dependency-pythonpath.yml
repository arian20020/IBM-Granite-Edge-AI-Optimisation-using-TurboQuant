name: Temporary patch dependency PYTHONPATH isolation

on:
  push:
    branches:
      - fix/workbook-05-dependency-pythonpath-isolation
    paths:
      - '.github/workflows/temporary-patch-dependency-pythonpath.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out only the live dependency collector
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: fix/workbook-05-dependency-pythonpath-isolation
          fetch-depth: 1
          sparse-checkout: |
            scripts/testing/workbook05/Invoke-Workbook05Phase3DependencyPreflightLive.ps1
          sparse-checkout-cone-mode: false

      - name: Apply the reviewed environment-boundary repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/testing/workbook05/Invoke-Workbook05Phase3DependencyPreflightLive.ps1')
          text = path.read_text(encoding='utf-8')

          before_try = """    return $SourceRoot
          }

          try {
              # -----------------------------------------------------------------------
              # 1. Fresh workspace and fixed tool identities.
          """
          after_try = """    return $SourceRoot
          }

          # The workflow's repository gate uses a temporary PYTHONPATH for its
          # pinned validator. Preserve the caller's value, but remove it before
          # any live child process so the bootstrap and final virtual environments
          # cannot treat runner-temporary packages as already installed.
          $OriginalPythonPath = $env:PYTHONPATH
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue

          try {
              # -----------------------------------------------------------------------
              # 1. Fresh workspace and fixed tool identities.
          """

          before_finally = """finally {
              if (Get-Variable -Name OriginalTemp -ErrorAction SilentlyContinue) {
          """
          after_finally = """finally {
              # Restore the process environment exactly as it was supplied by the
              # workflow after every success or failure path.
              if ($null -eq $OriginalPythonPath) {
                  Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
              }
              else {
                  $env:PYTHONPATH = $OriginalPythonPath
              }

              if (Get-Variable -Name OriginalTemp -ErrorAction SilentlyContinue) {
          """

          if text.count(before_try) != 1:
              raise SystemExit(f'Expected one live try boundary; found {text.count(before_try)}.')
          if text.count(before_finally) != 1:
              raise SystemExit(f'Expected one finalisation boundary; found {text.count(before_finally)}.')

          text = text.replace(before_try, after_try)
          text = text.replace(before_finally, after_finally)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Commit the production repair
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/testing/workbook05/Invoke-Workbook05Phase3DependencyPreflightLive.ps1
          git config user.name 'Workbook 05 maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(workbook05): isolate live dependency PYTHONPATH'
          git push origin HEAD:fix/workbook-05-dependency-pythonpath-isolation

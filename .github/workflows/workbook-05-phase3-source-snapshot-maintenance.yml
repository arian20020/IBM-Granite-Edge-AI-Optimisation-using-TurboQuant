name: Workbook 05 Phase 3 source snapshot maintenance

on:
  push:
    branches:
      - design/workbook-05-phase3-dependency-preflight
    paths:
      - '.github/workflows/workbook-05-phase3-source-snapshot-maintenance.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-phase3-source-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-source-snapshot:
    name: Export exact text source snapshot
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      # Check out the exact immutable maintenance revision with no retained
      # credentials. Only Workbook 05 repository-controlled text inputs are
      # materialised; no model, binary build output, or machine state is read.
      - name: Check out exact Phase 3 text inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      # Export the checked-out text tree as a short-lived maintenance artifact.
      # The artifact is used only to prepare reviewed repository commits and is
      # not scientific or live dependency-preflight evidence.
      - name: Upload exact Phase 3 source snapshot
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-phase3-source-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

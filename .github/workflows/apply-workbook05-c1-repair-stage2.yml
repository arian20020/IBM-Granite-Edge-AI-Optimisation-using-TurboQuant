name: Create Workbook 05 C1 workflow blob

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-workbook05-c1-repair-stage2.yml'

permissions:
  contents: write

concurrency:
  group: create-workbook05-c1-workflow-blob-stage2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create-blob:
    name: Create exact reviewed C1 workflow blob
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/workbook-05-c1-live-asset-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the exact pull-request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: feature/workbook-05-c1-live-asset-lock
          fetch-depth: 0

      - name: Verify controller and source identities
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='330a0b7f44e3396c3e28def1a736eaffdda885d6'
          observed_parent="$(git rev-parse HEAD^)"
          if [[ "$observed_parent" != "$expected_parent" ]]; then
            echo "Expected controller parent $expected_parent, found $observed_parent." >&2
            exit 1
          fi
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != '.github/workflows/apply-workbook05-c1-repair-stage2.yml' ]]; then
            printf 'Unexpected controller paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          observed="$(git rev-parse HEAD:.github/workflows/workbook-05-phase3-assets.yml)"
          expected='db05f0e5243327986d4de97b1342948ecb0dc7d1'
          if [[ "$observed" != "$expected" ]]; then
            echo "Expected unpatched workflow blob $expected, found $observed." >&2
            exit 1
          fi

      - name: Create and verify the patched workflow blob
        id: blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          source = Path('.github/workflows/workbook-05-phase3-assets.yml')
          text = source.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = '\n'.join([
              '          python -m scripts.testing.workbook05.phase3.asset_bundle_validation `',
              '              --bundle-root $bundle `',
              '              --repository-root $env:GITHUB_WORKSPACE `',
              '              --report $report',
              '',
          ])
          expression = '$' + '{{ inputs.operation }}'
          new = '\n'.join([
              "          $validator = if ('" + expression + "' -eq 'live-asset-lock') {",
              "              'scripts.testing.workbook05.phase3.live_asset_bundle_validation'",
              '          }',
              '          else {',
              "              'scripts.testing.workbook05.phase3.asset_bundle_validation'",
              '          }',
              '',
              '          & python -m $validator `',
              '              --bundle-root $bundle `',
              '              --repository-root $env:GITHUB_WORKSPACE `',
              '              --report $report',
              '',
          ])
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one workflow fragment, found {count}.')
          patched = text.replace(old, new, 1)
          if patched.count('live_asset_bundle_validation') != 1:
              raise SystemExit('Live-validator routing is missing or duplicated.')
          if expression not in patched:
              raise SystemExit('Literal workflow input expression was not preserved.')

          repository = os.environ['GITHUB_REPOSITORY']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          create_request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/blobs',
              data=json.dumps(
                  {'content': patched, 'encoding': 'utf-8'}
              ).encode('utf-8'),
              method='POST',
              headers=headers,
          )
          with urllib.request.urlopen(create_request, timeout=60) as response:
              created = json.loads(response.read().decode('utf-8'))
          sha = created.get('sha')
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit(f'Invalid blob response: {created!r}')

          fetch_request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/blobs/{sha}',
              headers={key: value for key, value in headers.items() if key != 'Content-Type'},
          )
          with urllib.request.urlopen(fetch_request, timeout=60) as response:
              fetched = json.loads(response.read().decode('utf-8'))
          decoded = base64.b64decode(fetched['content']).decode('utf-8')
          if decoded != patched:
              raise SystemExit('Fetched workflow blob differs from patched bytes.')

          print(f'PATCHED_WORKFLOW_BLOB_SHA={sha}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as stream:
              stream.write(f'sha={sha}\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as stream:
              stream.write('# Workbook 05 C1 workflow blob\n\n')
              stream.write(f'Patched workflow blob SHA: `{sha}`\n')
          PY

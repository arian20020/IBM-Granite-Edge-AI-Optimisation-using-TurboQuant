name: Temporary controlled Phase 3 collector repair

on:
  push:
    branches:
      - fix/workbook-05-dependency-observation-serialization
    paths:
      - '.github/workflows/export-phase3-live-script.yml'

permissions:
  contents: write

concurrency:
  group: temporary-phase3-collector-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Apply and verify exact collector repair
    if: >-
      github.repository ==
      'arian20020/IBM-Granite-Edge-AI-Optimisation-using-TurboQuant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repair revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          sparse-checkout: |
            .github/workflows/export-phase3-live-script.yml
            scripts/testing/workbook05
            tests/testing/workbook05/test_phase3_dependency_observation_cli.py
            tests/testing/workbook05/test_phase3_dependency_observation_wiring_contract.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Verify exact repository and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'arian20020/IBM-Granite-Edge-AI-Optimisation-using-TurboQuant'
          test "$GITHUB_REF_NAME" = 'fix/workbook-05-dependency-observation-serialization'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Replace only the failing PowerShell observation boundary
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          path = Path(
              'scripts/testing/workbook05/'
              'Invoke-Workbook05Phase3DependencyPreflightLive.ps1'
          )
          original = path.read_bytes()
          expected_sha256 = (
              '9b156756e0ee394a48555f333d519b0058b19a498d3b541c30a34f122cadb5a2'
          )
          actual_sha256 = hashlib.sha256(original).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  'Live collector changed before the controlled repair: '
                  f'{actual_sha256}'
              )
          if b'\r\n' not in original:
              raise SystemExit('The reviewed live collector lost its CRLF encoding.')

          text = original.decode('utf-8')
          old = """    $BootstrapLockText = Get-Content `\r\n        -LiteralPath $RetainedBootstrapLock `\r\n        -Raw `\r\n        -Encoding UTF8\r\n    $BootstrapReportText = Get-Content `\r\n        -LiteralPath $BootstrapReport `\r\n        -Raw `\r\n        -Encoding UTF8\r\n    $NormalLockText = Get-Content `\r\n        -LiteralPath $OrdinaryLock `\r\n        -Raw `\r\n        -Encoding UTF8\r\n    $NormalReportObject = Get-Content `\r\n        -LiteralPath $NormalReport `\r\n        -Raw `\r\n        -Encoding UTF8 |\r\n        ConvertFrom-Json\r\n\r\n    $Observation = [ordered]@{\r\n        generated_at_utc = [DateTime]::UtcNow.ToString('o')\r\n        simulation_mode = $false\r\n        workspace_root = $attemptRoot\r\n        workspace_is_normal_local_directory = $true\r\n        workspace_is_fresh = $true\r\n        python_version = $ObservedPythonVersion\r\n        python_executable_path = $FinalPython\r\n        python_executable_sha256 = Get-PreflightSha256 $FinalPython\r\n        pip_version = $ObservedPipVersion\r\n        pip_executable_path = $FinalPip\r\n        pip_executable_sha256 = Get-PreflightSha256 $FinalPip\r\n        source_trees = @($SourceRows)\r\n        direct_requirements = @(\r\n            'transformers==5.5.0',\r\n            'huggingface-hub==1.21.0',\r\n            'nncf==3.2.0',\r\n            'openvino==2026.2.1',\r\n            'openvino-tokenizers==2026.2.1.0'\r\n        )\r\n        bootstrap_lock_path = 'locks/requirements.phase3-bootstrap.txt'\r\n        bootstrap_lock_text = $BootstrapLockText\r\n        bootstrap_lock_sha256 = Get-PreflightSha256 $RetainedBootstrapLock\r\n        bootstrap_install_report_path = 'reports/bootstrap-install-report.json'\r\n        bootstrap_install_report_text = $BootstrapReportText\r\n        bootstrap_install_report_sha256 = Get-PreflightSha256 $BootstrapReport\r\n        lock_path = 'locks/requirements.phase3-assets.txt'\r\n        lock_text = $NormalLockText\r\n        lock_sha256 = Get-PreflightSha256 $OrdinaryLock\r\n        lock_generator = 'pip-tools==7.6.0'\r\n        normal_install_report = $NormalReportObject\r\n        vcs_packages = $VcsPackages\r\n        checks = @($CheckRows)\r\n        import_modules = @(\r\n            'optimum',\r\n            'optimum.intel',\r\n            'transformers',\r\n            'nncf',\r\n            'openvino'\r\n        )\r\n        cli_help_exit_code = 0\r\n        no_model_compatibility_exit_code = 0\r\n        final_environment_packages = @($FinalPackages)\r\n        source_contracts_path = 'reports/source-contracts.json'\r\n        no_model_compatibility_path = 'reports/no-model-compatibility.json'\r\n        command_index_path = 'command-index.json'\r\n        stage_order_path = 'stage-order.json'\r\n    }\r\n    $ObservationPath = Join-Path $EvidenceRoot 'observation.json'\r\n    Write-PreflightAtomicJson -Path $ObservationPath -Value $Observation\r\n"""
          new = """    # Publish the small ordered check catalogue before observation materialisation.\r\n    # The Python boundary reads this retained record as data and the hosted\r\n    # validator independently verifies the same six checks and their order.\r\n    $ChecksPath = Join-Path $EvidenceRoot 'checks.json'\r\n    Write-PreflightAtomicJson `\r\n        -Path $ChecksPath `\r\n        -Value ([ordered]@{ checks = @($CheckRows) })\r\n\r\n    # Keep PowerShell responsible for process supervision and scalar identities,\r\n    # but let Python materialise the large heterogeneous observation graph. This\r\n    # avoids Windows PowerShell 5.1 re-serialising pip's complete install report.\r\n    $ObservationGeneratedAtUtc = [DateTime]::UtcNow.ToString('o')\r\n    $FinalPythonSha256 = Get-PreflightSha256 $FinalPython\r\n    $FinalPipSha256 = Get-PreflightSha256 $FinalPip\r\n    $ObservationPath = Join-Path $EvidenceRoot 'observation.json'\r\n    Invoke-PreflightCommand `\r\n        -CommandId 'observation-materialize' `\r\n        -FilePath $BasePythonPath `\r\n        -ArgumentList @(\r\n            '-m',\r\n            'scripts.testing.workbook05.phase3.dependency_observation_cli',\r\n            '--output', $ObservationPath,\r\n            '--generated-at-utc', $ObservationGeneratedAtUtc,\r\n            '--workspace-root', $attemptRoot,\r\n            '--python-version', $ObservedPythonVersion,\r\n            '--python-executable-path', $FinalPython,\r\n            '--python-executable-sha256', $FinalPythonSha256,\r\n            '--pip-version', $ObservedPipVersion,\r\n            '--pip-executable-path', $FinalPip,\r\n            '--pip-executable-sha256', $FinalPipSha256,\r\n            '--bootstrap-lock', $RetainedBootstrapLock,\r\n            '--bootstrap-install-report', $BootstrapReport,\r\n            '--normal-lock', $OrdinaryLock,\r\n            '--normal-install-report', $NormalReport,\r\n            '--source-tree',\r\n            (Join-Path $SourceEvidenceDirectory 'optimum.json'),\r\n            '--source-tree',\r\n            (Join-Path $SourceEvidenceDirectory 'optimum-intel.json'),\r\n            '--vcs-packages',\r\n            (Join-Path $ReportDirectory 'vcs-packages.json'),\r\n            '--checks', $ChecksPath,\r\n            '--final-environment-packages',\r\n            (Join-Path $ReportDirectory 'final-environment-packages.json')\r\n        ) `\r\n        -WorkingDirectory $RepositoryRoot | Out-Null\r\n"""
          if text.count(old) != 1:
              raise SystemExit(
                  'Expected exactly one reviewed PowerShell observation block, '
                  f'found {text.count(old)}.'
              )
          text = text.replace(old, new, 1)

          old_checks = """    Write-PreflightAtomicJson `\r\n        -Path (Join-Path $EvidenceRoot 'checks.json') `\r\n        -Value ([ordered]@{ checks = @($CheckRows) })\r\n"""
          if text.count(old_checks) != 1:
              raise SystemExit(
                  'Expected exactly one later checks publication, '
                  f'found {text.count(old_checks)}.'
              )
          text = text.replace(old_checks, '', 1)
          path.write_bytes(text.encode('utf-8'))

          repaired_sha256 = hashlib.sha256(path.read_bytes()).hexdigest()
          expected_repaired_sha256 = (
              'd56b73f22df74c51e80d4b3e9ebabf519bf4776e898586a2f4d3e50c7bf195d9'
          )
          if repaired_sha256 != expected_repaired_sha256:
              raise SystemExit(
                  'Controlled repair bytes differ from the reviewed result: '
                  f'{repaired_sha256}'
              )
          print(f'Controlled live collector repair SHA-256: {repaired_sha256}')

      - name: Parse the repaired PowerShell source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath (
                  'scripts/testing/workbook05/' +
                  'Invoke-Workbook05Phase3DependencyPreflightLive.ps1'
              )).Path,
              [ref]$tokens,
              [ref]$errors
          )
          if ($errors.Count -ne 0) {
              $errors | Format-List *
              throw 'The repaired live collector contains a PowerShell syntax error.'
          }

      - name: Run focused dependency-observation tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tests/testing/workbook05 \
            -p 'test_phase3_dependency_observation*.py' \
            -v

      - name: Commit only the repair and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          live_script='scripts/testing/workbook05/Invoke-Workbook05Phase3DependencyPreflightLive.ps1'
          temporary_workflow='.github/workflows/export-phase3-live-script.yml'

          git diff --check -- "$live_script" "$temporary_workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$live_script"
          git rm -- "$temporary_workflow"

          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n%s' "$temporary_workflow" "$live_script" | sort)"
          actual="$(printf '%s\n' "$changed" | sort)"
          test "$actual" = "$expected"

          git commit -m 'fix(workbook05): wire Python dependency observation boundary'
          git push origin 'HEAD:fix/workbook-05-dependency-observation-serialization'

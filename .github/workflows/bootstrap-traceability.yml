name: Bootstrap traceability catalogue

on:
  push:
    branches:
      - docs/traceability-catalogue-v1.3
    paths:
      - ".traceability-bootstrap/**"
      - ".github/workflows/bootstrap-traceability.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-traceability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .traceability-bootstrap/chunk-*.b64 > /tmp/traceability.tar.gz.b64
          base64 --decode /tmp/traceability.tar.gz.b64 > /tmp/traceability.tar.gz
          tar -xzf /tmp/traceability.tar.gz -C .
          python scripts/traceability/generate_traceability_documents.py --repository-root .
          python scripts/traceability/validate_task_catalogue.py --repository-root .
          rm -rf .traceability-bootstrap
          rm -f .github/workflows/bootstrap-traceability.yml

      - name: Commit generated traceability catalogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs: add repository-wide RTM v1.3 traceability catalogue"
          git push

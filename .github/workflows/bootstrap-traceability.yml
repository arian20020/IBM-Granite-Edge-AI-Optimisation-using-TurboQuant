name: Bootstrap traceability catalogue

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bootstrap-traceability-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/traceability-catalogue-v1.3
          fetch-depth: 0

      - name: Reconstruct, generate and validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .traceability-bootstrap/chunk-*.b64 > /tmp/traceability.tar.gz.b64
          base64 --decode /tmp/traceability.tar.gz.b64 > /tmp/traceability.tar.gz
          tar -xzf /tmp/traceability.tar.gz -C .
          python scripts/traceability/generate_traceability_documents.py --repository-root .
          python scripts/traceability/validate_task_catalogue.py --repository-root .

          # The GitHub connector will add the permanent validation workflow
          # and remove this one-time bootstrap package in a later controlled commit.
          rm -f .github/workflows/traceability-validation.yml

      - name: Commit repository traceability files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs scripts .github/ISSUE_TEMPLATE .github/pull_request_template.md
          if git diff --cached --quiet; then
            echo "No traceability changes to commit."
            exit 0
          fi
          git commit -m "docs: add repository-wide RTM v1.3 traceability catalogue"
          git push origin HEAD:docs/traceability-catalogue-v1.3

name: Phase 1 plan self-review temporary

on:
  push:
    branches:
      - refactor/model-inspection-cleanup
    paths:
      - .github/workflows/phase1-plan-self-review.yml

permissions:
  contents: write

jobs:
  tighten-phase1-plan:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refactor/model-inspection-cleanup
          fetch-depth: 0
          sparse-checkout: |
            .github
            docs
            IBM Granite with TurboQuant (Intel)
            infrastructure
            scripts
            shared
            tests
            tools
            workers

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json

      - name: Add exact visual-state test bodies to the plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $planPath = 'docs/superpowers/plans/2026-08-06-model-inspection-cleanup-phase-1-winui-contracts.md'
          $plan = Get-Content -LiteralPath $planPath -Raw
          $needle = '- [ ] **Step 2: Characterize the already-correct ActionCard failure behavior**'

          if (-not $plan.Contains($needle, [System.StringComparison]::Ordinal)) {
            throw 'Could not locate the Task 7 Step 2 insertion point'
          }

          $addition = @'
### Exact visual-state groups used by these tests

```text
InspectionActionCard: LayoutRoot -> CardModeStates -> ResultState
InspectionModelCard: LayoutRoot -> DisplayModeStates -> DetailedState
InspectionOutcomeCard: LayoutRoot -> OutcomeToneStates -> SuccessTone
```

The WinUI `VisualStateGroup.Name` and `States` APIs are used directly; no reflection or XAML parsing is needed.

### Exact characterization/regression tests

```csharp
[UITestMethod]
[TestCategory("WinUI")]
public void ResultPresentation_MissingResultState_ThrowsClearException()
{
    InspectionActionCard control = new();
    FrameworkElement layoutRoot =
        (FrameworkElement)control.FindName("LayoutRoot");
    RemoveVisualState(layoutRoot, "CardModeStates", "ResultState");

    InvalidOperationException exception =
        Assert.ThrowsException<InvalidOperationException>(() =>
            control.Presentation = new InspectionActionCardPresentation
            {
                Mode = InspectionActionCardMode.Result
            });

    StringAssert.Contains(exception.Message, "ResultState");
}

[UITestMethod]
[TestCategory("WinUI")]
public void DetailedPresentation_MissingDetailedState_ThrowsClearException()
{
    InspectionModelCard control = new();
    FrameworkElement layoutRoot =
        (FrameworkElement)control.FindName("LayoutRoot");
    RemoveVisualState(layoutRoot, "DisplayModeStates", "DetailedState");

    InvalidOperationException exception =
        Assert.ThrowsException<InvalidOperationException>(() =>
            control.Presentation = new InspectionModelCardPresentation
            {
                DisplayMode = InspectionModelCardMode.Detailed
            });

    StringAssert.Contains(exception.Message, "DetailedState");
}

[UITestMethod]
[TestCategory("WinUI")]
public void ReadyPresentation_MissingSuccessTone_ThrowsClearException()
{
    InspectionOutcomeCard control = new();
    FrameworkElement layoutRoot =
        (FrameworkElement)control.FindName("LayoutRoot");
    RemoveVisualState(layoutRoot, "OutcomeToneStates", "SuccessTone");

    InvalidOperationException exception =
        Assert.ThrowsException<InvalidOperationException>(() =>
            control.Presentation = new InspectionOutcomePresentation
            {
                Kind = InspectionOutcomePresentationKind.Ready,
                Tone = InspectionOutcomeTone.Success,
                Title = "Ready",
                Message = "Ready",
                AutomationName = "Ready"
            });

    StringAssert.Contains(exception.Message, "SuccessTone");
}
```

The ActionCard test is expected to pass before production edits because that control already checks the return value from `VisualStateManager.GoToState`. The ModelCard and OutcomeCard tests are expected to fail before their fixes because those controls currently ignore the `false` return value.

'@

          $updated = $plan.Replace(
            $needle,
            $addition + $needle,
            [System.StringComparison]::Ordinal)

          if ($updated -eq $plan) {
            throw 'The Phase 1 plan was not updated'
          }

          [System.IO.File]::WriteAllText(
            (Resolve-Path $planPath).Path,
            $updated,
            [System.Text.UTF8Encoding]::new($false))

          $changedFiles = @(git diff --name-only)
          if ($LASTEXITCODE -ne 0) {
            throw 'git diff failed while validating the plan self-review update'
          }

          if ($changedFiles.Count -ne 1 -or $changedFiles[0] -ne $planPath) {
            throw "Unexpected files changed during plan self-review: $($changedFiles -join ', ')"
          }

      - name: Verify the permanent cleanup inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\model-inspection\Verify-ModelInspectionCleanupInventory.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw "Cleanup inventory verification exited with code $LASTEXITCODE"
          }

      - name: Run the complete contract project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/GraniteEdgeAI.ModelInspection.Contracts.Tests.csproj'
          dotnet restore $project
          if ($LASTEXITCODE -ne 0) {
            throw "Contract restore failed with code $LASTEXITCODE"
          }

          dotnet test $project `
            --configuration Release `
            --no-restore `
            --minimum-expected-tests 82
          if ($LASTEXITCODE -ne 0) {
            throw "Contract tests failed with code $LASTEXITCODE"
          }

      - name: Commit the self-reviewed plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'arian20020'
          git config user.email 'arian20020@outlook.com'
          git add -- 'docs/superpowers/plans/2026-08-06-model-inspection-cleanup-phase-1-winui-contracts.md'

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'The Phase 1 plan self-review produced no staged changes'
          }
          if ($LASTEXITCODE -ne 1) {
            throw "git diff --cached failed with code $LASTEXITCODE"
          }

          git commit -m 'docs(model-inspection): tighten Phase 1 visual-state tests'
          if ($LASTEXITCODE -ne 0) {
            throw "git commit failed with code $LASTEXITCODE"
          }

          git push origin HEAD:refactor/model-inspection-cleanup
          if ($LASTEXITCODE -ne 0) {
            throw "git push failed with code $LASTEXITCODE"
          }

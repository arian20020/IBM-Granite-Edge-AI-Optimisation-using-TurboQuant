name: Workbook 05 implementation bootstrap

on:
  push:
    branches:
      - testing/workbook-05-two-route-memory-frontier

permissions:
  contents: write

concurrency:
  group: workbook-05-implementation-bootstrap
  cancel-in-progress: false

jobs:
  implement-plan:
    name: Execute the approved ten-task preflight plan
    if: github.event.head_commit.message == 'chore(workbook-05): bootstrap implementation worker'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # Use the approved implementation branch as the isolated workspace.
      - name: Check out the complete implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: testing/workbook-05-two-route-memory-frontier
          fetch-depth: 0
          persist-credentials: true

      - name: Install the implementation worker Python
        uses: actions/setup-python@bfe8cc55a7890e3d6672eda6460ef37bfcc70755
        with:
          python-version: '3.12'

      # Some regression tests deliberately use the Intel runner's controlled path.
      # A junction gives the disposable hosted worker the same path contract.
      - name: Expose Python at the controlled validation path
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Split-Path (Get-Command python).Source -Parent
          $destination = 'C:\Program Files\Python312'
          if (-not (Test-Path -LiteralPath $destination)) {
              New-Item -ItemType Junction -Path $destination -Target $source | Out-Null
          }
          & (Join-Path $destination 'python.exe') --version

      # The implementation program is gzip-compressed and split only to keep the
      # temporary repository bootstrap small. It deletes itself after success.
      - name: Reconstruct the implementation worker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
              'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part00',
              'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part01',
              'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part02',
              'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part03'
          )
          $encoded = ($parts | ForEach-Object { Get-Content -Raw -LiteralPath $_ }) -join ''
          $gzipPath = Join-Path $env:RUNNER_TEMP 'wb05-apply.py.gz'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'wb05-apply.py'
          [System.IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip, pathlib; pathlib.Path(r'$scriptPath').write_bytes(gzip.open(r'$gzipPath', 'rb').read())"
          python -m py_compile $scriptPath
          "WB05_IMPLEMENTATION_SCRIPT=$scriptPath" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Execute test-first tasks with focused commits
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python $env:WB05_IMPLEMENTATION_SCRIPT
          if ($LASTEXITCODE -ne 0) {
              throw "Workbook 05 implementation worker failed with code $LASTEXITCODE."
          }

      # Remove the privileged bootstrap surface after all read-only production
      # workflows and controls have been committed and verified.
      - name: Remove the temporary implementation worker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Workbook 05 automation worker'
          git config user.email 'workbook05-actions@users.noreply.github.com'
          git rm -f -- `
            '.github/workflows/wb05-implementation-bootstrap.yml' `
            'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part00' `
            'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part01' `
            'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part02' `
            'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part03'
          git commit -m 'chore(workbook-05): remove temporary implementation worker'
          git push origin HEAD:testing/workbook-05-two-route-memory-frontier

name: Finalise research repository representation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the research branch
        uses: actions/checkout@v4
        with:
          ref: research/provenance-library-v2
          fetch-depth: 0

      - name: Correct the Git representation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('research')
          image_pattern = re.compile(
              r'<img\b[^>]*?src="assets/([^"/]+)"[^>]*?/?>',
              re.IGNORECASE | re.DOTALL,
          )
          image_count = 0

          for path in root.rglob('*.md'):
              text = path.read_text(encoding='utf-8')

              def archive_image(match: re.Match[str]) -> str:
                  global image_count
                  image_count += 1
                  return (
                      f'\n\n> **Archived image:** `{match.group(1)}` is preserved in the '
                      'controlled provenance ZIP and is not duplicated in Git.\n\n'
                  )

              text = image_pattern.sub(archive_image, text)
              text = text.replace(
                  'original DOCX is also preserved.',
                  'original DOCX is preserved in the controlled provenance ZIP.',
              )
              text = text.replace(
                  'The exact original file is still preserved in `99-original-docx`.',
                  'The exact original file is preserved in the controlled provenance ZIP; '
                  '`99-original-docx` contains the archive notice.',
              )
              path.write_text(text, encoding='utf-8')

          def change(relative: str, old: str, new: str) -> None:
              path = root / relative
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace(old, new), encoding='utf-8')

          change(
              'README.md',
              '3. **Lossless source preservation (`98` and `99`)** - every supplied document is retained as a Markdown extraction and as the exact original DOCX.',
              '3. **Source-preservation record (`98` and `99`)** - every supplied document has a full written Markdown extraction in Git. The exact DOCX and extracted PNG files are held in the controlled provenance ZIP referenced by the archive notice.',
          )
          change(
              'README.md',
              'The source-preservation layer keeps every detail, image, command, table and earlier draft for audit purposes.',
              'The source-preservation layer keeps the extracted written detail, commands, tables and earlier drafts searchable in Git. The controlled provenance ZIP keeps the original Word formatting and extracted image files for audit purposes.',
          )
          change(
              'README.md',
              '├── 98-source-extracts/            Full Markdown extraction of every supplied DOCX\n└── 99-original-docx/              Exact original files, unchanged',
              '├── 98-source-extracts/            Full written Markdown extraction of every supplied DOCX\n└── 99-original-docx/              Archive notice and retrieval/checksum pointer',
          )
          change(
              '98-source-extracts/README.md',
              'This folder contains one Markdown extraction for every supplied DOCX. Images are stored beside the relevant document in an `assets` folder.',
              'This folder contains one written Markdown extraction for every supplied DOCX. Where a source document contained an image, its original position is marked with an **Archived image** notice. The corresponding PNG is preserved in the controlled provenance ZIP and is not duplicated in Git.',
          )
          change(
              '98-source-extracts/README.md',
              'DOCX conversion can alter equation and layout presentation. Check the matching original in `../99-original-docx` whenever exact formatting matters.',
              'DOCX conversion can alter equation and layout presentation. Check the matching original in the controlled provenance ZIP whenever exact formatting matters; `../99-original-docx/BINARY-ARCHIVE-NOTICE.md` records where that archive is held.',
          )

          wording = {
              'Blank documents were not silently removed. They remain in `99-original-docx`, are listed in the internal source register and have a curated destination where appropriate.':
                  'Blank documents were not silently removed. Their exact DOCX files remain in the controlled provenance ZIP, they are listed in the internal source register, and `99-original-docx` contains the archive notice.',
              'The curated notes may condense repetition, but the full extracts and exact original DOCX files remain available.':
                  'The curated notes may condense repetition, but the full written extracts remain in Git and the exact original DOCX/PNG files remain available in the controlled provenance ZIP.',
              'The exact original and a Markdown extraction are both included.':
                  'The full written Markdown extraction is included in Git, while the exact original is retained in the controlled provenance ZIP.',
              'The full Markdown extracts in `98-source-extracts` and the original DOCX files in `99-original-docx` were not rewritten.':
                  'The full written Markdown extracts in `98-source-extracts` were not substantively rewritten, and the exact original DOCX/PNG files remain unchanged in the controlled provenance ZIP.',
              '| Original DOCX preservation | PASS | 44 original DOCX files still present |':
                  '| Original DOCX preservation | PASS | 44 original DOCX files verified by SHA-256 in the controlled provenance ZIP; Git stores the archive notice rather than the binaries |',
              'Original private SharePoint URL preserved only in 98-source-extracts and 99-original-docx':
                  'Original private SharePoint URL preserved only in 98-source-extracts and the controlled provenance ZIP',
              'original DOCX → full Markdown extract → curated note.':
                  'original DOCX in the controlled archive → full written Markdown extract in Git → curated note.',
              'internal document traceability from original DOCX to extract and curated note.':
                  'internal document traceability from archived original DOCX to Git extract and curated note.',
              'Verified that all 44 original DOCX files still match their recorded SHA-256 checksums.':
                  'Verified that all 44 original DOCX files in the controlled provenance ZIP match their recorded SHA-256 checksums.',
              'Preserved the complete Markdown extracts and all original DOCX files.':
                  'Preserved the complete written Markdown extracts in Git and all original DOCX/PNG files in the controlled provenance ZIP.',
          }

          for path in root.rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              for old, new in wording.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          package_path = root / '00-governance' / 'package-manifest.json'
          package = json.loads(package_path.read_text(encoding='utf-8-sig'))
          package['manifest_scope'] = (
              'Full controlled provenance ZIP, excluding package-manifest.json itself; '
              'this is not a manifest of the smaller Git research tree.'
          )
          package['repository_note'] = (
              'Git stores curated notes, written Markdown extracts, provenance records, '
              'and an archive notice. Exact DOCX and PNG binaries remain in the controlled ZIP.'
          )
          package_path.write_text(
              json.dumps(package, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          manifest_path = root / '00-governance' / 'git-tree-manifest.json'
          manifest_path.unlink(missing_ok=True)
          files = []
          for path in sorted(item for item in root.rglob('*') if item.is_file()):
              data = path.read_bytes()
              files.append({
                  'path': path.relative_to(root).as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest_path.write_text(
              json.dumps({
                  'manifest_version': '1.0',
                  'generated_on': '2026-07-14',
                  'manifest_scope': 'Git /research tree after provenance finalisation, excluding this manifest itself.',
                  'tracked_file_count_excluding_manifest': len(files),
                  'expected_total_file_count_including_manifest': len(files) + 1,
                  'archive_policy': 'Exact DOCX and extracted PNG binaries are held in the controlled provenance ZIP; Git contains written extracts, archive markers, checksums, and the archive notice.',
                  'files': files,
              }, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          markdown = list(root.rglob('*.md'))
          all_files = [path for path in root.rglob('*') if path.is_file()]
          print(f'Archived image markers written: {image_count}')
          print(f'Markdown files found: {len(markdown)}')
          print(f'Total research files found: {len(all_files)}')
          PY

      - name: Commit the corrected research tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalise-research-representation.yml
          git add --all
          git commit \
            -m "docs(research): finalise archive boundaries and Git manifest" \
            -m "Replace archived-image links with explicit archive markers, correct claims about where DOCX and PNG originals are stored, distinguish the full ZIP manifest from the Git tree, add a SHA-256 Git-tree manifest, and remove this one-use workflow."
          git push origin HEAD:research/provenance-library-v2

name: Hardware Inspection Intel runner Stage A

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Approved deterministic runner label
        required: true
        type: string
      confirm_authorised_runner:
        description: Confirm this run is authorised for the approved deterministic runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hardware-inspection-llmfit-authorised
  cancel-in-progress: false

jobs:
  hosted-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1 &&
      inputs.confirm_authorised_runner == true
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      approved_sha: ${{ steps.validated.outputs.approved_sha }}
      source_ref: ${{ steps.validated.outputs.source_ref }}
      runner_label: ${{ steps.validated.outputs.runner_label }}
      eligible: ${{ steps.validated.outputs.eligible }}
    steps:
      - name: Reject debug controls before runner eligibility
        timeout-minutes: 2
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        env:
          STAGEA_RUNNER_DEBUG: ${{ runner.debug }}
        run: |
          $ErrorActionPreference = 'Stop'
          $debugFailure = 'HI-RUNNER-STAGEA-DEBUG-INVALID: workflow debug logging is prohibited.'
          $environmentFailure = 'HI-RUNNER-STAGEA-ENVIRONMENT-INVALID: runner environment is invalid.'
          $gitFailure = 'HI-RUNNER-STAGEA-GIT-INVALID: required Git capability is unavailable.'
          try {
            foreach ($name in @('ACTIONS_STEP_DEBUG', 'ACTIONS_RUNNER_DEBUG', 'RUNNER_DEBUG', 'STAGEA_RUNNER_DEBUG')) {
              if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) { throw $debugFailure }
            }
          }
          catch { [Console]::Error.WriteLine($debugFailure); exit 1 }
          try {
            function Resolve-StageAPrecheckoutRoot([string] $pathValue) {
              if ([string]::IsNullOrWhiteSpace($pathValue) -or -not [System.IO.Path]::IsPathRooted($pathValue)) { throw $environmentFailure }
              $full = [System.IO.Path]::GetFullPath($pathValue)
              if ($full -cnotmatch '\A[A-Za-z]:\\' -or -not (Test-Path -LiteralPath $full -PathType Container)) { throw $environmentFailure }
              $component = Get-Item -LiteralPath $full -Force
              while ($null -ne $component) {
                if (($component.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { throw $environmentFailure }
                $component = $component.Parent
              }
              if ((New-Object System.IO.DriveInfo([System.IO.Path]::GetPathRoot($full))).DriveType -ne [System.IO.DriveType]::Fixed) { throw $environmentFailure }
              return $full.TrimEnd([System.IO.Path]::DirectorySeparatorChar)
            }
            $workspace = Resolve-StageAPrecheckoutRoot $env:GITHUB_WORKSPACE
            foreach ($childName in @('control', 'evaluated', 'source-identity')) {
              $child = [System.IO.Path]::GetFullPath((Join-Path $workspace $childName))
              if ([System.IO.Path]::GetDirectoryName($child) -ine $workspace -or (Test-Path -LiteralPath $child)) { throw $environmentFailure }
            }
          }
          catch { [Console]::Error.WriteLine($environmentFailure); exit 1 }
          try {
            foreach ($environmentName in [System.Environment]::GetEnvironmentVariables().Keys) {
              if ([string]$environmentName -ne '' -and ([string]$environmentName).StartsWith('GIT_', [System.StringComparison]::OrdinalIgnoreCase)) { throw $gitFailure }
            }
            $gitCommand = Get-Command git -CommandType Application -All -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $gitCommand) { throw $gitFailure }
            $versionLines = @(& $gitCommand.Source --version 2>$null)
            if ($LASTEXITCODE -ne 0 -or $versionLines.Count -ne 1) { throw $gitFailure }
            $versionText = [string]$versionLines[0]
            if ($versionText -cnotmatch '\Agit version (?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:\.windows\.(?:0|[1-9][0-9]*))?\z') { throw $gitFailure }
            $major = [int]$Matches['major']
            $minor = [int]$Matches['minor']
            if ($major -lt 2 -or ($major -eq 2 -and $minor -lt 28)) { throw $gitFailure }
          }
          catch { [Console]::Error.WriteLine($gitFailure); exit 1 }

      - name: Check out default-branch controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/hardware-inspection
            .github/workflows
            docs/superpowers/specs
            docs/testing/runbooks
            scripts/hardware-inspection
            tests/testing/hardware_inspection
          sparse-checkout-cone-mode: true

      - name: Set up Python for control contracts
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Run Stage 0 and Stage A control contracts
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        working-directory: control
        run: >-
          python -m unittest -v
          tests.testing.hardware_inspection.test_intel_runner_stage0_contract
          tests.testing.hardware_inspection.test_intel_runner_stage_a_contract

      - name: Parse the default-branch llmfit-gate1-approved-source.json approval manifest
        id: approval
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        env:
          STAGE0_WORKFLOW_REF: ${{ github.ref }}
          STAGE0_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STAGE0_ACTOR: ${{ github.actor }}
          STAGE0_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          STAGE0_REPOSITORY_OWNER: ${{ github.repository_owner }}
          STAGE0_RUN_ATTEMPT: ${{ github.run_attempt }}
          STAGE0_CONFIRMATION: ${{ inputs.confirm_authorised_runner }}
        run: |
          & '.\control\scripts\hardware-inspection\Validate-HardwareInspectionIntelRunnerStage0.ps1' `
            -Phase Dispatch `
            -ControlRoot (Join-Path $env:GITHUB_WORKSPACE 'control') `
            -WorkflowRef $env:STAGE0_WORKFLOW_REF `
            -DefaultBranch $env:STAGE0_DEFAULT_BRANCH `
            -Actor $env:STAGE0_ACTOR `
            -TriggeringActor $env:STAGE0_TRIGGERING_ACTOR `
            -RepositoryOwner $env:STAGE0_REPOSITORY_OWNER `
            -RunAttempt $env:STAGE0_RUN_ATTEMPT `
            -ConfirmRepositoryOnly $env:STAGE0_CONFIRMATION `
            -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: Check out approved source identity only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.approval.outputs.source_ref }}
          path: source-identity
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            /docs/superpowers/specs/
          sparse-checkout-cone-mode: false

      - name: Validate approved source and runner label
        id: validated
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        env:
          STAGEA_WORKFLOW_REF: ${{ github.ref }}
          STAGEA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STAGEA_ACTOR: ${{ github.actor }}
          STAGEA_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          STAGEA_REPOSITORY_OWNER: ${{ github.repository_owner }}
          STAGEA_RUN_ATTEMPT: ${{ github.run_attempt }}
          STAGEA_CONFIRMATION: ${{ inputs.confirm_authorised_runner }}
          STAGEA_RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          & '.\control\scripts\hardware-inspection\Validate-HardwareInspectionIntelRunnerStageA.ps1' `
            -Phase Hosted `
            -ControlRoot (Join-Path $env:GITHUB_WORKSPACE 'control') `
            -SourceCheckoutRoot (Join-Path $env:GITHUB_WORKSPACE 'source-identity') `
            -WorkflowRef $env:STAGEA_WORKFLOW_REF `
            -DefaultBranch $env:STAGEA_DEFAULT_BRANCH `
            -Actor $env:STAGEA_ACTOR `
            -TriggeringActor $env:STAGEA_TRIGGERING_ACTOR `
            -RepositoryOwner $env:STAGEA_REPOSITORY_OWNER `
            -RunAttempt $env:STAGEA_RUN_ATTEMPT `
            -Confirmation $env:STAGEA_CONFIRMATION `
            -RunnerLabel $env:STAGEA_RUNNER_LABEL `
            -GitHubOutputPath $env:GITHUB_OUTPUT

  deterministic-runner:
    needs: hosted-preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1 &&
      inputs.confirm_authorised_runner == true &&
      needs.hosted-preflight.outputs.eligible == 'true'
    runs-on: ${{ needs.hosted-preflight.outputs.runner_label }}
    timeout-minutes: 35
    steps:
      - name: Reject debug controls and mask runner metadata
        timeout-minutes: 2
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        env:
          STAGEA_RUNNER_DEBUG: ${{ runner.debug }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failure = 'HI-RUNNER-STAGEA-ENVIRONMENT-INVALID: runner environment is invalid.'
          $gitFailure = 'HI-RUNNER-STAGEA-GIT-INVALID: required Git capability is unavailable.'
          try {
            function Resolve-StageAPrecheckoutRoot([string] $pathValue) {
              if ([string]::IsNullOrWhiteSpace($pathValue) -or -not [System.IO.Path]::IsPathRooted($pathValue)) { throw $failure }
              $full = [System.IO.Path]::GetFullPath($pathValue)
              if ($full -cnotmatch '\A[A-Za-z]:\\' -or -not (Test-Path -LiteralPath $full -PathType Container)) { throw $failure }
              $component = Get-Item -LiteralPath $full -Force
              while ($null -ne $component) {
                if (($component.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { throw $failure }
                $component = $component.Parent
              }
              if ((New-Object System.IO.DriveInfo([System.IO.Path]::GetPathRoot($full))).DriveType -ne [System.IO.DriveType]::Fixed) { throw $failure }
              return $full.TrimEnd([System.IO.Path]::DirectorySeparatorChar)
            }
            foreach ($name in @('ACTIONS_STEP_DEBUG', 'ACTIONS_RUNNER_DEBUG', 'RUNNER_DEBUG', 'STAGEA_RUNNER_DEBUG')) {
              $debugValue = [Environment]::GetEnvironmentVariable($name)
              if (-not [string]::IsNullOrEmpty($debugValue)) {
                throw $failure
              }
            }
            if (@(Get-Process | Where-Object { $_.ProcessName -match '(?i)(llmfit|fake.*tool)' }).Count -ne 0 -or @(Get-NetTCPConnection -ErrorAction Stop | Where-Object { $_.State -eq 'Listen' -and $_.LocalPort -eq 8787 }).Count -ne 0) {
              throw $failure
            }
            $metadataValues = @()
            foreach ($name in @('GITHUB_WORKSPACE', 'RUNNER_TEMP', 'RUNNER_WORKSPACE', 'USERNAME')) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ([string]::IsNullOrWhiteSpace($value)) {
                throw $failure
              }
              $metadataValues += $value
            }
            $workspace = Resolve-StageAPrecheckoutRoot $env:GITHUB_WORKSPACE
            foreach ($childName in @('control', 'evaluated')) {
              $child = [System.IO.Path]::GetFullPath((Join-Path $workspace $childName))
              if ([System.IO.Path]::GetDirectoryName($child) -ine $workspace -or (Test-Path -LiteralPath $child)) { throw $failure }
            }
          }
          catch {
            [Console]::Error.WriteLine($failure)
            exit 1
          }
          try {
            foreach ($environmentName in [System.Environment]::GetEnvironmentVariables().Keys) {
              if ([string]$environmentName -ne '' -and ([string]$environmentName).StartsWith('GIT_', [System.StringComparison]::OrdinalIgnoreCase)) { throw $gitFailure }
            }
            $gitCommand = Get-Command git -CommandType Application -All -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $gitCommand) { throw $gitFailure }
            $versionLines = @(& $gitCommand.Source --version 2>$null)
            if ($LASTEXITCODE -ne 0 -or $versionLines.Count -ne 1) { throw $gitFailure }
            $versionText = [string]$versionLines[0]
            if ($versionText -cnotmatch '\Agit version (?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:\.windows\.(?:0|[1-9][0-9]*))?\z') { throw $gitFailure }
            $major = [int]$Matches['major']
            $minor = [int]$Matches['minor']
            if ($major -lt 2 -or ($major -eq 2 -and $minor -lt 28)) { throw $gitFailure }
          }
          catch { [Console]::Error.WriteLine($gitFailure); exit 1 }
          try {
            foreach ($value in $metadataValues) { Write-Host "::add-mask::$value" }
          }
          catch { [Console]::Error.WriteLine($failure); exit 1 }

      - name: Check out default-branch controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/hardware-inspection
            scripts/hardware-inspection
          sparse-checkout-cone-mode: true

      - name: Validate runner context before evaluated checkout
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        env:
          STAGEA_WORKFLOW_REF: ${{ github.ref }}
          STAGEA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STAGEA_ACTOR: ${{ github.actor }}
          STAGEA_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          STAGEA_REPOSITORY_OWNER: ${{ github.repository_owner }}
          STAGEA_RUN_ATTEMPT: ${{ github.run_attempt }}
          STAGEA_CONFIRMATION: ${{ inputs.confirm_authorised_runner }}
          STAGEA_RUNNER_LABEL: ${{ needs.hosted-preflight.outputs.runner_label }}
          STAGEA_APPROVED_SHA: ${{ needs.hosted-preflight.outputs.approved_sha }}
        run: |
          & '.\control\scripts\hardware-inspection\Validate-HardwareInspectionIntelRunnerStageA.ps1' `
            -Phase RunnerContext `
            -ControlRoot (Join-Path $env:GITHUB_WORKSPACE 'control') `
            -EvaluatedRoot (Join-Path $env:GITHUB_WORKSPACE 'evaluated') `
            -ApprovedSha $env:STAGEA_APPROVED_SHA `
            -WorkflowRef $env:STAGEA_WORKFLOW_REF `
            -DefaultBranch $env:STAGEA_DEFAULT_BRANCH `
            -Actor $env:STAGEA_ACTOR `
            -TriggeringActor $env:STAGEA_TRIGGERING_ACTOR `
            -RepositoryOwner $env:STAGEA_REPOSITORY_OWNER `
            -RunAttempt $env:STAGEA_RUN_ATTEMPT `
            -Confirmation $env:STAGEA_CONFIRMATION `
            -RunnerLabel $env:STAGEA_RUNNER_LABEL `
            -RunnerTemp $env:RUNNER_TEMP `
            -RunnerWorkspace $env:RUNNER_WORKSPACE

      - name: Check out approved evaluated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.hosted-preflight.outputs.approved_sha }}
          path: evaluated
          fetch-depth: 1
          persist-credentials: false

      - name: Validate evaluated source before execution
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        env:
          STAGEA_WORKFLOW_REF: ${{ github.ref }}
          STAGEA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STAGEA_ACTOR: ${{ github.actor }}
          STAGEA_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          STAGEA_REPOSITORY_OWNER: ${{ github.repository_owner }}
          STAGEA_RUN_ATTEMPT: ${{ github.run_attempt }}
          STAGEA_CONFIRMATION: ${{ inputs.confirm_authorised_runner }}
          STAGEA_RUNNER_LABEL: ${{ needs.hosted-preflight.outputs.runner_label }}
          STAGEA_APPROVED_SHA: ${{ needs.hosted-preflight.outputs.approved_sha }}
        run: |
          & '.\control\scripts\hardware-inspection\Validate-HardwareInspectionIntelRunnerStageA.ps1' `
            -Phase Runner `
            -ControlRoot (Join-Path $env:GITHUB_WORKSPACE 'control') `
            -EvaluatedRoot (Join-Path $env:GITHUB_WORKSPACE 'evaluated') `
            -ApprovedSha $env:STAGEA_APPROVED_SHA `
            -WorkflowRef $env:STAGEA_WORKFLOW_REF `
            -DefaultBranch $env:STAGEA_DEFAULT_BRANCH `
            -Actor $env:STAGEA_ACTOR `
            -TriggeringActor $env:STAGEA_TRIGGERING_ACTOR `
            -RepositoryOwner $env:STAGEA_REPOSITORY_OWNER `
            -RunAttempt $env:STAGEA_RUN_ATTEMPT `
            -Confirmation $env:STAGEA_CONFIRMATION `
            -RunnerLabel $env:STAGEA_RUNNER_LABEL

      - name: Set up .NET from the evaluated source
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: evaluated/global.json

      - name: Run authorised deterministic validation
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        working-directory: ${{ github.workspace }}
        env:
          STAGEA_APPROVED_SHA: ${{ needs.hosted-preflight.outputs.approved_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failure = 'HI-RUNNER-STAGEA-EXECUTION-INVALID: deterministic execution failed.'
          try {
          function Resolve-NormalFixedDirectory([string] $pathValue) {
            if ([string]::IsNullOrWhiteSpace($pathValue) -or
                $pathValue[0] -eq [System.IO.Path]::DirectorySeparatorChar -or
                $pathValue[0] -eq [System.IO.Path]::AltDirectorySeparatorChar) { throw $failure }
            $full = [System.IO.Path]::GetFullPath($pathValue)
            if ($full[0] -eq [System.IO.Path]::DirectorySeparatorChar -or
                $full[0] -eq [System.IO.Path]::AltDirectorySeparatorChar -or
                -not (Test-Path -LiteralPath $full -PathType Container)) { throw $failure }
            $component = Get-Item -LiteralPath $full -Force
            while ($null -ne $component) {
              if (($component.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { throw $failure }
              $component = $component.Parent
            }
            $drive = New-Object System.IO.DriveInfo([System.IO.Path]::GetPathRoot($full))
            if ($drive.DriveType -ne [System.IO.DriveType]::Fixed) { throw $failure }
            return $full.TrimEnd([System.IO.Path]::DirectorySeparatorChar)
          }
          $workspace = Resolve-NormalFixedDirectory $env:GITHUB_WORKSPACE
          $currentDirectory = Resolve-NormalFixedDirectory ([string](Get-Location).Path)
          if ($currentDirectory -ine $workspace) { throw $failure }
          $runnerTemp = Resolve-NormalFixedDirectory $env:RUNNER_TEMP
          $exportDirectory = Join-Path $workspace 'stage-a-export'
          $localWorkRoot = Join-Path $runnerTemp 'hardware-inspection-stage-a'
          if (Test-Path -LiteralPath $exportDirectory) { throw $failure }
          if (Test-Path -LiteralPath $localWorkRoot) { throw $failure }
          $workspace = Resolve-NormalFixedDirectory $workspace
          $runnerTemp = Resolve-NormalFixedDirectory $runnerTemp
          New-Item -ItemType Directory -Path $exportDirectory -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path $localWorkRoot -ErrorAction Stop | Out-Null
          $exportDirectory = Resolve-NormalFixedDirectory $exportDirectory
          $localWorkRoot = Resolve-NormalFixedDirectory $localWorkRoot
          if ([System.IO.Path]::GetDirectoryName($exportDirectory) -ine $workspace) { throw $failure }
          if ([System.IO.Path]::GetDirectoryName($localWorkRoot) -ine $runnerTemp) { throw $failure }
          & '.\control\scripts\hardware-inspection\Invoke-HardwareInspectionIntelRunnerStageA.ps1' `
            -EvaluatedRoot 'evaluated' `
            -ApprovedSha $env:STAGEA_APPROVED_SHA `
            -LocalWorkRoot $localWorkRoot `
            -SummaryJsonPath 'stage-a-export/stage-a-summary.json' `
            -SummaryMarkdownPath 'stage-a-export/stage-a-summary.md'
          }
          catch {
            [Console]::Error.WriteLine($failure)
            exit 1
          }

      - name: Validate Stage A summary artifacts before upload
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        env:
          STAGEA_APPROVED_SHA: ${{ needs.hosted-preflight.outputs.approved_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failure = 'HI-RUNNER-STAGEA-ARTIFACTS-INVALID: summary validation failed.'
          try {
            function Assert-ExactNormalFile([string] $pathValue, [byte[]] $expectedBytes) {
              if ([string]::IsNullOrWhiteSpace($pathValue) -or
                  $pathValue[0] -eq [System.IO.Path]::DirectorySeparatorChar -or
                  $pathValue[0] -eq [System.IO.Path]::AltDirectorySeparatorChar) { throw $failure }
              $full = [System.IO.Path]::GetFullPath($pathValue)
              if ($full[0] -eq [System.IO.Path]::DirectorySeparatorChar -or
                  $full[0] -eq [System.IO.Path]::AltDirectorySeparatorChar) { throw $failure }
              $item = Get-Item -LiteralPath $full -Force
              if ($item.PSIsContainer -or (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) -or $item.Length -ne $expectedBytes.Length) { throw $failure }
              $component = $item.Directory
              while ($null -ne $component) { if (($component.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { throw $failure }; $component = $component.Parent }
              if ((New-Object System.IO.DriveInfo([System.IO.Path]::GetPathRoot($full))).DriveType -ne [System.IO.DriveType]::Fixed) { throw $failure }
              $stream = New-Object System.IO.FileStream($full, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::None)
              try {
                if ($stream.Length -ne $expectedBytes.Length) { throw $failure }
                $actual = New-Object byte[] $expectedBytes.Length
                $offset = 0
                while ($offset -lt $actual.Length) { $count = $stream.Read($actual, $offset, $actual.Length - $offset); if ($count -le 0) { throw $failure }; $offset += $count }
                for ($index = 0; $index -lt $expectedBytes.Length; $index++) { if ($actual[$index] -ne $expectedBytes[$index]) { throw $failure } }
              }
              finally { $stream.Dispose() }
            }
            $utf8 = New-Object System.Text.UTF8Encoding($false, $true)
            $expectedJson = '{"schemaVersion":"1.0","evaluatedSha":"' + $env:STAGEA_APPROVED_SHA + '","deterministicPassed":174,"task8DeterministicPassed":3,"nonPassing":0}'
            $expectedMarkdown = "# Hardware Inspection Intel Stage A`n`n- Evaluated SHA: $env:STAGEA_APPROVED_SHA`n- Deterministic passed: 174`n- Task8 deterministic passed: 3`n- Non-passing: 0`n"
            Assert-ExactNormalFile 'stage-a-export/stage-a-summary.json' $utf8.GetBytes($expectedJson)
            Assert-ExactNormalFile 'stage-a-export/stage-a-summary.md' $utf8.GetBytes($expectedMarkdown)
          }
          catch { [Console]::Error.WriteLine($failure); exit 1 }

      - name: Upload Stage A summary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hardware-inspection-stage-a-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage-a-export/stage-a-summary.json
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false

      - name: Publish validated Stage A summary
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        env:
          STAGEA_APPROVED_SHA: ${{ needs.hosted-preflight.outputs.approved_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failure = 'HI-RUNNER-STAGEA-SUMMARY-INVALID: summary publication failed.'
          try {
            function Assert-NormalSummaryFile([string] $pathValue) {
              if ([string]::IsNullOrWhiteSpace($pathValue) -or
                  $pathValue[0] -eq [System.IO.Path]::DirectorySeparatorChar -or
                  $pathValue[0] -eq [System.IO.Path]::AltDirectorySeparatorChar) { throw $failure }
              $full = [System.IO.Path]::GetFullPath($pathValue)
              if ($full[0] -eq [System.IO.Path]::DirectorySeparatorChar -or
                  $full[0] -eq [System.IO.Path]::AltDirectorySeparatorChar) { throw $failure }
              $item = Get-Item -LiteralPath $full -Force
              if ($item.PSIsContainer -or (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0)) { throw $failure }
              $component = Get-Item -LiteralPath ([System.IO.Path]::GetDirectoryName($full)) -Force
              while ($null -ne $component) { if (($component.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { throw $failure }; $component = $component.Parent }
              if ((New-Object System.IO.DriveInfo($full.Substring(0, 3))).DriveType -ne [System.IO.DriveType]::Fixed) { throw $failure }
              return $full
            }
            $path = 'stage-a-export/stage-a-summary.md'
            $utf8 = New-Object System.Text.UTF8Encoding($false, $true)
            $expected = "# Hardware Inspection Intel Stage A`n`n- Evaluated SHA: $env:STAGEA_APPROVED_SHA`n- Deterministic passed: 174`n- Task8 deterministic passed: 3`n- Non-passing: 0`n"
            $expectedBytes = $utf8.GetBytes($expected)
            $sourcePath = Assert-NormalSummaryFile $path
            $source = Get-Item -LiteralPath $sourcePath -Force
            if ($source.Length -ne $expectedBytes.Length) { throw $failure }
            $sourceStream = New-Object System.IO.FileStream($sourcePath, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::None)
            try { if ($sourceStream.Length -ne $expectedBytes.Length) { throw $failure }; $actualBytes = New-Object byte[] $sourceStream.Length; $offset = 0; while ($offset -lt $actualBytes.Length) { $count = $sourceStream.Read($actualBytes, $offset, $actualBytes.Length - $offset); if ($count -le 0) { throw $failure }; $offset += $count } } finally { $sourceStream.Dispose() }
            if ($actualBytes.Length -ne $expectedBytes.Length) { throw $failure }
            for ($index = 0; $index -lt $expectedBytes.Length; $index++) {
              if ($actualBytes[$index] -ne $expectedBytes[$index]) { throw $failure }
            }
            $summaryPath = Assert-NormalSummaryFile $env:GITHUB_STEP_SUMMARY
            $stream = New-Object System.IO.FileStream($summaryPath, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
            try { if ($stream.Length -ne 0) { throw $failure }; $stream.Write($expectedBytes, 0, $expectedBytes.Length); $stream.Flush($true) } finally { $stream.Dispose() }
          }
          catch { [Console]::Error.WriteLine($failure); exit 1 }

      - name: Check Stage A residue
        if: ${{ always() }}
        timeout-minutes: 2
        shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = ''Stop''; $global:LASTEXITCODE = 0; & ''{0}''; if (-not $?) { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; exit 1 }; exit $LASTEXITCODE"'
        run: |
          $ErrorActionPreference = 'Stop'
          $failure = 'HI-RUNNER-STAGEA-RESIDUE-INVALID: fixed residue check failed.'
          try {
            if (@(Get-Process | Where-Object { $_.ProcessName -match '(?i)(llmfit|fake.*tool)' }).Count -ne 0 -or @(Get-NetTCPConnection -ErrorAction Stop | Where-Object { $_.State -eq 'Listen' -and $_.LocalPort -eq 8787 }).Count -ne 0) { throw $failure }
          }
          catch { [Console]::Error.WriteLine($failure); exit 1 }

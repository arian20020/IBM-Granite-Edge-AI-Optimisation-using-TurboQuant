name: Temporary CTranslate2 Python wheel fetch

on:
  push:
    branches:
      - automation/temp-en-sq-model-fetch-20260815

permissions:
  contents: read

jobs:
  fetch-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download Linux CPython 3.13 CTranslate2 wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --no-deps 'ctranslate2==4.8.1' -d wheel
          test "$(find wheel -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          sha256sum wheel/*.whl > wheel/SHA256SUMS.txt
          ls -lh wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ctranslate2-cp313-linux-wheel
          path: wheel
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

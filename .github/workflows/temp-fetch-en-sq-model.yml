name: Temporary HPLT English-Albanian model fetch

on:
  push:
    branches:
      - automation/temp-en-sq-model-fetch-20260815

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download HPLT v2 English to Albanian Marian model
        shell: bash
        run: |
          set -euo pipefail
          base="https://huggingface.co/HPLT/translate-en-sq-v2.0-hplt_opus/resolve/main"
          for name in model.npz.best-chrf.npz model.en-sq.spm model.en-sq.vocab README.md; do
            curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 30 \
              "$base/$name?download=true" -o "$name"
            test -s "$name"
          done
          sha256sum model.npz.best-chrf.npz model.en-sq.spm model.en-sq.vocab README.md | tee SHA256SUMS.txt
          ls -lh model.npz.best-chrf.npz model.en-sq.spm model.en-sq.vocab README.md SHA256SUMS.txt

      - name: Upload HPLT translation model
        uses: actions/upload-artifact@v4
        with:
          name: en-sq-hplt-v2-marian-model
          path: |
            model.npz.best-chrf.npz
            model.en-sq.spm
            model.en-sq.vocab
            README.md
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

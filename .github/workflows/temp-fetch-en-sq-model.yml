name: Temporary NLLB translation model fetch

on:
  push:
    branches:
      - automation/temp-en-sq-model-fetch-20260815

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download NLLB-200 distilled 600M CTranslate2 INT8 model
        shell: bash
        run: |
          set -euo pipefail
          base="https://huggingface.co/mijuanlo/nllb-200-distilled-600M-ct2-int8/resolve/main"
          for name in model.bin sentencepiece.bpe.model config.json shared_vocabulary.json; do
            curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 \
              "$base/$name?download=true" -o "$name"
            test -s "$name"
          done
          sha256sum model.bin sentencepiece.bpe.model config.json shared_vocabulary.json > SHA256SUMS.txt
          ls -lh model.bin sentencepiece.bpe.model config.json shared_vocabulary.json SHA256SUMS.txt

      - name: Upload NLLB model
        uses: actions/upload-artifact@v4
        with:
          name: nllb-200-distilled-600m-ct2-int8
          path: |
            model.bin
            sentencepiece.bpe.model
            config.json
            shared_vocabulary.json
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

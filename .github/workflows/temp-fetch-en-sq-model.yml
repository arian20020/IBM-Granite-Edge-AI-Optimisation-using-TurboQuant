name: Temporary anatomical terminology fetch

on:
  push:
    branches:
      - automation/temp-en-sq-model-fetch-20260815

permissions:
  contents: read

jobs:
  fetch-terminology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Wikidata TA2 and TA98 English-Albanian terminology
        shell: bash
        run: |
          set -euo pipefail
          cat > ta2.rq <<'EOF'
          SELECT ?item ?ta2 ?en ?sq ?enAlt ?sqAlt WHERE {
            ?item wdt:P7173 ?ta2 .
            ?item rdfs:label ?en . FILTER(LANG(?en) = "en")
            OPTIONAL { ?item rdfs:label ?sq . FILTER(LANG(?sq) = "sq") }
            OPTIONAL { ?item skos:altLabel ?enAlt . FILTER(LANG(?enAlt) = "en") }
            OPTIONAL { ?item skos:altLabel ?sqAlt . FILTER(LANG(?sqAlt) = "sq") }
          }
          ORDER BY xsd:integer(?ta2)
          EOF
          cat > ta98.rq <<'EOF'
          SELECT ?item ?ta98 ?latin ?en ?sq ?enAlt ?sqAlt WHERE {
            ?item wdt:P1323 ?ta98 .
            OPTIONAL { ?item wdt:P3982 ?latin }
            ?item rdfs:label ?en . FILTER(LANG(?en) = "en")
            OPTIONAL { ?item rdfs:label ?sq . FILTER(LANG(?sq) = "sq") }
            OPTIONAL { ?item skos:altLabel ?enAlt . FILTER(LANG(?enAlt) = "en") }
            OPTIONAL { ?item skos:altLabel ?sqAlt . FILTER(LANG(?sqAlt) = "sq") }
          }
          ORDER BY ?ta98
          EOF
          endpoint="https://query.wikidata.org/sparql"
          agent="Netter-Albanian-terminology-QA/1.0 (personal translation project)"
          curl --fail --location --retry 5 --retry-delay 5 \
            -A "$agent" -G "$endpoint" \
            --data-urlencode query@ta2.rq \
            -H 'Accept: text/tab-separated-values' \
            -o wikidata-ta2-en-sq.tsv
          curl --fail --location --retry 5 --retry-delay 5 \
            -A "$agent" -G "$endpoint" \
            --data-urlencode query@ta98.rq \
            -H 'Accept: text/tab-separated-values' \
            -o wikidata-ta98-en-sq.tsv
          test -s wikidata-ta2-en-sq.tsv
          test -s wikidata-ta98-en-sq.tsv
          wc -l wikidata-ta2-en-sq.tsv wikidata-ta98-en-sq.tsv
          sha256sum wikidata-ta2-en-sq.tsv wikidata-ta98-en-sq.tsv > SHA256SUMS.txt

      - name: Upload terminology tables
        uses: actions/upload-artifact@v4
        with:
          name: anatomical-terminology-en-sq
          path: |
            wikidata-ta2-en-sq.tsv
            wikidata-ta98-en-sq.tsv
            SHA256SUMS.txt
          compression-level: 9
          retention-days: 1
          if-no-files-found: error

name: Temporary split NLLB translation model fetch

on:
  push:
    branches:
      - automation/temp-en-sq-model-fetch-20260815

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and split NLLB-200 distilled 600M CTranslate2 INT8 model
        shell: bash
        run: |
          set -euo pipefail
          base="https://huggingface.co/mijuanlo/nllb-200-distilled-600M-ct2-int8/resolve/main"
          for name in model.bin sentencepiece.bpe.model config.json shared_vocabulary.json; do
            curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 \
              "$base/$name?download=true" -o "$name"
            test -s "$name"
          done
          sha256sum model.bin sentencepiece.bpe.model config.json shared_vocabulary.json > SHA256SUMS.txt
          split -b 300M -d -a 2 model.bin model.bin.part-
          test "$(find . -maxdepth 1 -name 'model.bin.part-*' | wc -l)" -eq 2
          cat model.bin.part-00 model.bin.part-01 > model.bin.reassembled
          cmp model.bin model.bin.reassembled
          sha256sum model.bin.part-00 model.bin.part-01 > PART-SHA256SUMS.txt
          ls -lh model.bin.part-00 model.bin.part-01 sentencepiece.bpe.model config.json shared_vocabulary.json SHA256SUMS.txt PART-SHA256SUMS.txt

      - name: Upload model part 00
        uses: actions/upload-artifact@v4
        with:
          name: nllb-model-part-00
          path: model.bin.part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload model part 01
        uses: actions/upload-artifact@v4
        with:
          name: nllb-model-part-01
          path: model.bin.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload tokenizer and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: nllb-model-metadata
          path: |
            sentencepiece.bpe.model
            config.json
            shared_vocabulary.json
            SHA256SUMS.txt
            PART-SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

name: Phase 1 plan inventory sync temporary

on:
  push:
    branches:
      - refactor/model-inspection-cleanup
    paths:
      - .github/workflows/phase1-plan-inventory-sync.yml

permissions:
  contents: write

jobs:
  sync-phase1-plan:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refactor/model-inspection-cleanup
          fetch-depth: 0
          sparse-checkout: |
            .github
            docs
            IBM Granite with TurboQuant (Intel)
            infrastructure
            scripts
            shared
            tests
            tools
            workers

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json

      - name: Add the Phase 1 plan to the permanent inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $sourcePath = 'docs/reviews/model-inspection-cleanup-source-files.txt'
          $inventoryPath = 'docs/reviews/model-inspection-cleanup-inventory.md'
          $planPath = 'docs/superpowers/plans/2026-08-06-model-inspection-cleanup-phase-1-winui-contracts.md'
          $expectedCount = 369

          if (-not (Test-Path -LiteralPath $planPath -PathType Leaf)) {
            throw "The approved Phase 1 plan was not found: $planPath"
          }

          [string[]]$currentSources = @(
            Get-Content -LiteralPath $sourcePath |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              ForEach-Object { $_.Replace('\\', '/') }
          )

          if ($currentSources.Count -ne ($expectedCount - 1)) {
            throw "Expected $($expectedCount - 1) cleanup source paths before sync, found $($currentSources.Count)"
          }

          $sourceSet = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::Ordinal)
          foreach ($source in $currentSources) {
            if (-not $sourceSet.Add($source)) {
              throw "Duplicate cleanup source path before sync: $source"
            }
          }

          if (-not $sourceSet.Add($planPath)) {
            throw 'The Phase 1 plan was already present before the one-time sync'
          }

          [string[]]$sortedSources = @($sourceSet)
          [Array]::Sort($sortedSources, [System.StringComparer]::Ordinal)

          if ($sortedSources.Count -ne $expectedCount) {
            throw "Expected $expectedCount cleanup source paths after sync, found $($sortedSources.Count)"
          }

          [System.IO.File]::WriteAllLines(
            (Resolve-Path $sourcePath).Path,
            $sortedSources,
            [System.Text.UTF8Encoding]::new($false))

          [string[]]$inventoryLines = Get-Content -LiteralPath $inventoryPath
          $firstRowIndex = -1
          for ($index = 0; $index -lt $inventoryLines.Count; $index++) {
            if ($inventoryLines[$index] -match '^\| `[^`]+` \|') {
              $firstRowIndex = $index
              break
            }
          }

          if ($firstRowIndex -lt 0) {
            throw 'The cleanup inventory contains no file rows'
          }

          $header = @($inventoryLines[0..($firstRowIndex - 1)])
          $rows = [System.Collections.Generic.Dictionary[string,string]]::new(
            [System.StringComparer]::Ordinal)

          foreach ($line in $inventoryLines[$firstRowIndex..($inventoryLines.Count - 1)]) {
            if ($line -notmatch '^\| `(?<path>[^`]+)` \|') {
              throw "Unexpected non-row content after the cleanup inventory header: $line"
            }

            $path = $Matches.path.Replace('\\', '/')
            if ($rows.ContainsKey($path)) {
              throw "Duplicate cleanup inventory row before sync: $path"
            }

            $rows.Add($path, $line)
          }

          if ($rows.Count -ne ($expectedCount - 1)) {
            throw "Expected $($expectedCount - 1) cleanup inventory rows before sync, found $($rows.Count)"
          }

          if ($rows.ContainsKey($planPath)) {
            throw 'The Phase 1 plan inventory row already existed before the one-time sync'
          }

          $newRow = '| `docs/superpowers/plans/2026-08-06-model-inspection-cleanup-phase-1-winui-contracts.md` | cleanup planning | define the audited Phase 1 WinUI and application-contract cleanup | low | reviewed | Phase 1 audit and implementation sequence recorded | planning only | production behaviour unchanged | CleanupInventoryContractTests | plan inventory sync verification | implementation requires user approval |'
          $rows.Add($planPath, $newRow)

          [System.Collections.Generic.List[string]]$orderedRows = [System.Collections.Generic.List[string]]::new()
          foreach ($path in $sortedSources) {
            if (-not $rows.ContainsKey($path)) {
              throw "Cleanup inventory row is missing after sync: $path"
            }

            $orderedRows.Add($rows[$path])
          }

          [System.IO.File]::WriteAllLines(
            (Resolve-Path $inventoryPath).Path,
            @($header + $orderedRows),
            [System.Text.UTF8Encoding]::new($false))

          $changedFiles = @(git diff --name-only)
          if ($LASTEXITCODE -ne 0) {
            throw 'git diff failed while validating the Phase 1 plan inventory sync'
          }

          [string[]]$expectedFiles = @(
            'docs/reviews/model-inspection-cleanup-inventory.md',
            'docs/reviews/model-inspection-cleanup-source-files.txt'
          )

          $unexpected = @(
            $changedFiles |
              Where-Object { $_ -notin $expectedFiles }
          )
          if ($unexpected.Count -ne 0) {
            throw "Unexpected files changed during plan inventory sync: $($unexpected -join ', ')"
          }

          foreach ($expectedFile in $expectedFiles) {
            if ($expectedFile -notin $changedFiles) {
              throw "Expected plan inventory sync did not modify $expectedFile"
            }
          }

      - name: Verify the permanent cleanup inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\model-inspection\Verify-ModelInspectionCleanupInventory.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw "Cleanup inventory verification exited with code $LASTEXITCODE"
          }

      - name: Run the complete contract project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/GraniteEdgeAI.ModelInspection.Contracts.Tests.csproj'
          dotnet restore $project
          if ($LASTEXITCODE -ne 0) {
            throw "Contract restore failed with code $LASTEXITCODE"
          }

          dotnet test $project `
            --configuration Release `
            --no-restore `
            --minimum-expected-tests 82
          if ($LASTEXITCODE -ne 0) {
            throw "Contract tests failed with code $LASTEXITCODE"
          }

      - name: Commit the synchronized planning inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name 'arian20020'
          git config user.email 'arian20020@outlook.com'
          git add -- `
            'docs/reviews/model-inspection-cleanup-source-files.txt' `
            'docs/reviews/model-inspection-cleanup-inventory.md'

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'The Phase 1 plan inventory sync produced no staged changes'
          }
          if ($LASTEXITCODE -ne 1) {
            throw "git diff --cached failed with code $LASTEXITCODE"
          }

          git commit -m 'docs(model-inspection): inventory Phase 1 cleanup plan'
          if ($LASTEXITCODE -ne 0) {
            throw "git commit failed with code $LASTEXITCODE"
          }

          git push origin HEAD:refactor/model-inspection-cleanup
          if ($LASTEXITCODE -ne 0) {
            throw "git push failed with code $LASTEXITCODE"
          }

      - name: Verify documentation scope and stale-text removal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $files = @(
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Contracts/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Controls/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Models/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Presentation/README.md'
          )
          $combined = ($files | ForEach-Object { Get-Content -Raw $_ }) -join "`n"
          foreach ($text in @('SelectedModelPath','Features/Onboarding/Controls/InspectionContentTemplateSelectorTests.cs','Shared-instance caution','Gate 2 should add the worker executable boundary','no production worker executable or launch path')) {
              if ($combined.Contains($text)) { throw "Stale Phase 1 documentation text remains: $text" }
          }
          if (-not $combined.Contains('controlled unavailable inspection engine')) { throw 'Controlled unavailable-engine limitation is missing' }
          if (-not $combined.Contains('fixed ARGB values')) { throw 'Deferred fixed-brush theming debt was removed' }
          ./scripts/model-inspection/Verify-ModelInspectionCleanupInventory.ps1

      - name: Commit Task 8 documentation and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/README.md'
          git add -- 'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Contracts/README.md'
          git add -- 'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Controls/README.md'
          git add -- 'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Models/README.md'
          git add -- 'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Presentation/README.md'
          git rm -- '.github/workflows/task8-doc-sync-temp.yml'
          git diff --cached --check
          $changed = @(git diff --cached --name-only | Sort-Object)
          $expected = @(
              '.github/workflows/task8-doc-sync-temp.yml',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Contracts/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Controls/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Models/README.md',
              'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Presentation/README.md'
          ) | Sort-Object
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $changed)
          if ($difference.Count -ne 0) { throw "Unexpected staged files:`n$($difference | Out-String)" }
          git commit -m 'docs(model-inspection): align Phase 1 boundary documentation'
          git push origin HEAD:refactor/model-inspection-cleanup

name: Phase 0 repair temporary

on:
  push:
    branches:
      - refactor/model-inspection-cleanup
    paths:
      - .github/workflows/phase0-repair-temp.yml

permissions:
  contents: write

concurrency:
  group: phase0-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json

      - name: Repair deterministic Phase 0 gates
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path('.github/workflows/build-and-test.yml')
          cleanup_test_path = Path('tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/CleanupInventoryContractTests.cs')
          workflow_test_path = Path('tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/BuildWorkflowContractTests.cs')
          source_path = Path('docs/reviews/model-inspection-cleanup-source-files.txt')
          inventory_path = Path('docs/reviews/model-inspection-cleanup-inventory.md')

          workflow = workflow_path.read_text(encoding='utf-8')
          old_checkout = '''            scripts\n            shared\n            workers\n            tests'''
          new_checkout = '''            scripts\n            shared\n            tools\n            workers\n            tests'''
          if old_checkout not in workflow:
              raise SystemExit('Expected sparse-checkout block was not found exactly once.')
          workflow = workflow.replace(old_checkout, new_checkout, 1)
          if workflow.count('--minimum-expected-tests 78') != 1:
              raise SystemExit('Expected exactly one contract minimum-test floor in build workflow.')
          workflow = workflow.replace('--minimum-expected-tests 78', '--minimum-expected-tests 82', 1)
          workflow_path.write_text(workflow, encoding='utf-8', newline='\n')

          workflow_test = workflow_test_path.read_text(encoding='utf-8')
          if workflow_test.count('--minimum-expected-tests 78') != 2:
              raise SystemExit('Expected exactly two contract-floor assertions in BuildWorkflowContractTests.')
          workflow_test = workflow_test.replace('--minimum-expected-tests 78', '--minimum-expected-tests 82')
          workflow_test_path.write_text(workflow_test, encoding='utf-8', newline='\n')

          cleanup_test = cleanup_test_path.read_text(encoding='utf-8')
          old_complete_loop = '''            foreach (string file in Directory.EnumerateFiles(\n                         fullRoot,\n                         "*",\n                         SearchOption.AllDirectories))\n            {\n                files.Add(ToRelative(file));\n            }'''
          new_complete_loop = '''            foreach (string file in Directory.EnumerateFiles(\n                         fullRoot,\n                         "*",\n                         SearchOption.AllDirectories))\n            {\n                if (!IsGeneratedBuildFile(file))\n                {\n                    files.Add(ToRelative(file));\n                }\n            }'''
          if cleanup_test.count(old_complete_loop) != 1:
              raise SystemExit('Complete-root enumeration block did not match expected source.')
          cleanup_test = cleanup_test.replace(old_complete_loop, new_complete_loop, 1)

          old_matching_loop = '''        foreach (string file in Directory.EnumerateFiles(\n                     fullRoot,\n                     "*",\n                     SearchOption.AllDirectories))\n        {\n            if (!contentMustContainModelInspection ||\n                File.ReadAllText(file).Contains(\n                    "ModelInspection",\n                    StringComparison.OrdinalIgnoreCase))\n            {\n                files.Add(ToRelative(file));\n            }\n        }'''
          new_matching_loop = '''        foreach (string file in Directory.EnumerateFiles(\n                     fullRoot,\n                     "*",\n                     SearchOption.AllDirectories))\n        {\n            if (IsGeneratedBuildFile(file))\n            {\n                continue;\n            }\n\n            if (!contentMustContainModelInspection ||\n                File.ReadAllText(file).Contains(\n                    "ModelInspection",\n                    StringComparison.OrdinalIgnoreCase))\n            {\n                files.Add(ToRelative(file));\n            }\n        }'''
          if cleanup_test.count(old_matching_loop) != 1:
              raise SystemExit('Content-matching enumeration block did not match expected source.')
          cleanup_test = cleanup_test.replace(old_matching_loop, new_matching_loop, 1)

          marker = '''    private static string ToRelative(string path) =>\n        Normalize(Path.GetRelativePath(Root, path));'''
          helper = '''    private static bool IsGeneratedBuildFile(string path)\n    {\n        string relative = ToRelative(path);\n        return relative\n            .Split('/', StringSplitOptions.RemoveEmptyEntries)\n            .Any(segment =>\n                segment.Equals("bin", StringComparison.OrdinalIgnoreCase) ||\n                segment.Equals("obj", StringComparison.OrdinalIgnoreCase));\n    }\n\n    private static string ToRelative(string path) =>\n        Normalize(Path.GetRelativePath(Root, path));'''
          if cleanup_test.count(marker) != 1:
              raise SystemExit('ToRelative insertion point did not match expected source.')
          cleanup_test = cleanup_test.replace(marker, helper, 1)
          cleanup_test_path.write_text(cleanup_test, encoding='utf-8', newline='\n')

          source = [line for line in source_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          if len(source) != len(set(source)):
              raise SystemExit('Cleanup source list contains duplicate paths before normalization.')
          source = sorted(source)

          inventory_lines = inventory_path.read_text(encoding='utf-8').splitlines()
          row_indexes = [index for index, line in enumerate(inventory_lines) if line.startswith('| `')]
          if not row_indexes:
              raise SystemExit('Cleanup inventory has no file rows.')
          first_row, last_row = row_indexes[0], row_indexes[-1]
          row_lines = inventory_lines[first_row:last_row + 1]
          if any(not line.startswith('| `') for line in row_lines):
              raise SystemExit('Unexpected non-row content inside cleanup inventory row block.')

          rows = {}
          for line in row_lines:
              parts = line.split('`')
              if len(parts) < 3:
                  raise SystemExit(f'Could not parse inventory row: {line}')
              path = parts[1]
              if path in rows:
                  raise SystemExit(f'Duplicate cleanup inventory row: {path}')
              rows[path] = line

          if set(rows) != set(source):
              missing_rows = sorted(set(source) - set(rows))
              extra_rows = sorted(set(rows) - set(source))
              raise SystemExit(f'Inventory/source mismatch. missing_rows={missing_rows} extra_rows={extra_rows}')

          source_path.write_text('\n'.join(source) + '\n', encoding='utf-8', newline='\n')
          normalized_inventory = inventory_lines[:first_row] + [rows[path] for path in source] + inventory_lines[last_row + 1:]
          inventory_path.write_text('\n'.join(normalized_inventory) + '\n', encoding='utf-8', newline='\n')

      - name: Verify repaired contract suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test 'tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/GraniteEdgeAI.ModelInspection.Contracts.Tests.csproj' `
            --configuration Release `
            --minimum-expected-tests 82
          if ($LASTEXITCODE -ne 0) {
            throw "Phase 0 contract verification failed: $LASTEXITCODE"
          }

      - name: Commit repaired Phase 0 gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            .github/workflows/build-and-test.yml \
            tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/BuildWorkflowContractTests.cs \
            tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/CleanupInventoryContractTests.cs \
            docs/reviews/model-inspection-cleanup-source-files.txt \
            docs/reviews/model-inspection-cleanup-inventory.md
          if git diff --cached --quiet; then
            echo 'Phase 0 gate already has the deterministic repair.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(model-inspection): make Phase 0 inventory gate deterministic'
          git push origin "HEAD:${GITHUB_REF_NAME}"

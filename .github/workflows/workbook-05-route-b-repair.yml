name: Workbook 05 Route B repair

on:
  pull_request:
    branches:
      - planning/workbook-05-route-b-repair
    paths:
      - '.github/workflows/workbook-05-route-b-repair.yml'
      - 'docs/superpowers/**'
      - 'scripts/testing/**'
      - 'tests/testing/workbook05/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-route-b-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-repair-contract:
    name: Verify bounded repair contract
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # Check out the exact reviewed head rather than a synthetic merge commit.
      - name: Check out the exact Route B repair revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            scripts/testing
            tests/testing/workbook05

      # Use the same pinned Python version as the accepted Workbook 05 gate.
      - name: Set up the controlled Python interpreter
        uses: actions/setup-python@bfe8cc55a7890e3d6672eda6460ef37bfcc70755
        with:
          python-version: '3.12.10'

      # Run the focused test-first contract before consuming the Intel runner.
      - name: Run the focused Route B repair contract tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest -v tests.testing.workbook05.test_route_b_repair
          if ($LASTEXITCODE -ne 0) {
              throw "Route B repair contract tests exited with code $LASTEXITCODE."
          }

  collect-route-b-evidence:
    name: Collect bounded Route B repair evidence
    needs: verify-repair-contract
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/testing/workbook-05-route-b-repair-implementation'
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'testing/workbook-05-route-b-repair-implementation'
      )

    runs-on:
      - self-hosted
      - Windows
      - X64
      - workbook05
      - intel-target

    timeout-minutes: 360

    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      # The Intel producer and hosted validator both use the same immutable head.
      - name: Check out the exact Route B repair revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            scripts/testing
            tests/testing/workbook05

      # Refuse machine-wide interpreter drift before touching external source.
      - name: Verify the pinned machine-wide Python
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonPath = 'C:\Program Files\Python312\python.exe'
          if (-not (Test-Path -LiteralPath $pythonPath -PathType Leaf)) {
              throw "Pinned Python was not found at: $pythonPath"
          }
          $version = ((& $pythonPath --version 2>&1) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'Python 3.12.10') {
              throw "Expected Python 3.12.10, found: $version"
          }

      # Re-run the focused project-side tests on the evidence-producing machine.
      - name: Run the focused Route B repair contract tests
        run: |
          $ErrorActionPreference = 'Stop'
          & 'C:\Program Files\Python312\python.exe' `
              -m unittest -v tests.testing.workbook05.test_route_b_repair
          if ($LASTEXITCODE -ne 0) {
              throw "Route B repair contract tests exited with code $LASTEXITCODE."
          }

      # Clone the exact external commit into runner temp, apply only the approved
      # CMake repair, configure, build the narrow target and run selected tests.
      - name: Execute bounded Route B repair campaign
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'workbook-05-route-b-repair'
          if (Test-Path -LiteralPath $outputDirectory) {
              Remove-Item -LiteralPath $outputDirectory -Recurse -Force
          }

          & '.\scripts\testing\workbook05\Invoke-Workbook05RouteBRepair.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -OutputDirectory $outputDirectory `
              -PythonPath 'C:\Program Files\Python312\python.exe'

      # Preserve both executable-candidate and truthful blocked decisions. The
      # artifact contains text/JSON/log evidence only, never source or binaries.
      - name: Upload exact Route B repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-route-b-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbook-05-route-b-repair
          if-no-files-found: error
          retention-days: 30

  validate-route-b-evidence:
    name: Validate Route B artifact as untrusted data
    if: ${{ always() && needs.collect-route-b-evidence.result != 'skipped' }}
    needs: collect-route-b-evidence
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # Validation code comes from the same immutable head, without credentials.
      - name: Check out the exact Route B repair revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            scripts/testing
            tests/testing/workbook05

      # The validator runs on a fresh GitHub-hosted interpreter, independently
      # from the self-hosted machine that produced the evidence.
      - name: Set up hosted validation Python
        uses: actions/setup-python@bfe8cc55a7890e3d6672eda6460ef37bfcc70755
        with:
          python-version: '3.12.10'

      # Re-run the focused repository contract before parsing the artifact.
      - name: Run the focused Route B repair contract tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest -v tests.testing.workbook05.test_route_b_repair
          if ($LASTEXITCODE -ne 0) {
              throw "Route B repair contract tests exited with code $LASTEXITCODE."
          }

      # Download only the artifact from this exact run ID and attempt.
      - name: Download the exact Route B repair artifact
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561
        with:
          name: workbook-05-route-b-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbook-05-route-b-repair

      # Treat every downloaded file as inert data and publish the deterministic
      # validation summary without executing any artifact payload.
      - name: Validate the downloaded Route B bundle as untrusted data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = Join-Path $env:RUNNER_TEMP 'workbook-05-route-b-repair'
          $reportPath = Join-Path $env:RUNNER_TEMP 'workbook-05-route-b-validation.md'

          python -m scripts.testing.workbook05.route_b_repair_bundle_validation `
              --bundle-root $bundleRoot `
              --report $reportPath
          $validationExitCode = $LASTEXITCODE

          if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
              Get-Content -LiteralPath $reportPath |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

          if ($validationExitCode -ne 0) {
              throw "Route B bundle validation exited with code $validationExitCode."
          }

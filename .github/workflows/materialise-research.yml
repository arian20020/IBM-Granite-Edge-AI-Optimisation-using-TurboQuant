name: Materialise curated research library

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the import branch
        uses: actions/checkout@v4
        with:
          ref: research/provenance-library-v2
          fetch-depth: 0

      - name: Reconstruct and validate the staged archive
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t parts < <(find .github/research-import -maxdepth 1 -type f -name 'part-*.b64' | sort)

          if [ "${#parts[@]}" -eq 0 ]; then
            echo "No research archive parts were found." >&2
            exit 1
          fi

          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > research-import.tar.xz

          actual_sha256="$(sha256sum research-import.tar.xz | awk '{print $1}')"
          expected_sha256="25c36e32bf01c4a2a08d6d9797458a0104d15b0e365f3b2b9869359a6ee99299"
          archive_size="$(stat -c '%s' research-import.tar.xz)"
          encoded_size="$(cat "${parts[@]}" | tr -d '\r\n' | wc -c | tr -d ' ')"

          echo "Part count: ${#parts[@]}"
          echo "Encoded character count: ${encoded_size}"
          echo "Decoded archive byte count: ${archive_size}"
          echo "Actual SHA-256: ${actual_sha256}"
          echo "Expected SHA-256: ${expected_sha256}"

          for part in "${parts[@]}"; do
            part_sha256="$(tr -d '\r\n' < "${part}" | sha256sum | awk '{print $1}')"
            printf -- '%s | %s bytes | %s\n' "$(basename "${part}")" "$(stat -c '%s' "${part}")" "${part_sha256}"
          done

          if [ "${actual_sha256}" != "${expected_sha256}" ]; then
            echo "The reconstructed archive checksum does not match the controlled package." >&2
            exit 1
          fi

      - name: Replace the temporary payload with the real research tree
        shell: bash
        run: |
          set -euo pipefail

          rm -rf research
          mkdir -p research
          tar -xJf research-import.tar.xz -C research

          rm -f research-import.tar.xz
          rm -rf .github/research-import
          rm -f .github/workflows/materialise-research.yml

          test -f research/README.md
          test -f research/00-governance/source-audit-report.md
          test -f research/00-sources/source-catalog.csv
          test -f research/98-source-extracts/README.md
          test -f research/99-original-docx/BINARY-ARCHIVE-NOTICE.md

          markdown_count="$(find research -type f -name '*.md' | wc -l | tr -d ' ')"
          total_file_count="$(find research -type f | wc -l | tr -d ' ')"

          echo "Markdown files: ${markdown_count}"
          echo "Total research files: ${total_file_count}"

          if [ "${markdown_count}" -ne 109 ]; then
            echo "Unexpected Markdown file count: ${markdown_count}." >&2
            exit 1
          fi

          if [ "${total_file_count}" -ne 116 ]; then
            echo "Unexpected total file count: ${total_file_count}." >&2
            exit 1
          fi

      - name: Commit the controlled research library
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all
          git commit \
            -m "docs(research): add curated Granite and TurboQuant provenance library" \
            -m "Materialise the controlled GitHub research record under /research. Add the curated simple-English research, external source catalogue, claim-to-source matrix, citation rules, full Markdown source extracts, checksums and provenance audits. Keep binary DOCX and extracted-image originals in the controlled archive rather than duplicating them in Git history. Remove all temporary import payloads after checksum and file-count validation."

          git push origin HEAD:research/provenance-library-v2

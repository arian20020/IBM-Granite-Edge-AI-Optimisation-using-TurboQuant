name: Build and test

# Run the validation after branch pushes, for pull requests into main,
# and when manually started from the GitHub Actions interface.
on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Give the workflow permission to read repository content only.
permissions:
  contents: read

# Prevent GitHub from wasting time on obsolete builds. For example, when a
# newer commit is pushed while an older commit is still building, only the
# newer branch state remains relevant.
concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use PowerShell consistently for command-line build steps.
defaults:
  run:
    shell: pwsh
    # Keep the checkout path short. The WinUI XAML compiler still creates
    # intermediate paths that can exceed legacy Windows path limits.
    working-directory: D:\s

# Keep project paths in one place so commands cannot accidentally point to
# different projects.
env:
  APP_PROJECT: 'IBM Granite with TurboQuant (Intel)/IBM Granite with TurboQuant (Intel).csproj'
  TEST_PROJECT: 'tests/UnitTests/GraniteEdgeAI.UnitTests/GraniteEdgeAI.UnitTests.csproj'
  CONTRACT_TEST_PROJECT: 'tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/GraniteEdgeAI.ModelInspection.Contracts.Tests.csproj'
  TEST_RECIPE: 'tests/UnitTests/GraniteEdgeAI.UnitTests/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/GraniteEdgeAI.UnitTests.build.appxrecipe'
  TEST_RESULTS_DIRECTORY: 'TestResults/UnitTests'

jobs:
  build-and-test:
    # Keep this name stable. It will later be selected as a required
    # status check for the protected main branch.
    name: Build WinUI and run unit tests

    # WinUI and Windows App SDK compilation require a Windows runner.
    runs-on: windows-latest

    # Stop a stalled build rather than allowing it to run indefinitely.
    timeout-minutes: 30

    steps:
      # Retrieve only the repository directories required by this CI job.
      #
      # The repository also contains deeply nested research material that
      # is not needed to build or test the application. A sparse checkout
      # prevents those unrelated paths from being written to the Windows
      # runner and keeps the checkout smaller and more focused.
      #
      # Root-level files, including global.json, remain available when
      # sparse checkout uses its default cone mode.
      #
      # Pinned immutable commit for actions/checkout v7.0.0.
      - name: Check out required build inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          sparse-checkout: |
            .github/workflows
            IBM Granite with TurboQuant (Intel)
            infrastructure
            shared
            workers
            tests/ContractTests
            tests/IntegrationTests
            tests/ProcessFixtures
            tests/UnitTests/GraniteEdgeAI.ModelInspection.Transport.Tests
            tests/UnitTests/GraniteEdgeAI.ModelInspection.Worker.Tests
            tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests
            tests/UnitTests/GraniteEdgeAI.UnitTests
            tests/TestFixtures

      # Recreate every script-owned fixture before staging the build. A clean
      # diff proves that committed binaries, expected JSON, and the integrity
      # manifest are reproducible from their checked-in generators.
      - name: Verify generated fixture reproducibility
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'

          & '.\tests\TestFixtures\Generate-GgufFixtures.ps1'

          git diff --exit-code -- tests/TestFixtures
          $fixtureDiffExitCode = $LASTEXITCODE
          $fixtureStatus = @(
            git status `
              --porcelain `
              --untracked-files=all `
              -- tests/TestFixtures
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'git status failed while checking regenerated fixtures.'
          }

          if ($fixtureDiffExitCode -gt 1) {
            throw 'git diff failed while checking regenerated fixtures.'
          }

          if (
            $fixtureDiffExitCode -eq 1 -or
            $fixtureStatus.Count -ne 0
          ) {
            $fixtureStatus | ForEach-Object { Write-Host $_ }
            throw 'Fixture regeneration left tracked or untracked changes.'
          }

      # actions/checkout only accepts paths beneath GITHUB_WORKSPACE, whose
      # Windows path repeats the long repository name. Copy the sparse tree to
      # the runner's short temporary root before invoking the XAML compiler.
      - name: Stage build inputs at a short path
        working-directory: ${{ github.workspace }}
        run: |
          $buildRoot = 'D:\s'
          robocopy $env:GITHUB_WORKSPACE $buildRoot /E /XD .git

          if ($LASTEXITCODE -ge 8) {
            throw "Failed to stage build inputs at $buildRoot."
          }

          # Robocopy uses exit codes 1-7 for successful copy outcomes. Reset
          # the process code so PowerShell does not fail the workflow step.
          $global:LASTEXITCODE = 0

          if (-not (Test-Path (Join-Path $buildRoot 'global.json'))) {
            throw "The staged checkout is incomplete: global.json was not found."
          }

      # Install the .NET SDK selected by the repository's global.json.
      #
      # Pinned immutable commit for actions/setup-dotnet v5.0.0.
      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: D:/s/global.json

      # Locate the x64 MSBuild installation supplied by Visual Studio
      # on the Windows runner.
      #
      # Pinned immutable commit for microsoft/setup-msbuild v3.0.0.
      - name: Add x64 MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
        with:
          msbuild-architecture: x64

      # Record the selected tools in the workflow log to make failures
      # diagnosable and reproducible.
      - name: Display tool versions
        run: |
          dotnet --info
          msbuild -version

      # Restore the pure framework-neutral contract-test project before any
      # WinUI build. This provides a fast boundary check for the worker
      # protocol and prevents native/UI dependencies entering the shared model.
      - name: Restore Model Inspection contract tests
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet restore "$env:CONTRACT_TEST_PROJECT"
          if ($LASTEXITCODE -ne 0) {
            throw "Model Inspection contract restore failed: $LASTEXITCODE"
          }

      # Run the contract category through Microsoft.Testing.Platform.
      - name: Run Model Inspection contract tests
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet test "$env:CONTRACT_TEST_PROJECT" `
            --configuration Release `
            --no-restore `
            --filter "TestCategory=Contract" `
            --minimum-expected-tests 41
          if ($LASTEXITCODE -ne 0) {
            throw "Model Inspection contract tests failed: $LASTEXITCODE"
          }

      # Compile every Gate 2 boundary independently. Keeping this list explicit
      # makes a missing project, wrong target framework, or invalid dependency
      # direction visible before later process implementation begins.
      - name: Restore and build Gate 2 project shells
        run: |
          $ErrorActionPreference = 'Stop'

          $gate2Projects = @(
            'shared/GraniteEdgeAI.ModelInspection.Transport/GraniteEdgeAI.ModelInspection.Transport.csproj'
            'workers/GraniteEdgeAI.ModelInspection.Worker/GraniteEdgeAI.ModelInspection.Worker.csproj'
            'infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient/GraniteEdgeAI.ModelInspection.WorkerClient.csproj'
            'tests/UnitTests/GraniteEdgeAI.ModelInspection.Transport.Tests/GraniteEdgeAI.ModelInspection.Transport.Tests.csproj'
            'tests/UnitTests/GraniteEdgeAI.ModelInspection.Worker.Tests/GraniteEdgeAI.ModelInspection.Worker.Tests.csproj'
            'tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests.csproj'
            'tests/ProcessFixtures/GraniteEdgeAI.ModelInspection.ProtocolTestWorker/GraniteEdgeAI.ModelInspection.ProtocolTestWorker.csproj'
            'tests/IntegrationTests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests.csproj'
          )

          foreach ($project in $gate2Projects) {
            dotnet restore $project -p:Platform=x64
            if ($LASTEXITCODE -ne 0) {
              throw "Gate 2 project restore failed for $project with exit code $LASTEXITCODE."
            }
          }

          foreach ($project in $gate2Projects) {
            dotnet build $project `
              --configuration Release `
              --no-restore `
              -p:Platform=x64
            if ($LASTEXITCODE -ne 0) {
              throw "Gate 2 project build failed for $project with exit code $LASTEXITCODE."
            }
          }

      # Resolve all dependencies required to compile the packaged
      # WinUI application.
      - name: Restore WinUI application
        run: |
          msbuild "$env:APP_PROJECT" `
            /target:Restore `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64

      # Resolve all dependencies required by MSTest.
      - name: Restore unit-test project
        run: |
          dotnet restore "$env:TEST_PROJECT" `
            --runtime win-x64 `
            -p:Platform=x64

      # Compile the application before running automated tests.
      #
      # Package generation and signing are disabled because CI is
      # validating compilation, not producing a release package. Clear
      # the local-only publish profile and disable publish optimizations
      # that require a self-contained deployment.
      - name: Build WinUI application
        run: |
          msbuild "$env:APP_PROJECT" `
            /target:Build `
            /maxCpuCount `
            /verbosity:minimal `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64 `
            /property:PublishProfile= `
            /property:PublishTrimmed=false `
            /property:PublishReadyToRun=false `
            /property:AppxPackageSigningEnabled=false `
            /property:GenerateAppxPackageOnBuild=false

      # Compile the test source without repeating package restoration.
      - name: Build unit-test project
        run: |
          dotnet build "$env:TEST_PROJECT" `
            --configuration Release `
            --no-restore `
            --runtime win-x64 `
            -p:Platform=x64

      # Run the packaged WinUI test app through Visual Studio's app-container
      # runner. This creates the XAML UI thread required by [UITestMethod].
      - name: Run unit and WinUI UI-thread tests
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere `
            -latest `
            -products * `
            -find '**\Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' |
            Select-Object -First 1

          if (-not $vstest) {
            throw 'Visual Studio app-container test runner was not found.'
          }

          & $vstest `
            "D:\s\$env:TEST_RECIPE" `
            /Platform:x64 `
            /Logger:"trx;LogFileName=GraniteEdgeAI.UnitTests.trx" `
            /ResultsDirectory:"D:\s\$env:TEST_RESULTS_DIRECTORY"

          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            throw "The packaged unit-test run failed with exit code $testExitCode."
          }

          $trxPath = Join-Path `
            'D:\s' `
            "$env:TEST_RESULTS_DIRECTORY\GraniteEdgeAI.UnitTests.trx"
          if (-not (Test-Path -LiteralPath $trxPath -PathType Leaf)) {
            throw "The packaged unit-test run did not create $trxPath."
          }

          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          if (
            [int]$counters.total -le 0 -or
            [int]$counters.executed -le 0
          ) {
            throw 'The packaged unit-test run discovered or executed zero tests.'
          }

          if (
            [int]$counters.total -ne [int]$counters.passed -or
            [int]$counters.executed -ne [int]$counters.passed
          ) {
            throw 'The packaged unit-test TRX contains a non-passing result.'
          }

          $definitions = @($trx.TestRun.TestDefinitions.UnitTest)
          $results = @($trx.TestRun.Results.UnitTestResult)
          $requiredClasses = @(
            'GraniteEdgeAI.UnitTests.GgufQuickScannerTests'
            'GraniteEdgeAI.UnitTests.GgufFixtureIntegrityTests'
            'GraniteEdgeAI.UnitTests.ModelQuickScannerTests'
          )
          foreach ($requiredClass in $requiredClasses) {
            $requiredTestIds = @(
              $definitions |
                Where-Object {
                  $_.TestMethod.className -eq $requiredClass
                } |
                ForEach-Object { $_.id }
            )
            $passedClassResults = @(
              $results |
                Where-Object {
                  $_.testId -in $requiredTestIds -and
                  $_.outcome -eq 'Passed'
                }
            )
            if ($passedClassResults.Count -eq 0) {
              throw "The packaged run did not pass a test from $requiredClass."
            }
          }

      # Preserve the available report even when unit tests fail.
      #
      # When an earlier build fails, no TRX file will exist. In that
      # situation, issue a warning while preserving the original failure.
      #
      # Pinned immutable commit for actions/upload-artifact v7.0.0.
      - name: Upload unit-test results
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: unit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: D:/s/TestResults/UnitTests/**/*.trx
          if-no-files-found: warn
          retention-days: 30

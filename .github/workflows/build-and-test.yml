name: Build and test

# Run the complete validation after branch pushes, for pull requests into main,
# and when manually started from the GitHub Actions interface.
on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older branch build obsolete. Cancelling the stale run
# prevents two process-test campaigns from sharing one hosted runner at once.
concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh
    # WinUI's generated XAML paths can exceed older Windows path limits when
    # the long repository name is used directly.
    working-directory: D:\s

env:
  # actions/checkout inherits these process-scoped settings before it writes
  # the full cleanup-inventory tree on Windows.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: true
  APP_PROJECT: 'IBM Granite with TurboQuant (Intel)/IBM Granite with TurboQuant (Intel).csproj'
  TEST_PROJECT: 'tests/UnitTests/GraniteEdgeAI.UnitTests/GraniteEdgeAI.UnitTests.csproj'
  CONTRACT_TEST_PROJECT: 'tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/GraniteEdgeAI.ModelInspection.Contracts.Tests.csproj'
  TRANSPORT_TEST_PROJECT: 'tests/UnitTests/GraniteEdgeAI.ModelInspection.Transport.Tests/GraniteEdgeAI.ModelInspection.Transport.Tests.csproj'
  WORKER_TEST_PROJECT: 'tests/UnitTests/GraniteEdgeAI.ModelInspection.Worker.Tests/GraniteEdgeAI.ModelInspection.Worker.Tests.csproj'
  WORKER_CLIENT_TEST_PROJECT: 'tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests.csproj'
  WORKER_PROCESS_TEST_PROJECT: 'tests/IntegrationTests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests.csproj'
  WORKER_PROJECT: 'workers/GraniteEdgeAI.ModelInspection.Worker/GraniteEdgeAI.ModelInspection.Worker.csproj'
  FIXTURE_PROJECT: 'tests/ProcessFixtures/GraniteEdgeAI.ModelInspection.ProtocolTestWorker/GraniteEdgeAI.ModelInspection.ProtocolTestWorker.csproj'
  TEST_RECIPE: 'tests/UnitTests/GraniteEdgeAI.UnitTests/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/GraniteEdgeAI.UnitTests.build.appxrecipe'
  TEST_RESULTS_DIRECTORY: 'TestResults/UnitTests'
  GATE2_RESULTS_DIRECTORY: 'TestResults/Gate2'
  GRANITE_GATE2_WORKER_ROOT: 'D:/s/artifacts/gate2/worker'
  GRANITE_GATE2_FIXTURE_ROOT: 'D:/s/artifacts/gate2/fixture'
  GRANITE_WINDOWS_POWERSHELL_MODULES: 'C:/Windows/System32/WindowsPowerShell/v1.0/Modules'

jobs:
  build-and-test:
    name: Build WinUI and run unit tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # Pinned immutable commit for actions/checkout v7.0.0.
      - name: Check out required build inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # Every script-owned GGUF fixture must be reproducible before any build
      # result can be trusted.
      - name: Verify generated fixture reproducibility
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\tests\TestFixtures\Generate-GgufFixtures.ps1'

          git diff --exit-code -- tests/TestFixtures
          $fixtureDiffExitCode = $LASTEXITCODE
          $fixtureStatus = @(
            git status --porcelain --untracked-files=all -- tests/TestFixtures
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'git status failed while checking regenerated fixtures.'
          }
          if ($fixtureDiffExitCode -gt 1) {
            throw 'git diff failed while checking regenerated fixtures.'
          }
          if ($fixtureDiffExitCode -eq 1 -or $fixtureStatus.Count -ne 0) {
            $fixtureStatus | ForEach-Object { Write-Host $_ }
            throw 'Fixture regeneration left tracked or untracked changes.'
          }

      # Stage the sparse checkout at a short path before invoking WinUI's XAML
      # compiler or the x64 process tests.
      - name: Stage build inputs at a short path
        working-directory: ${{ github.workspace }}
        run: |
          $buildRoot = 'D:\s'
          robocopy $env:GITHUB_WORKSPACE $buildRoot /E /XD .git
          if ($LASTEXITCODE -ge 8) {
            throw "Failed to stage build inputs at $buildRoot."
          }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path (Join-Path $buildRoot 'global.json'))) {
            throw 'The staged checkout is incomplete: global.json was not found.'
          }

      # Pinned immutable commit for actions/setup-dotnet v5.0.0.
      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: D:/s/global.json

      # Pinned immutable commit for microsoft/setup-msbuild v3.0.0.
      - name: Add x64 MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
        with:
          msbuild-architecture: x64

      - name: Display tool versions
        run: |
          dotnet --info
          msbuild -version

      - name: Prepare Gate 2 evidence directories
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:GATE2_RESULTS_DIRECTORY | Out-Null
          New-Item -ItemType Directory -Force -Path $env:GRANITE_GATE2_WORKER_ROOT | Out-Null
          New-Item -ItemType Directory -Force -Path $env:GRANITE_GATE2_FIXTURE_ROOT | Out-Null

      - name: Restore Model Inspection contract tests
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore "$env:CONTRACT_TEST_PROJECT"
          if ($LASTEXITCODE -ne 0) {
            throw "Model Inspection contract restore failed: $LASTEXITCODE"
          }

      # the dedicated contract project includes protocol contracts and executable
      # architecture fitness functions while the floor prevents accidental test loss
      - name: Run Model Inspection contract tests
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test "$env:CONTRACT_TEST_PROJECT" `
            --configuration Release `
            --no-restore `
            --minimum-expected-tests 357 `
            --results-directory "$env:GATE2_RESULTS_DIRECTORY/Contracts" `
            --report-trx `
            --report-trx-filename "GraniteEdgeAI.ModelInspection.Contracts.Tests.trx"
          if ($LASTEXITCODE -ne 0) {
            throw "Model Inspection contract tests failed: $LASTEXITCODE"
          }

      # Compile each Gate 2 boundary independently so dependency-direction and
      # warnings-as-errors failures are visible before process execution.
      - name: Restore and build Gate 2 project shells
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet sln 'IBM Granite with TurboQuant (Intel).slnx' list
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 2 solution validation failed with exit code $LASTEXITCODE."
          }

          $gate2Projects = @(
            'shared/GraniteEdgeAI.ModelInspection.Transport/GraniteEdgeAI.ModelInspection.Transport.csproj'
            $env:WORKER_PROJECT
            'infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient/GraniteEdgeAI.ModelInspection.WorkerClient.csproj'
            $env:TRANSPORT_TEST_PROJECT
            $env:WORKER_TEST_PROJECT
            $env:WORKER_CLIENT_TEST_PROJECT
            $env:FIXTURE_PROJECT
            $env:WORKER_PROCESS_TEST_PROJECT
          )

          foreach ($project in $gate2Projects) {
            dotnet restore $project -p:Platform=x64
            if ($LASTEXITCODE -ne 0) {
              throw "Gate 2 project restore failed for $project with exit code $LASTEXITCODE."
            }
          }
          foreach ($project in $gate2Projects) {
            dotnet build $project --configuration Release --no-restore -p:Platform=x64
            if ($LASTEXITCODE -ne 0) {
              throw "Gate 2 project build failed for $project with exit code $LASTEXITCODE."
            }
          }

      # The production worker and abnormal fixture are published to different
      # roots. The fixture is test input and is never presented as product output.
      - name: Publish separate Gate 2 process inputs
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish "$env:WORKER_PROJECT" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output "$env:GRANITE_GATE2_WORKER_ROOT" `
            -p:Platform=x64 `
            -p:UseAppHost=true
          if ($LASTEXITCODE -ne 0) {
            throw "Production worker publish failed: $LASTEXITCODE"
          }

          dotnet publish "$env:FIXTURE_PROJECT" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output "$env:GRANITE_GATE2_FIXTURE_ROOT" `
            -p:Platform=x64 `
            -p:UseAppHost=true
          if ($LASTEXITCODE -ne 0) {
            throw "Protocol fixture publish failed: $LASTEXITCODE"
          }

          $workerExe = Join-Path $env:GRANITE_GATE2_WORKER_ROOT 'GraniteEdgeAI.ModelInspection.Worker.exe'
          $fixtureExe = Join-Path $env:GRANITE_GATE2_FIXTURE_ROOT 'GraniteEdgeAI.ModelInspection.ProtocolTestWorker.exe'
          foreach ($requiredFile in @($workerExe, $fixtureExe)) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Expected Gate 2 executable was not published: $requiredFile"
            }
          }

          $manifestPath = Join-Path $env:GATE2_RESULTS_DIRECTORY 'gate2-publish-manifest.txt'
          @(
            "source_commit=$env:GITHUB_SHA"
            "worker_file=$([IO.Path]::GetFileName($workerExe))"
            "worker_sha256=$((Get-FileHash -Algorithm SHA256 $workerExe).Hash)"
            "fixture_file=$([IO.Path]::GetFileName($fixtureExe))"
            "fixture_sha256=$((Get-FileHash -Algorithm SHA256 $fixtureExe).Hash)"
          ) | Set-Content -LiteralPath $manifestPath -Encoding utf8

          function Write-TreeManifest([string] $root, [string] $destination) {
            $fullRoot = [IO.Path]::GetFullPath($root).TrimEnd('\', '/')
            $lines = Get-ChildItem -LiteralPath $fullRoot -File -Recurse -Force |
              Sort-Object FullName |
              ForEach-Object {
                $relative = $_.FullName.Substring($fullRoot.Length + 1).Replace('\', '/')
                "$relative|$($_.Length)|$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
              }
            if (@($lines).Count -eq 0) {
              throw "The published process root is empty: $fullRoot"
            }
            $lines | Set-Content -LiteralPath $destination -Encoding utf8
          }

          Write-TreeManifest `
            $env:GRANITE_GATE2_WORKER_ROOT `
            (Join-Path $env:GATE2_RESULTS_DIRECTORY 'worker-before.sha256')
          Write-TreeManifest `
            $env:GRANITE_GATE2_FIXTURE_ROOT `
            (Join-Path $env:GATE2_RESULTS_DIRECTORY 'fixture-before.sha256')

      - name: Run Gate 2 transport tests
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test "$env:TRANSPORT_TEST_PROJECT" `
            --configuration Release `
            --minimum-expected-tests 20 `
            --results-directory "$env:GATE2_RESULTS_DIRECTORY/Transport" `
            --report-trx `
            --report-trx-filename "GraniteEdgeAI.ModelInspection.Transport.Tests.trx"
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 2 transport tests failed: $LASTEXITCODE"
          }

      - name: Run Gate 2 worker host tests
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test "$env:WORKER_TEST_PROJECT" `
            --configuration Release `
            --minimum-expected-tests 77 `
            --results-directory "$env:GATE2_RESULTS_DIRECTORY/Worker" `
            --report-trx `
            --report-trx-filename "GraniteEdgeAI.ModelInspection.Worker.Tests.trx"
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 2 worker host tests failed: $LASTEXITCODE"
          }

      - name: Verify exact worker engine test identities
        run: |
          $ErrorActionPreference = 'Stop'
          $trxPath = Join-Path "$env:GATE2_RESULTS_DIRECTORY/Worker" 'GraniteEdgeAI.ModelInspection.Worker.Tests.trx'
          if (-not (Test-Path -LiteralPath $trxPath -PathType Leaf)) {
            throw "Worker TRX was not produced: $trxPath"
          }

          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $definitions = @($trx.TestRun.TestDefinitions.UnitTest)
          $results = @($trx.TestRun.Results.UnitTestResult)
          $requiredClass = 'GraniteEdgeAI.ModelInspection.Worker.Tests.LlamaSharpInspectionEngineTests'
          $expectedMethodCounts = [ordered]@{
            'ProgramCreatesProductionLlamaSharpInspectionEngine' = 1
            'InspectAsyncForwardsExactRequestAndReportsOrderedSuccessfulProgress' = 1
            'InspectAsyncMapsCompleteEvidenceAndNumericSpecialTokenValues' = 1
            'InspectAsyncMapsAllowlistedFailureToFixedMessageWithoutDetailLeak' = 10
            'InspectAsyncMapsUnknownFailureAndEscapedExceptionToFixedGenericFailure' = 1
            'InspectAsyncReturnsCancelledAndFinalizesCurrentStage' = 1
            'InspectAsyncIntegrityFailureTakesPrecedenceOverCancellation' = 1
            'InspectAsyncMissingIntegrityEvidenceTakesVerificationFailurePrecedence' = 6
            'InspectAsyncSerializesConcurrentNativeProgressCallbacks' = 1
            'InspectAsyncRejectsImpossibleRuntimeProgressFacts' = 1
            'InspectAsyncRejectsIncompleteOrUnsafeSuccessfulResult' = 41
            'InspectAsyncCompletesWithNullableFindingsAndOmitsUnsafeDetail' = 1
            'InspectAsyncDoesNotFillUnavailableRuntimeEvidenceFromQuickScan' = 1
          }
          $classDefinitions = @($definitions |
            Where-Object { $_.TestMethod.className -eq $requiredClass })
          if ($classDefinitions.Count -ne 67) {
            throw "Expected exactly 67 worker engine cases, found $($classDefinitions.Count)."
          }

          $actualMethods = @($classDefinitions |
            Group-Object { $_.TestMethod.name })
          $unexpectedMethods = @($actualMethods |
            Where-Object { -not $expectedMethodCounts.Contains($_.Name) })
          if (
            $actualMethods.Count -ne $expectedMethodCounts.Count -or
            $unexpectedMethods.Count -ne 0
          ) {
            throw 'Worker engine TRX contains a missing or unexpected method.'
          }

          foreach ($entry in $expectedMethodCounts.GetEnumerator()) {
            $methodDefinitions = @($classDefinitions |
              Where-Object { $_.TestMethod.name -eq $entry.Key })
            if ($methodDefinitions.Count -ne $entry.Value) {
              throw (
                "Worker engine case count drifted for $($entry.Key): " +
                "expected $($entry.Value), found $($methodDefinitions.Count)."
              )
            }

            foreach ($definition in $methodDefinitions) {
              $testResults = @($results |
                Where-Object { $_.testId -eq $definition.id })
              if (
                $testResults.Count -ne 1 -or
                $testResults[0].outcome -ne 'Passed'
              ) {
                throw "Worker engine case did not pass exactly once: $($definition.name)"
              }
            }
          }

          $counters = $trx.TestRun.ResultSummary.Counters
          if ($null -eq $counters -or [int]$counters.notExecuted -ne 0) {
            throw 'Worker host evidence contains skipped tests.'
          }

      - name: Run Gate 2 WorkerClient tests
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test "$env:WORKER_CLIENT_TEST_PROJECT" `
            --configuration Release `
            -p:Platform=x64 `
            --minimum-expected-tests 91 `
            --results-directory "$env:GATE2_RESULTS_DIRECTORY/WorkerClient" `
            --report-trx `
            --report-trx-filename "GraniteEdgeAI.ModelInspection.WorkerClient.Tests.trx"
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 2 WorkerClient tests failed: $LASTEXITCODE"
          }

      - name: Verify fixed worker installation tests
        run: |
          $ErrorActionPreference = 'Stop'
          $trxPath = Join-Path $env:GATE2_RESULTS_DIRECTORY `
            'WorkerClient/GraniteEdgeAI.ModelInspection.WorkerClient.Tests.trx'
          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $definitions = @($trx.TestRun.TestDefinitions.UnitTest)
          $results = @($trx.TestRun.Results.UnitTestResult)
          $requiredClass = 'GraniteEdgeAI.ModelInspection.WorkerClient.Tests.WorkerInstallationLayoutTests'
          $required = @($definitions | Where-Object { $_.TestMethod.className -eq $requiredClass })
          if ($required.Count -ne 5) {
            throw "Expected exactly five fixed-layout tests, found $($required.Count)."
          }
          foreach ($definition in $required) {
            $matching = @($results | Where-Object { $_.testId -eq $definition.id -and $_.outcome -eq 'Passed' })
            if ($matching.Count -ne 1) {
              throw "A fixed-layout test did not pass exactly once: $($definition.name)"
            }
          }

      - name: Run Gate 2 real process tests
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test "$env:WORKER_PROCESS_TEST_PROJECT" `
            --configuration Release `
            --runtime win-x64 `
            -p:Platform=x64 `
            --minimum-expected-tests 32 `
            --results-directory "$env:GATE2_RESULTS_DIRECTORY/WorkerProcess" `
            --report-trx `
            --report-trx-filename "GraniteEdgeAI.ModelInspection.WorkerProcess.Tests.trx"
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 2 real process tests failed: $LASTEXITCODE"
          }

          $trxPath = Join-Path $env:GATE2_RESULTS_DIRECTORY `
            'WorkerProcess/GraniteEdgeAI.ModelInspection.WorkerProcess.Tests.trx'
          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $definitions = @($trx.TestRun.TestDefinitions.UnitTest)
          $results = @($trx.TestRun.Results.UnitTestResult)
          $requiredClasses = @(
            'GraniteEdgeAI.ModelInspection.WorkerProcess.Tests.ProductionWorkerProcessTests'
            'GraniteEdgeAI.ModelInspection.WorkerProcess.Tests.ProductionWorkerNativeCompletionTests'
            'GraniteEdgeAI.ModelInspection.WorkerProcess.Tests.ProductionWorkerPackagingTests'
          )
          foreach ($requiredClass in $requiredClasses) {
            $requiredIds = @($definitions |
              Where-Object { $_.TestMethod.className -eq $requiredClass } |
              ForEach-Object { $_.id })
            $passed = @($results |
              Where-Object { $_.testId -in $requiredIds -and $_.outcome -eq 'Passed' })
            if ($requiredIds.Count -ne 1 -or $passed.Count -ne 1) {
              throw "The full process suite did not pass $requiredClass exactly once."
            }
          }

      - name: Verify Gate 2 process inputs stayed immutable
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-TreeManifest([string] $root) {
            $fullRoot = [IO.Path]::GetFullPath($root).TrimEnd('\', '/')
            @(Get-ChildItem -LiteralPath $fullRoot -File -Recurse -Force |
              Sort-Object FullName |
              ForEach-Object {
                $relative = $_.FullName.Substring($fullRoot.Length + 1).Replace('\', '/')
                "$relative|$($_.Length)|$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
              })
          }

          foreach ($input in @(
            @{ Name = 'worker'; Root = $env:GRANITE_GATE2_WORKER_ROOT },
            @{ Name = 'fixture'; Root = $env:GRANITE_GATE2_FIXTURE_ROOT }
          )) {
            $beforePath = Join-Path $env:GATE2_RESULTS_DIRECTORY "$($input.Name)-before.sha256"
            if (-not (Test-Path -LiteralPath $beforePath -PathType Leaf)) {
              throw "The $($input.Name) pre-test manifest is missing."
            }
            $before = @(Get-Content -LiteralPath $beforePath)
            $after = @(Get-TreeManifest $input.Root)
            if ($null -ne (Compare-Object -ReferenceObject $before -DifferenceObject $after)) {
              throw "The published $($input.Name) tree changed during process tests."
            }
          }

      - name: Restore WinUI application
        run: |
          dotnet msbuild "$env:APP_PROJECT" `
            /target:Restore `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64

      - name: Restore unit-test project
        run: |
          dotnet restore "$env:TEST_PROJECT" --runtime win-x64 -p:Platform=x64

      - name: Build WinUI application
        run: |
          $env:PSModulePath = $env:GRANITE_WINDOWS_POWERSHELL_MODULES
          dotnet msbuild "$env:APP_PROJECT" `
            /target:Build `
            /maxCpuCount `
            /verbosity:minimal `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64 `
            /property:PublishProfile= `
            /property:PublishTrimmed=false `
            /property:PublishReadyToRun=false `
            /property:AppxPackageSigningEnabled=false `
            /property:GenerateAppxPackageOnBuild=false `
            /property:OpenVinoOfficialWorkerPackagingRequired=false

      - name: Build unit-test project
        run: |
          $env:PSModulePath = $env:GRANITE_WINDOWS_POWERSHELL_MODULES
          dotnet build "$env:TEST_PROJECT" `
            --configuration Release `
            --no-restore `
            --runtime win-x64 `
            -p:Platform=x64 `
            /property:GenerateAppxPackageOnBuild=false `
            /property:OpenVinoOfficialWorkerPackagingRequired=false

      - name: Run serialized Debug x64 Model Inspection fixture gallery
        run: |
          $env:PSModulePath = $env:GRANITE_WINDOWS_POWERSHELL_MODULES
          $fixtureGalleryConfiguration = 'Debug'
          $fixtureGalleryPlatform = 'x64'
          dotnet msbuild "$env:APP_PROJECT" /target:Restore,Build /property:Configuration=$fixtureGalleryConfiguration /property:Platform=$fixtureGalleryPlatform /property:GenerateAppxPackageOnBuild=false /property:OpenVinoOfficialWorkerPackagingRequired=false
          if ($LASTEXITCODE -ne 0) { throw 'Debug fixture-gallery app build failed.' }
          dotnet build "$env:TEST_PROJECT" --configuration $fixtureGalleryConfiguration --runtime win-x64 -p:Platform=$fixtureGalleryPlatform /property:GenerateAppxPackageOnBuild=false /property:OpenVinoOfficialWorkerPackagingRequired=false
          if ($LASTEXITCODE -ne 0) { throw 'Debug fixture-gallery test build failed.' }
          $fixtureGalleryRecipe = 'D:/s/tests/UnitTests/GraniteEdgeAI.UnitTests/bin/x64/Debug/net8.0-windows10.0.19041.0/win-x64/GraniteEdgeAI.UnitTests.build.appxrecipe'
          $fixtureGalleryTrxPath = 'D:/s/TestResults/ModelInspectionFixtures/ModelInspectionFixtureGallery.trx'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) { throw 'Visual Studio app-container test runner was not found.' }
          try {
            & $vstest $fixtureGalleryRecipe /Platform:x64 /Logger:"trx;LogFileName=ModelInspectionFixtureGallery.trx" /ResultsDirectory:"D:/s/TestResults/ModelInspectionFixtures" /TestCaseFilter:"TestCategory=ModelInspectionFixtureGallery"
            if ($LASTEXITCODE -ne 0) { throw 'Debug fixture-gallery VSTest failed.' }
            if (-not (Test-Path -LiteralPath $fixtureGalleryTrxPath -PathType Leaf)) { throw 'Fixture-gallery TRX was not created.' }
            [xml]$trx = Get-Content -LiteralPath $fixtureGalleryTrxPath -Raw
            $fixtureGalleryExpectedTotal = 220
            $fixtureGalleryExpectedClassCounts = [ordered]@{
            'GraniteEdgeAI.UnitTests.DebugModelInspectionServiceTests' = 41
            'GraniteEdgeAI.UnitTests.ModelInspectionFixtureAdapterTests' = 12
            'GraniteEdgeAI.UnitTests.ModelInspectionFixtureGalleryTests' = 73
            'GraniteEdgeAI.UnitTests.ModelInspectionFixtureInteractionTests' = 6
            'GraniteEdgeAI.UnitTests.ModelInspectionFixtureLifetimeTests' = 13
            'GraniteEdgeAI.UnitTests.ModelInspectionFixturePageLifecycleTests' = 7
            'GraniteEdgeAI.UnitTests.ModelInspectionFixturePresetTests' = 25
            'GraniteEdgeAI.UnitTests.ModelInspectionFixtureScreenContractTests' = 37
            'GraniteEdgeAI.UnitTests.ModelInspectionFixtureViewModelIntegrationTests' = 6
            }
            $fixtureGalleryExpectedClassTotal = [int](($fixtureGalleryExpectedClassCounts.Values | Measure-Object -Sum).Sum)
            if ($fixtureGalleryExpectedClassTotal -ne $fixtureGalleryExpectedTotal) { throw 'Fixture-gallery expected class counts do not sum to the expected total.' }
            $counters = $trx.TestRun.ResultSummary.Counters
            if ([int]$counters.total -ne $fixtureGalleryExpectedTotal -or [int]$counters.executed -ne $fixtureGalleryExpectedTotal -or [int]$counters.passed -ne $fixtureGalleryExpectedTotal) { throw 'Fixture-gallery total drifted.' }
            $definitions = @($trx.TestRun.TestDefinitions.UnitTest)
            $results = @($trx.TestRun.Results.UnitTestResult)
            $actualClassNames = @($definitions | ForEach-Object { [string]$_.TestMethod.className } | Sort-Object -Unique)
            $expectedClassNames = @($fixtureGalleryExpectedClassCounts.Keys | Sort-Object)
            $classSetDifference = @(Compare-Object -ReferenceObject $expectedClassNames -DifferenceObject $actualClassNames)
            if ($classSetDifference.Count -ne 0) { throw 'Fixture-gallery class set drifted.' }
            foreach ($entry in $fixtureGalleryExpectedClassCounts.GetEnumerator()) {
              $classIds = @($definitions | Where-Object { $_.TestMethod.className -eq $entry.Key } | ForEach-Object { $_.id })
              $passedClassResults = @($results | Where-Object { $_.testId -in $classIds -and $_.outcome -eq 'Passed' })
              if ($classIds.Count -ne [int]$entry.Value -or $passedClassResults.Count -ne [int]$entry.Value) { throw 'Fixture-gallery class count drifted.' }
            }
          } finally {
            if (Test-Path -LiteralPath $fixtureGalleryTrxPath -PathType Leaf) {
              Remove-Item -LiteralPath $fixtureGalleryTrxPath -Force
            }
          }
          if (Test-Path -LiteralPath $fixtureGalleryTrxPath -PathType Leaf) { throw 'Raw fixture-gallery TRX was retained.' }

      - name: Run unit and WinUI UI-thread tests
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) {
            throw 'Visual Studio app-container test runner was not found.'
          }

          & $vstest `
            "D:\s\$env:TEST_RECIPE" `
            /Platform:x64 `
            /Logger:"trx;LogFileName=GraniteEdgeAI.UnitTests.trx" `
            /ResultsDirectory:"D:\s\$env:TEST_RESULTS_DIRECTORY" `
            /TestCaseFilter:"TestCategory!=ModelInspectionVisualRegression&TestCategory!=ModelInspectionControlledOs"
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged unit-test run failed with exit code $LASTEXITCODE."
          }

          $trxPath = Join-Path 'D:\s' "$env:TEST_RESULTS_DIRECTORY\GraniteEdgeAI.UnitTests.trx"
          if (-not (Test-Path -LiteralPath $trxPath -PathType Leaf)) {
            throw "The packaged unit-test run did not create $trxPath."
          }
          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          $minimumExpectedTests = 686
          $measuredExpectedTests = 717
          if ([int]$counters.total -lt $minimumExpectedTests -or [int]$counters.executed -lt $minimumExpectedTests) {
            throw "The packaged unit-test run fell below the $minimumExpectedTests-test floor."
          }
          if ([int]$counters.total -ne $measuredExpectedTests -or [int]$counters.executed -ne $measuredExpectedTests) {
            throw "The packaged unit-test run drifted from the measured $measuredExpectedTests-test total."
          }
          if ([int]$counters.total -ne [int]$counters.passed -or [int]$counters.executed -ne [int]$counters.passed) {
            throw 'The packaged unit-test TRX contains a non-passing result.'
          }

          $definitions = @($trx.TestRun.TestDefinitions.UnitTest)
          $results = @($trx.TestRun.Results.UnitTestResult)
          $requiredClasses = @(
            'GraniteEdgeAI.UnitTests.GgufQuickScannerTests'
            'GraniteEdgeAI.UnitTests.GgufFixtureIntegrityTests'
            'GraniteEdgeAI.UnitTests.ModelQuickScannerTests'
            'GraniteEdgeAI.UnitTests.ModelInspectionWorkerCompositionTests'
          )
          foreach ($requiredClass in $requiredClasses) {
            $requiredTestIds = @($definitions | Where-Object { $_.TestMethod.className -eq $requiredClass } | ForEach-Object { $_.id })
            $passedClassResults = @($results | Where-Object { $_.testId -in $requiredTestIds -and $_.outcome -eq 'Passed' })
            if ($passedClassResults.Count -eq 0) {
              throw "The packaged run did not pass a test from $requiredClass."
            }
          }

          $protectedClassCounts = [ordered]@{
            'GraniteEdgeAI.UnitTests.ModelInspectionRequestFactoryTests' = 10
            'GraniteEdgeAI.UnitTests.ModelInspectionContractTests' = 33
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Runtime.ModelInspectionProbeResultTests' = 4
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Runtime.WorkerRequestMapperTests' = 3
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Runtime.WorkerResultMapperTests' = 9
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Runtime.WorkerProcessLlamaModelProbeTests' = 7
            'GraniteEdgeAI.UnitTests.ModelInspectionClassifierTests' = 5
            'GraniteEdgeAI.UnitTests.ModelInspectionServiceTests' = 4
            'GraniteEdgeAI.UnitTests.DelegateCommandTests' = 2
            'GraniteEdgeAI.UnitTests.ModelInspectionViewModelTests' = 24
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Presentation.InspectionProgressPresentationFactoryTests' = 13
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Presentation.ModelInspectionPresentationFactoryTests' = 18
            'GraniteEdgeAI.UnitTests.InspectionVisualStateGuardTests' = 13
            'GraniteEdgeAI.UnitTests.ModelInspectionPageNavigationTests' = 39
            'GraniteEdgeAI.UnitTests.OnboardingModelInspectionNavigationTests' = 14
            'GraniteEdgeAI.UnitTests.ModelInspectionWorkerCompositionTests' = 13
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Presentation.ModelInspectionAssetContractTests' = 3
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Presentation.ModelInspectionDisplayTextPolicyTests' = 46
            'GraniteEdgeAI.UnitTests.ModelInspectionViewSnapshotTests' = 6
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Presentation.ModelInspectionFigmaStatePresentationTests' = 77
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Presentation.InspectionProgressRowsTests' = 16
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Controls.InspectionActionCardTests' = 4
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Controls.InspectionContentCardTests' = 25
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Controls.InspectionModelCardTests' = 9
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Controls.InspectionOutcomeCardTests' = 7
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Presentation.ModelInspectionRenderCoordinatorTests' = 27
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Presentation.ModelInspectionMotionTests' = 29
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Controls.ModelInspectionDisclosureTests' = 5
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Visual.ModelInspectionRenderHarnessTests' = 2
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Visual.ModelInspectionRenderedStateTests' = 21
            'GraniteEdgeAI.UnitTests.Features.ModelInspection.Visual.ModelInspectionAccessibilityTests' = 9
          }
          foreach ($entry in $protectedClassCounts.GetEnumerator()) {
            $classIds = @($definitions | Where-Object { $_.TestMethod.className -eq $entry.Key } | ForEach-Object { $_.id })
            $passedClassResults = @($results | Where-Object { $_.testId -in $classIds -and $_.outcome -eq 'Passed' })
            if ($classIds.Count -ne [int]$entry.Value -or $passedClassResults.Count -ne [int]$entry.Value) {
              throw "Expected exactly $($entry.Value) passing executions from $($entry.Key)."
            }
          }

      # This check always runs. It records a failure before cleaning the runner,
      # so process leakage cannot be hidden by successful test assertions.
      - name: Verify Model Inspection fixture Release isolation
        working-directory: ${{ github.workspace }}
        run: |
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE 'TestResults\ModelInspectionFixtures\ReleaseIsolation\release-isolation-evidence.json'
          & '.\scripts\model-inspection\Test-ModelInspectionFixtureReleaseIsolation.ps1' -EvidencePath $evidencePath
          $isolationEvidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($isolationEvidence.status -ne 'passed') { throw 'Release isolation did not pass.' }

      - name: Check for orphaned Gate 2 processes
        if: ${{ always() }}
        run: |
          $names = @(
            'GraniteEdgeAI.ModelInspection.Worker'
            'GraniteEdgeAI.ModelInspection.ProtocolTestWorker'
          )
          $remaining = @(
            Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $names -contains $_.ProcessName }
          )
          if ($remaining.Count -gt 0) {
            $remaining | Format-Table Id, ProcessName, StartTime
            $remaining | Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'Gate 2 left a process running.'
          }
          Write-Host 'No Gate 2 worker or fixture process remains.'

      # Gate 2 TRX contains machine identity and absolute paths. It remains
      # runner-ephemeral until a complete sanitizer and gated upload exist.

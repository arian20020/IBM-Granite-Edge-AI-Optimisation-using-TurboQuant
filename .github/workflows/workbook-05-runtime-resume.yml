name: Workbook 05 Route A Runtime controlled resume

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-runtime-resume.yml'
      - 'external-design-records/**'
      - 'scripts/testing/**'
      - 'tests/testing/workbook05/**'
      - 'experiments/granite_turboquant_intel/schemas/workbook05/**'
  workflow_dispatch:
    inputs:
      resume_workspace:
        description: Exact timed-out Route A Runtime workspace
        required: true
        default: 'C:\w5a\phase2-31391119557-4'
        type: string
      resume_run_id:
        description: Exact workflow run that produced the timeout artifact
        required: true
        default: '31391119557'
        type: string
      resume_run_attempt:
        description: Exact timeout workflow attempt
        required: true
        default: 4
        type: number
      resume_artifact_name:
        description: Exact timeout artifact name
        required: true
        default: 'workbook-05-build-route-a-runtime-31391119557-4'
        type: string
      resume_expected_artifact_digest:
        description: GitHub-recorded SHA-256 for the timeout artifact
        required: true
        default: 'sha256:b2b9f0ca8528f1d6135d03c77ac964f8799ffc8989cc1a03515a6d5c7c73c1a4'
        type: string
      resume_actual_artifact_digest:
        description: Independently verified SHA-256 for the timeout artifact
        required: true
        default: 'sha256:b2b9f0ca8528f1d6135d03c77ac964f8799ffc8989cc1a03515a6d5c7c73c1a4'
        type: string
      resume_head_sha:
        description: Exact repository head that produced the timeout artifact
        required: true
        default: 'fb5d3349aae9d7acb6bd8132cbffa2303e40cabd'
        type: string
      expected_cache_sha256:
        description: Exact CMakeCache.txt SHA-256 from the timeout artifact
        required: true
        default: 'b5c0606efa261a9525f5562eb973919d508f5242a567f82a46d0b0b9df725c77'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-runtime-resume-${{ github.ref }}
  cancel-in-progress: false

env:
  WB05_PYTHON: C:\Program Files\Python312\python.exe

jobs:
  verify-runtime-resume-contract:
    name: Verify controlled-resume repository contract
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact controlled-resume files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/testing
            external-design-records
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05
      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Run the complete documented-build gate
        shell: powershell
        run: >-
          & '.\scripts\testing\Validate-Workbook05-BuildStage.ps1'
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -PythonPath 'python'

  collect-route-a-runtime-resume:
    name: Collect controlled Route A Runtime resume evidence
    needs: verify-runtime-resume-contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'arian20020/IBM-Granite-Edge-AI-Optimisation-using-TurboQuant'
    runs-on: [self-hosted, Windows, X64, workbook05, intel-target]
    timeout-minutes: 720
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Check out exact controlled-resume files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/testing
            external-design-records
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Run the repository gate on the Intel runner
        run: >-
          & '.\scripts\testing\Validate-Workbook05-BuildStage.ps1'
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -PythonPath $env:WB05_PYTHON

      - name: Verify exact prior artifact identity
        env:
          WB05_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WB05_REPOSITORY: ${{ github.repository }}
          WB05_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          WB05_RESUME_RUN_ATTEMPT: ${{ inputs.resume_run_attempt }}
          WB05_RESUME_ARTIFACT_NAME: ${{ inputs.resume_artifact_name }}
          WB05_RESUME_EXPECTED_DIGEST: ${{ inputs.resume_expected_artifact_digest }}
          WB05_RESUME_ACTUAL_DIGEST: ${{ inputs.resume_actual_artifact_digest }}
          WB05_RESUME_HEAD_SHA: ${{ inputs.resume_head_sha }}
        run: |
          & '.\scripts\testing\workbook05\Assert-Workbook05ArtifactIdentity.ps1' `
              -Repository $env:WB05_REPOSITORY `
              -RunId $env:WB05_RESUME_RUN_ID `
              -RunAttempt $env:WB05_RESUME_RUN_ATTEMPT `
              -ArtifactName $env:WB05_RESUME_ARTIFACT_NAME `
              -ExpectedArtifactDigest $env:WB05_RESUME_EXPECTED_DIGEST `
              -ActualArtifactDigest $env:WB05_RESUME_ACTUAL_DIGEST `
              -ExpectedHeadSha $env:WB05_RESUME_HEAD_SHA `
              -GitHubToken $env:WB05_GITHUB_TOKEN

      - name: Download exact prior timeout artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ inputs.resume_artifact_name }}
          path: ${{ runner.temp }}\route-a-runtime-resume-prerequisite
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Execute controlled Route A Runtime resume
        env:
          WB05_RESUME_WORKSPACE: ${{ inputs.resume_workspace }}
          WB05_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          WB05_RESUME_RUN_ATTEMPT: ${{ inputs.resume_run_attempt }}
          WB05_RESUME_ARTIFACT_NAME: ${{ inputs.resume_artifact_name }}
          WB05_RESUME_EXPECTED_DIGEST: ${{ inputs.resume_expected_artifact_digest }}
          WB05_RESUME_ACTUAL_DIGEST: ${{ inputs.resume_actual_artifact_digest }}
          WB05_RESUME_HEAD_SHA: ${{ inputs.resume_head_sha }}
          WB05_RESUME_CACHE_SHA: ${{ inputs.expected_cache_sha256 }}
        run: |
          $output = Join-Path `
              $env:RUNNER_TEMP `
              'workbook-05-build-route-a-runtime-resume'
          $prerequisite = Join-Path `
              $env:RUNNER_TEMP `
              'route-a-runtime-resume-prerequisite'

          & '.\scripts\testing\workbook05\Invoke-Workbook05RouteARuntimeResume.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -OutputDirectory $output `
              -ResumeBundleDirectory $prerequisite `
              -ResumeWorkspaceDirectory $env:WB05_RESUME_WORKSPACE `
              -ResumeRunId $env:WB05_RESUME_RUN_ID `
              -ResumeRunAttempt $env:WB05_RESUME_RUN_ATTEMPT `
              -ResumeArtifactName $env:WB05_RESUME_ARTIFACT_NAME `
              -ResumeExpectedArtifactDigest $env:WB05_RESUME_EXPECTED_DIGEST `
              -ResumeActualArtifactDigest $env:WB05_RESUME_ACTUAL_DIGEST `
              -ResumeHeadSha $env:WB05_RESUME_HEAD_SHA `
              -ExpectedCacheSha256 $env:WB05_RESUME_CACHE_SHA `
              -InternalDeadlineSeconds 39600 `
              -PythonPath $env:WB05_PYTHON

      - name: Bind resumed bundle metadata to this exact attempt
        if: always()
        run: |
          $output = Join-Path `
              $env:RUNNER_TEMP `
              'workbook-05-build-route-a-runtime-resume'

          & '.\scripts\testing\workbook05\Write-Workbook05BuildBundleMetadata.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -BundleDirectory $output `
              -RouteId 'route-a-merged-openvino' `
              -Component 'runtime' `
              -SourceCommit 'b9a1f201c109e0bed74763934f79483cf6c4cbf4' `
              -RunId '${{ github.run_id }}' `
              -RunAttempt ${{ github.run_attempt }}

      - name: Upload exact text-only resumed Runtime evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-build-route-a-runtime-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-build-route-a-runtime-resume
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  validate-route-a-runtime-resume:
    name: Independently validate resumed Route A Runtime evidence
    needs: collect-route-a-runtime-resume
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact validation files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/testing
            external-design-records
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests/campaigns/GTQ-WB05-MF-v1
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Download exact same-attempt resumed artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: workbook-05-build-route-a-runtime-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\build-bundle

      - name: Rerun repository gate
        shell: powershell
        run: >-
          & '.\scripts\testing\Validate-Workbook05-BuildStage.ps1'
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -PythonPath 'python'

      - name: Validate resumed artifact as untrusted data
        env:
          PYTHONPATH: ${{ runner.temp }}\workbook05-build-stage-python
        shell: powershell
        run: >-
          python -m scripts.testing.workbook05.build_bundle_validation
          --bundle '${{ runner.temp }}\build-bundle'
          --repository-root $env:GITHUB_WORKSPACE
          --route-id route-a-merged-openvino
          --component runtime
          --source-commit b9a1f201c109e0bed74763934f79483cf6c4cbf4
          --run-id '${{ github.run_id }}'
          --run-attempt '${{ github.run_attempt }}'
          --report '${{ runner.temp }}\route-a-runtime-resume-validation.md'

name: Workbook 05 Phase 3 harness fixtures

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-phase3-harness-tests.yml'
      - 'scripts/testing/Validate-Workbook05-Phase3.ps1'
      - 'scripts/testing/workbook05/Workbook05.Run.psm1'
      - 'scripts/testing/workbook05/Invoke-Workbook05Phase3HarnessFixture.ps1'
      - 'scripts/testing/workbook05/phase3/**'
      - 'experiments/granite_turboquant_intel/schemas/workbook05/**'
      - 'experiments/granite_turboquant_intel/manifests/templates/workbook05/**'
      - 'tests/testing/workbook05/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-phase3-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce-fixture-evidence:
    name: Produce hosted process-harness fixture evidence
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact C2 revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/testing
            experiments/granite_turboquant_intel/manifests/templates/workbook05
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing
            tests/testing/workbook05

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned repository-validation dependencies
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\workbook05\requirements.txt'

      - name: Run complete Phase 3 gate before fixture generation
        shell: powershell
        run: >-
          .\scripts\testing\Validate-Workbook05-Phase3.ps1
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -PythonPath 'python'

      - name: Produce one model-free fixture bundle
        shell: powershell
        run: >-
          .\scripts\testing\workbook05\Invoke-Workbook05Phase3HarnessFixture.ps1
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -PythonPath 'python'
          -BundleRoot (Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-harness-fixture')

      - name: Validate the producer bundle before upload
        shell: powershell
        run: >-
          python -m scripts.testing.workbook05.phase3.process_bundle_validation
          --repository-root $env:GITHUB_WORKSPACE
          --bundle (Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-harness-fixture')
          --report (Join-Path $env:RUNNER_TEMP 'producer-process-bundle-validation.json')

      - name: Upload exact fixture evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-phase3-harness-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-phase3-harness-fixture
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  validate-fixture-evidence:
    name: Independently validate hosted process-harness evidence
    needs: produce-fixture-evidence
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact C2 validator revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            experiments/granite_turboquant_intel/schemas/workbook05
            scripts/testing/workbook05
            tests/testing/workbook05

      - name: Set up independent Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned independent-validator dependencies
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\workbook05\requirements.txt'

      - name: Download the exact same-attempt fixture artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: workbook-05-phase3-harness-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-phase3-harness-fixture

      - name: Re-run focused validator regressions
        shell: powershell
        run: >-
          python -m unittest -v
          tests.testing.workbook05.test_phase3_process_bundle_validation

      - name: Validate downloaded evidence as untrusted data
        shell: powershell
        run: |
          python -m scripts.testing.workbook05.phase3.process_bundle_validation `
              --repository-root $env:GITHUB_WORKSPACE `
              --bundle (Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-harness-fixture') `
              --report (Join-Path $env:RUNNER_TEMP 'independent-process-bundle-validation.json')
          if ($LASTEXITCODE -ne 0) {
              throw "Independent process_bundle_validation exited with code $LASTEXITCODE."
          }
          Write-Host 'WORKBOOK05_PHASE3_HARNESS_INDEPENDENT_PASS'

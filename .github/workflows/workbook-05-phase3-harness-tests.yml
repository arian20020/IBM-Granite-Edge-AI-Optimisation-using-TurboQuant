name: Workbook 05 Phase 3 process harness

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-phase3-harness-tests.yml'
      - 'docs/testing/workbook05/phase3-harness-runbook.md'
      - 'experiments/granite_turboquant_intel/manifests/templates/workbook05/**'
      - 'experiments/granite_turboquant_intel/schemas/workbook05/**'
      - 'scripts/testing/**'
      - 'tests/testing/workbook05/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-phase3-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce-fixture-evidence:
    name: Produce hosted C2 fixture evidence
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact C2 revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas
            scripts/testing
            tests/testing/workbook05

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Install pinned validation dependency
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\workbook05\requirements.txt'

      - name: Run complete Phase 3 repository gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\testing\Validate-Workbook05-Phase3.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python'
          if ($LASTEXITCODE -ne 0) {
              throw "Phase 3 gate exited with code $LASTEXITCODE."
          }

      - name: Generate bounded synthetic process evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'workbook-05-phase3-harness-fixtures'
          & '.\scripts\testing\workbook05\Invoke-Workbook05Phase3HarnessFixture.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python' `
              -OutputRoot $artifactRoot
          if ($LASTEXITCODE -ne 0) {
              throw "C2 fixture generation exited with code $LASTEXITCODE."
          }

      - name: Upload same-attempt fixture evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-phase3-harness-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-phase3-harness-fixtures
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  validate-fixture-evidence:
    name: Independently validate hosted C2 fixture evidence
    needs: produce-fixture-evidence
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact validation revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers
            docs/testing
            experiments/granite_turboquant_intel/configurations/workbook05
            experiments/granite_turboquant_intel/manifests
            experiments/granite_turboquant_intel/prompts
            experiments/granite_turboquant_intel/rubrics
            experiments/granite_turboquant_intel/schemas
            scripts/testing
            tests/testing/workbook05

      - name: Set up independent Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Install pinned validation dependency
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\workbook05\requirements.txt'

      - name: Download exact same-attempt fixture artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: workbook-05-phase3-harness-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-phase3-harness-fixtures

      - name: Validate downloaded fixture bundle as untrusted data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest -v `
              tests.testing.workbook05.test_phase3_process_bundle_validation
          if ($LASTEXITCODE -ne 0) {
              throw "C2 bundle tests exited with code $LASTEXITCODE."
          }
          python -m scripts.testing.workbook05.phase3.process_bundle_validation `
              --bundle $env:RUNNER_TEMP\workbook-05-phase3-harness-fixtures `
              --repository-root $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
              throw "Independent C2 bundle validation exited with code $LASTEXITCODE."
          }
          Write-Host 'WORKBOOK05_C2_HARNESS_INDEPENDENT_PASS'

name: Workbook 05 C2 non-workflow materialisation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-c2-materialise-nonworkflow.yml'
      - '.bootstrap-c2/workbook05-c2-source.b64.part-*'
  workflow_dispatch:

# This one-time hosted job writes only reviewed non-workflow C2 source files.
# The permanent workflow is committed separately through the reviewed connector
# because GitHub App tokens may not update workflow files through git push.
permissions:
  contents: write
  actions: read

concurrency:
  group: workbook-05-c2-nonworkflow-materialisation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialise-reviewed-c2-source:
    name: Materialise reviewed C2 non-workflow source
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact C2 branch inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .bootstrap-c2
            .github/workflows
            docs/testing
            experiments/granite_turboquant_intel/manifests
            experiments/granite_turboquant_intel/schemas
            scripts/testing
            tests/testing/workbook05

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Install pinned Phase 3 validation dependency
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\workbook05\requirements.txt'

      - name: Verify and extract exact reviewed C2 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
              Get-ChildItem `
                  -LiteralPath '.\.bootstrap-c2' `
                  -Filter 'workbook05-c2-source.b64.part-*' `
                  -File |
                  Sort-Object Name
          )
          if ($parts.Count -ne 6) {
              throw "Expected exactly six reviewed C2 payload parts; found $($parts.Count)."
          }

          $encoded = [string]::Concat(@(
              $parts | ForEach-Object {
                  (Get-Content -LiteralPath $_.FullName -Raw -Encoding utf8).Trim()
              }
          ))
          $archive = Join-Path $env:RUNNER_TEMP 'workbook05-c2-source.tar.gz'
          [IO.File]::WriteAllBytes(
              $archive,
              [Convert]::FromBase64String($encoded)
          )
          $expected = '86d65d644cd2d6e3e69dbc324c0d11895ae4139e060648e552baccb796806e72'
          $actual = (
              Get-FileHash -LiteralPath $archive -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actual -cne $expected) {
              throw "Reviewed C2 payload digest mismatch. Expected $expected; observed $actual."
          }

          python -c "import pathlib,sys,tarfile; tarfile.open(sys.argv[1],'r:gz').extractall(pathlib.Path(sys.argv[2]),filter='data')" `
              $archive `
              $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
              throw "Reviewed C2 payload extraction exited with code $LASTEXITCODE."
          }

          # Apply the one defect reproduced by the complete Windows gate.
          $modulePath = '.\scripts\testing\workbook05\Workbook05.Run.psm1'
          $moduleText = Get-Content -LiteralPath $modulePath -Raw -Encoding utf8
          $oldDeclaration = '[Parameter(Mandatory)][int[]] $RemainingProcessIds,'
          $newDeclaration = @'
          [Parameter(Mandatory)]
          [AllowEmptyCollection()]
          [int[]] $RemainingProcessIds,
          '@.Trim()
          $occurrences = ([regex]::Matches(
              $moduleText,
              [regex]::Escape($oldDeclaration)
          )).Count
          if ($occurrences -ne 1) {
              throw "Expected one exact RemainingProcessIds declaration; found $occurrences."
          }
          $moduleText = $moduleText.Replace($oldDeclaration, $newDeclaration)
          [IO.File]::WriteAllText(
              $modulePath,
              $moduleText,
              [Text.UTF8Encoding]::new($false)
          )
          if (
              (Get-Content -LiteralPath $modulePath -Raw -Encoding utf8) -notmatch
              '(?s)\[Parameter\(Mandatory\)\]\s*\[AllowEmptyCollection\(\)\]\s*\[int\[\]\]\s*\$RemainingProcessIds,'
          ) {
              throw 'The empty-descendant cooldown repair was not applied.'
          }

          # The permanent harness workflow is committed separately through the
          # connector. Never stage a workflow from this write-token job.
          $payloadWorkflow = '.\.github\workflows\workbook-05-phase3-harness-tests.yml'
          if (Test-Path -LiteralPath $payloadWorkflow -PathType Leaf) {
              Remove-Item -LiteralPath $payloadWorkflow -Force
          }

          Get-ChildItem `
              -LiteralPath '.\tests\testing\workbook05\fixtures\phase3\process' `
              -Directory `
              -Filter '__pycache__' `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          Get-ChildItem `
              -LiteralPath '.\tests\testing\workbook05\fixtures\phase3\process' `
              -File `
              -Filter '*.pyc' `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Remove-Item -Force

      - name: Run focused production and fixture contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest -v `
              tests.testing.workbook05.test_phase3_process_contracts `
              tests.testing.workbook05.test_phase3_process_policy `
              tests.testing.workbook05.test_phase3_process_fixtures `
              tests.testing.workbook05.test_phase3_checkpoint `
              tests.testing.workbook05.test_phase3_process_bundle_validation
          if ($LASTEXITCODE -ne 0) {
              throw "Focused C2 Python contracts exited with code $LASTEXITCODE."
          }

          & '.\tests\testing\workbook05\Invoke-Phase3RunModuleTests.Tests.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python'
          if ($LASTEXITCODE -ne 0) {
              throw "C2 PowerShell component tests exited with code $LASTEXITCODE."
          }

      - name: Commit only verified non-workflow C2 source
        shell: powershell
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- `
              'docs/testing/workbook05/phase3-harness-runbook.md' `
              'experiments/granite_turboquant_intel/manifests/templates/workbook05/phase3-checkpoint-template.json' `
              'experiments/granite_turboquant_intel/manifests/templates/workbook05/process-attempt-template.json' `
              'experiments/granite_turboquant_intel/manifests/templates/workbook05/resource-summary-template.json' `
              'experiments/granite_turboquant_intel/schemas/workbook05/phase3-checkpoint.schema.json' `
              'experiments/granite_turboquant_intel/schemas/workbook05/process-attempt.schema.json' `
              'experiments/granite_turboquant_intel/schemas/workbook05/resource-summary.schema.json' `
              'scripts/testing/workbook05/Invoke-Workbook05Phase3HarnessFixture.ps1' `
              'scripts/testing/workbook05/Workbook05.Run.psm1' `
              'scripts/testing/workbook05/phase3/checkpoint.py' `
              'scripts/testing/workbook05/phase3/contracts.py' `
              'scripts/testing/workbook05/phase3/process_bundle_validation.py' `
              'scripts/testing/workbook05/phase3/process_policy.py' `
              'tests/testing/workbook05/fixtures/phase3/process' `
              'tests/testing/workbook05/fixtures/phase3/process-bundles/valid'
          if ($LASTEXITCODE -ne 0) {
              throw "git add exited with code $LASTEXITCODE."
          }

          $stagedWorkflow = @(
              git diff --cached --name-only -- '.github/workflows'
          )
          if ($stagedWorkflow.Count -ne 0) {
              throw "A workflow file was unexpectedly staged: $($stagedWorkflow -join ', ')"
          }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) {
              throw "git diff --cached --check exited with code $LASTEXITCODE."
          }

          if (git diff --cached --quiet) {
              throw 'The reviewed C2 source produced no staged change.'
          }
          git commit -m 'feat(workbook05): materialise C2 process harness source'
          if ($LASTEXITCODE -ne 0) {
              throw "git commit exited with code $LASTEXITCODE."
          }
          git push origin "HEAD:$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) {
              throw "git push exited with code $LASTEXITCODE."
          }
          Write-Host "Materialised C2 source head: $((git rev-parse HEAD).Trim())"
          Write-Host 'WORKBOOK05_C2_NONWORKFLOW_MATERIALISATION_PASS'

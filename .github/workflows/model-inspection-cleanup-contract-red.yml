name: Model Inspection cleanup contract red

on:
  push:
    branches:
      - refactor/model-inspection-cleanup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-inspection-cleanup-contract-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-red:
    name: Prove cleanup contract regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch exact repository commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/tarball/${{ github.sha }}" \
            --output repository.tar.gz
          tar --extract --gzip --file repository.tar.gz --strip-components=1
          rm repository.tar.gz

      - name: Verify .NET SDK
        run: |
          dotnet --version
          dotnet --info

      - name: Restore contract tests
        run: dotnet restore "tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/GraniteEdgeAI.ModelInspection.Contracts.Tests.csproj"

      - name: Run focused workflow contract test
        run: |
          dotnet test "tests/ContractTests/GraniteEdgeAI.ModelInspection.Contracts.Tests/GraniteEdgeAI.ModelInspection.Contracts.Tests.csproj" \
            --configuration Release \
            --no-restore \
            --filter "FullyQualifiedName~BuildWorkflowRunsCompleteContractProjectWithoutCategoryFilter" \
            --minimum-expected-tests 1

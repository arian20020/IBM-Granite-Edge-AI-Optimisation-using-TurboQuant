name: Frontend Worker Bootstrap

on:
  push:
    branches:
      - chore/granite-native-frontend-worker-v2-bootstrap
    paths:
      - AGENTS.md
      - .agents/**
      - .codex/**
      - .frontend-worker/**
      - plugins/granite-native-frontend-worker/**
      - scripts/*GraniteNativeFrontendWorkerV2.ps1
      - scripts/frontend-worker/**
      - tools/GraniteFrontendGuard/**
      - docs/frontend-worker/**
      - docs/superpowers/specs/2026-08-31-granite-native-frontend-worker-v2-design.md
      - docs/superpowers/plans/2026-08-31-granite-native-frontend-worker-v2-bootstrap.md
      - .github/workflows/frontend-worker-bootstrap.yml
  pull_request:
    paths:
      - AGENTS.md
      - .agents/**
      - .codex/**
      - .frontend-worker/**
      - plugins/granite-native-frontend-worker/**
      - scripts/*GraniteNativeFrontendWorkerV2.ps1
      - scripts/frontend-worker/**
      - tools/GraniteFrontendGuard/**
      - docs/frontend-worker/**
      - docs/superpowers/specs/2026-08-31-granite-native-frontend-worker-v2-design.md
      - docs/superpowers/plans/2026-08-31-granite-native-frontend-worker-v2-bootstrap.md
      - .github/workflows/frontend-worker-bootstrap.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out the frontend-worker surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            AGENTS.md
            .agents/
            .codex/
            .frontend-worker/
            .github/workflows/frontend-worker-bootstrap.yml
            plugins/granite-native-frontend-worker/
            scripts/
            tools/GraniteFrontendGuard/
            docs/frontend-worker/
            docs/superpowers/specs/2026-08-31-granite-native-frontend-worker-v2-design.md
            docs/superpowers/plans/2026-08-31-granite-native-frontend-worker-v2-bootstrap.md

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch protected base branch
        shell: pwsh
        run: git fetch --no-tags origin +refs/heads/integration/ucl-cross-route-native-validation-v1:refs/remotes/origin/integration/ucl-cross-route-native-validation-v1

      - name: Parse JSON, YAML, and TOML metadata
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          @'
          import json
          import pathlib
          import tomllib
          import yaml

          root = pathlib.Path('.')
          json_files = [
              root / '.agents/plugins/marketplace.json',
              root / '.frontend-worker/v2/authorization.template.json',
              root / '.frontend-worker/v2/provider-lock.json',
              root / '.frontend-worker/v2/tooling-lock.json',
              root / 'plugins/granite-native-frontend-worker/.codex-plugin/plugin.json',
          ]
          for path in json_files:
              json.loads(path.read_text(encoding='utf-8'))

          yaml_files = list((root / '.frontend-worker/v2').glob('*.yml'))
          yaml_files += list((root / 'plugins/granite-native-frontend-worker/adapters').glob('*.yml'))
          yaml_files += list((root / 'plugins/granite-native-frontend-worker/rules').glob('*.yml'))
          yaml_files += [root / 'plugins/granite-native-frontend-worker/agents/openai.yaml']
          for path in yaml_files:
              yaml.safe_load(path.read_text(encoding='utf-8'))

          toml_files = list((root / '.codex/agents').glob('*.toml'))
          for path in toml_files:
              with path.open('rb') as handle:
                  tomllib.load(handle)

          print(f'Parsed {len(json_files)} JSON, {len(yaml_files)} YAML, and {len(toml_files)} TOML files.')
          '@ | python -

      - name: Run structural, isolation, and guard regression verification
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-GraniteNativeFrontendWorkerV2.ps1 `
            -StructureOnly `
            -BaseRef origin/integration/ucl-cross-route-native-validation-v1

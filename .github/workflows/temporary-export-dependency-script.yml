name: Temporary export dependency script

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-export-dependency-script.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact repair revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Upload the exact PowerShell source as text
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: temporary-dependency-script-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/testing/workbook05/Invoke-Workbook05Phase3DependencyPreflightLive.ps1
          if-no-files-found: error
          retention-days: 1

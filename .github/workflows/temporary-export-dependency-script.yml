name: Temporary patch dependency stdout reader

on:
  push:
    branches:
      - fix/workbook-05-dependency-empty-stdout
    paths:
      - '.github/workflows/temporary-export-dependency-script.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out only the exact PowerShell source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: fix/workbook-05-dependency-empty-stdout
          fetch-depth: 1
          sparse-checkout: |
            scripts/testing/workbook05/Invoke-Workbook05Phase3DependencyPreflightLive.ps1
          sparse-checkout-cone-mode: false

      - name: Apply the one reviewed replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/testing/workbook05/Invoke-Workbook05Phase3DependencyPreflightLive.ps1')
          text = path.read_text(encoding='utf-8')
          old = """function Read-PreflightStdout {
              param([Parameter(Mandatory = $true)][object]$Result)

              return (
                  Get-Content -LiteralPath $Result.stdout_path -Raw -Encoding UTF8
              ).Trim()
          }
          """
          new = """function Read-PreflightStdout {
              param([Parameter(Mandatory = $true)][object]$Result)

              # Windows PowerShell 5.1 returns no object for a readable zero-byte file.
              # Preserve that legitimate command result as an empty string, while
              # retaining -ErrorAction Stop so a missing or unreadable evidence file
              # still fails at the first causal boundary.
              $capturedOutput = Get-Content `
                  -LiteralPath $Result.stdout_path `
                  -Raw `
                  -Encoding UTF8 `
                  -ErrorAction Stop
              if ($null -eq $capturedOutput) {
                  return ''
              }
              return $capturedOutput.Trim()
          }
          """

          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          elif count == 0 and new in text:
              print('The reviewed replacement is already present.')
          else:
              raise SystemExit(f'Expected one old block or one new block; old count={count}.')
          PY
          git diff --check

      - name: Commit the production repair when needed
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/testing/workbook05/Invoke-Workbook05Phase3DependencyPreflightLive.ps1
          if git diff --cached --quiet; then
            echo 'No production change remains to commit.'
            exit 0
          fi
          git config user.name 'Workbook 05 maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(workbook05): preserve empty dependency stdout'
          git push origin HEAD:fix/workbook-05-dependency-empty-stdout

name: Task 7 inventory sync temporary

on:
  push:
    branches:
      - refactor/model-inspection-cleanup

permissions:
  contents: write

jobs:
  sync-inventory:
    runs-on: windows-latest

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          sparse-checkout: |
            .github
            docs
            IBM Granite with TurboQuant (Intel)
            infrastructure
            scripts
            shared
            tests
            tools
            workers

      - name: Register the Task 7 test in the permanent cleanup inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $sourcePath = 'docs/reviews/model-inspection-cleanup-source-files.txt'
          $inventoryPath = 'docs/reviews/model-inspection-cleanup-inventory.md'
          $testPath = 'tests/UnitTests/GraniteEdgeAI.UnitTests/Features/ModelInspection/Controls/InspectionVisualStateGuardTests.cs'
          $selectorPath = 'tests/UnitTests/GraniteEdgeAI.UnitTests/Features/ModelInspection/Controls/InspectionContentTemplateSelectorTests.cs'

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          $sourceText = [System.IO.File]::ReadAllText($sourcePath)
          $sourceNewline = if ($sourceText.Contains("`r`n")) { "`r`n" } else { "`n" }

          if (-not $sourceText.Contains($testPath)) {
              $sourceAnchor = $selectorPath + $sourceNewline
              if (-not $sourceText.Contains($sourceAnchor)) {
                  throw 'Could not find the ordinal source-list insertion anchor'
              }

              $sourceText = $sourceText.Replace(
                  $sourceAnchor,
                  $selectorPath + $sourceNewline + $testPath + $sourceNewline)
              [System.IO.File]::WriteAllText($sourcePath, $sourceText, $utf8NoBom)
          }

          $inventoryText = [System.IO.File]::ReadAllText($inventoryPath)
          $inventoryNewline = if ($inventoryText.Contains("`r`n")) { "`r`n" } else { "`n" }
          $inventoryAnchor = '| `' + $selectorPath + '` | unit tests | serve the recorded subsystem boundary | medium | pending review | not reviewed | none | baseline behaviour | to be mapped during subsystem audit | baseline pending | none |'
          $inventoryRow = '| `' + $testPath + '` | Model Inspection WinUI tests | prove required visual-state names fail clearly when XAML and code-behind drift apart | medium | reviewed | ModelCard and OutcomeCard do not currently fail when required XAML states are missing | adds red characterization and regression coverage | visual-state names and normal rendering behaviour | three WinUI visual-state guard tests | Phase 1 Task 7 red-green verification | none |'

          if (-not $inventoryText.Contains('`' + $testPath + '`')) {
              $inventoryAnchorWithNewline = $inventoryAnchor + $inventoryNewline
              if (-not $inventoryText.Contains($inventoryAnchorWithNewline)) {
                  throw 'Could not find the ordinal inventory insertion anchor'
              }

              $inventoryText = $inventoryText.Replace(
                  $inventoryAnchorWithNewline,
                  $inventoryAnchor + $inventoryNewline + $inventoryRow + $inventoryNewline)
              [System.IO.File]::WriteAllText($inventoryPath, $inventoryText, $utf8NoBom)
          }

      - name: Verify cleanup inventory contracts
        shell: pwsh
        run: |
          ./scripts/model-inspection/Verify-ModelInspectionCleanupInventory.ps1

      - name: Commit the permanent bookkeeping and remove this temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- 'docs/reviews/model-inspection-cleanup-source-files.txt'
          git add -- 'docs/reviews/model-inspection-cleanup-inventory.md'
          git rm -- '.github/workflows/task7-inventory-sync-temp.yml'

          git diff --cached --check

          $changed = @(git diff --cached --name-only | Sort-Object)
          $expected = @(
              '.github/workflows/task7-inventory-sync-temp.yml',
              'docs/reviews/model-inspection-cleanup-inventory.md',
              'docs/reviews/model-inspection-cleanup-source-files.txt'
          ) | Sort-Object

          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $changed)
          if ($difference.Count -ne 0) {
              throw "Unexpected staged files:`n$($difference | Out-String)"
          }

          git commit -m 'chore(model-inspection): register Task 7 visual-state tests'
          git push origin HEAD:refactor/model-inspection-cleanup

name: Model Inspection WorkerClient domain tests

# Run the process-independent WorkerClient domain suite whenever its contracts,
# implementation, tests, or this workflow changes. The wider Windows workflow
# still protects the complete Gate 2 project graph and WinUI regressions.
on:
  push:
    paths:
      - 'infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient/**'
      - 'shared/GraniteEdgeAI.ModelInspection.Contracts/**'
      - 'tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests/**'
      - '.github/workflows/model-inspection-worker-client-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient/**'
      - 'shared/GraniteEdgeAI.ModelInspection.Contracts/**'
      - 'tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests/**'
      - '.github/workflows/model-inspection-worker-client-tests.yml'
  workflow_dispatch:

# The validation job only needs to read the checked-out source.
permissions:
  contents: read

# Cancel obsolete executions when a newer commit supersedes the same branch.
concurrency:
  group: model-inspection-worker-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-client-domain-tests:
    name: Run WorkerClient execution-domain tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      # Pinned immutable commit for actions/checkout v7.0.0.
      - name: Check out WorkerClient domain
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          sparse-checkout: |
            infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient
            shared/GraniteEdgeAI.ModelInspection.Contracts
            shared/GraniteEdgeAI.ModelInspection.Transport
            tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests

      # Pinned immutable commit for actions/setup-dotnet v5.0.0. Cone-mode
      # sparse checkout retains the root-level global.json SDK selection.
      - name: Set up repository .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json

      # Record the selected SDK and runtime identifier for reproducibility.
      - name: Display selected SDK
        run: dotnet --info

      # Microsoft.Testing.Platform exits non-zero for compilation failures,
      # failing tests, or fewer tests than the complete Task 3 behaviour set.
      - name: Run WorkerClient domain behaviour tests
        run: >-
          dotnet test
          tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~WorkerClientDomainTests"
          --minimum-expected-tests 13
          -p:Platform=x64

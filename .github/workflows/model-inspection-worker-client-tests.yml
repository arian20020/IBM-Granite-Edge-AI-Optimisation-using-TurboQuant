name: Model Inspection WorkerClient tests

# Run the WorkerClient domain, trust-policy and native-primitive suites whenever
# their contracts, implementation, tests, or this workflow changes. The wider
# Windows workflow still protects the complete Gate 2 graph and WinUI tests.
on:
  push:
    paths:
      - 'infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient/**'
      - 'shared/GraniteEdgeAI.ModelInspection.Contracts/**'
      - 'tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests/**'
      - '.github/workflows/model-inspection-worker-client-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient/**'
      - 'shared/GraniteEdgeAI.ModelInspection.Contracts/**'
      - 'tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests/**'
      - '.github/workflows/model-inspection-worker-client-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-inspection-worker-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh
    working-directory: D:\s

jobs:
  worker-client-tests:
    name: Run WorkerClient domain, policy and native tests
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Check out WorkerClient boundary
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          sparse-checkout: |
            infrastructure/GraniteEdgeAI.ModelInspection.WorkerClient
            shared/GraniteEdgeAI.ModelInspection.Contracts
            shared/GraniteEdgeAI.ModelInspection.Transport
            tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests

      - name: Stage WorkerClient inputs at a short path
        working-directory: ${{ github.workspace }}
        run: |
          $buildRoot = 'D:\s'
          if (Test-Path -LiteralPath $buildRoot) {
            Remove-Item -LiteralPath $buildRoot -Recurse -Force
          }

          robocopy $env:GITHUB_WORKSPACE $buildRoot /E /XD .git
          if ($LASTEXITCODE -ge 8) {
            throw "Failed to stage WorkerClient inputs at $buildRoot."
          }
          $global:LASTEXITCODE = 0

          if (-not (Test-Path (Join-Path $buildRoot 'global.json'))) {
            throw "The staged checkout is incomplete: global.json was not found."
          }

      - name: Set up repository .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: D:/s/global.json

      - name: Display selected SDK
        run: dotnet --info

      # The explicit filter and minimum count prevent unrelated future tests
      # from satisfying this security-boundary workflow.
      - name: Run WorkerClient native-boundary behaviour tests
        run: |
          $ErrorActionPreference = 'Stop'
          $resultsDirectory = 'TestResults/WorkerClient'
          New-Item -ItemType Directory -Force -Path $resultsDirectory | Out-Null
          dotnet test --project tests/UnitTests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests/GraniteEdgeAI.ModelInspection.WorkerClient.Tests.csproj `
            --configuration Release `
            --filter "FullyQualifiedName~WorkerClientDomainTests|FullyQualifiedName~WorkerExecutableResolverTests|FullyQualifiedName~WorkerInstallationLayoutTests|FullyQualifiedName~WorkerEnvironmentPolicyTests|FullyQualifiedName~WindowsEnvironmentBlockTests|FullyQualifiedName~WorkerPolicyDiagnosticPrivacyTests|FullyQualifiedName~NativeLayoutTests|FullyQualifiedName~WindowsPipeSetTests|FullyQualifiedName~WindowsJobObjectTests|FullyQualifiedName~SafeAttributeListBufferTests|FullyQualifiedName~WindowsProcessWaiterTests|FullyQualifiedName~WindowsWorkerProcessLauncherFailureTests|FullyQualifiedName~WorkerHandshakeValidatorTests|FullyQualifiedName~WorkerExitConsistencyValidatorTests|FullyQualifiedName~WorkerFailureAccumulatorTests|FullyQualifiedName~BoundedStandardErrorCollectorTests|FullyQualifiedName~WorkerConversationTests" `
            --minimum-expected-tests 91 `
            --results-directory $resultsDirectory `
            --report-trx `
            --report-trx-filename 'worker-client.trx' `
            -p:Platform=x64
          if ($LASTEXITCODE -ne 0) {
            throw "WorkerClient tests failed: $LASTEXITCODE"
          }

      - name: Verify fixed worker installation tests
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$trx = Get-Content -LiteralPath 'TestResults/WorkerClient/worker-client.trx' -Raw
          $definitions = @($trx.TestRun.TestDefinitions.UnitTest)
          $results = @($trx.TestRun.Results.UnitTestResult)
          $requiredClass = 'GraniteEdgeAI.ModelInspection.WorkerClient.Tests.WorkerInstallationLayoutTests'
          $required = @($definitions | Where-Object { $_.TestMethod.className -eq $requiredClass })
          if ($required.Count -ne 5) {
            throw "Expected exactly five fixed-layout tests, found $($required.Count)."
          }
          foreach ($definition in $required) {
            $matching = @($results | Where-Object { $_.testId -eq $definition.id -and $_.outcome -eq 'Passed' })
            if ($matching.Count -ne 1) {
              throw "A fixed-layout test did not pass exactly once: $($definition.name)"
            }
          }

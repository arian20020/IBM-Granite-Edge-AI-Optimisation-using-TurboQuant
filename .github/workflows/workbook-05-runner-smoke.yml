name: Workbook 05 implementation carrier

on:
  pull_request:
    branches:
      - automation/wb05-implementation-base
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: workbook-05-implementation-carrier
  cancel-in-progress: false

jobs:
  implement-plan:
    name: Execute the approved ten-task preflight plan
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/wb05-implementation-trigger'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # Check out the actual implementation branch rather than the temporary
      # trigger pull request. The hosted runner is an isolated workspace.
      - name: Check out the implementation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: testing/workbook-05-two-route-memory-frontier
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python 3.12
        uses: actions/setup-python@bfe8cc55a7890e3d6672eda6460ef37bfcc70755
        with:
          python-version: '3.12'

      # Several controlled tests intentionally reference the exact Python path
      # used by the Intel runner. The junction preserves that contract here.
      - name: Expose the controlled Python path
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Split-Path (Get-Command python).Source -Parent
          $destination = 'C:\Program Files\Python312'
          if (-not (Test-Path -LiteralPath $destination)) {
              New-Item -ItemType Junction -Path $destination -Target $source | Out-Null
          }
          & (Join-Path $destination 'python.exe') --version

      # Reconstruct the reviewed implementation program from its temporary,
      # compressed repository parts. The program commits each test-first task
      # independently, so a failure is resumable rather than destructive.
      - name: Reconstruct the implementation worker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
              'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part00',
              'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part01',
              'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part02',
              'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part03'
          )
          $encoded = ($parts | ForEach-Object { Get-Content -Raw -LiteralPath $_ }) -join ''
          $gzipPath = Join-Path $env:RUNNER_TEMP 'wb05-apply.py.gz'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'wb05-apply.py'
          [System.IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip, pathlib; pathlib.Path(r'$scriptPath').write_bytes(gzip.open(r'$gzipPath', 'rb').read())"
          python -m py_compile $scriptPath
          "WB05_IMPLEMENTATION_SCRIPT=$scriptPath" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Execute the ten test-first tasks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python $env:WB05_IMPLEMENTATION_SCRIPT
          if ($LASTEXITCODE -ne 0) {
              throw "Workbook 05 implementation worker failed with code $LASTEXITCODE."
          }

      # Restore the permanent read-only smoke workflow and remove every
      # temporary implementation file before the final feature branch review.
      - name: Remove the temporary implementation carrier
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Workbook 05 automation worker'
          git config user.email 'workbook05-actions@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- '.github/workflows/workbook-05-runner-smoke.yml'
          git rm -f -- `
            '.github/workflows/wb05-implementation-bootstrap.yml' `
            'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part00' `
            'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part01' `
            'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part02' `
            'scripts/testing/workbook05/_bootstrap_apply_plan.py.gz.b64.part03'
          git commit -m 'chore(workbook-05): remove temporary implementation worker'
          git push origin HEAD:testing/workbook-05-two-route-memory-frontier

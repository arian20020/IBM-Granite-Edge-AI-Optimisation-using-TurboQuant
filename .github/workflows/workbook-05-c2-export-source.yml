name: Workbook 05 C2 reviewed source export

on:
  pull_request:
    branches:
      - main
      - fix/workbook-05-c1-controlled-source-resume
    paths:
      - '.github/workflows/workbook-05-c2-export-source.yml'
      - '.bootstrap-c2/workbook05-c2-source.b64.part-*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workbook-05-c2-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-reviewed-c2-source:
    name: Export reviewed and minimally repaired C2 source
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact reviewed payload
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .bootstrap-c2

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Verify, extract and repair the reviewed C2 source
        id: export
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
              Get-ChildItem `
                  -LiteralPath '.\.bootstrap-c2' `
                  -Filter 'workbook05-c2-source.b64.part-*' `
                  -File |
                  Sort-Object Name
          )
          if ($parts.Count -ne 6) {
              throw "Expected exactly six C2 payload parts; found $($parts.Count)."
          }

          $encoded = [string]::Concat(@(
              $parts | ForEach-Object {
                  Get-Content -LiteralPath $_.FullName -Raw -Encoding utf8
              }
          ))
          $archivePath = Join-Path $env:RUNNER_TEMP 'workbook05-c2-source.tar.gz'
          [IO.File]::WriteAllBytes(
              $archivePath,
              [Convert]::FromBase64String($encoded)
          )

          $expectedDigest = '86d65d644cd2d6e3e69dbc324c0d11895ae4139e060648e552baccb796806e72'
          $actualDigest = (
              Get-FileHash -LiteralPath $archivePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualDigest -cne $expectedDigest) {
              throw "C2 payload digest mismatch. Expected $expectedDigest; observed $actualDigest."
          }

          $exportRoot = Join-Path $env:RUNNER_TEMP 'workbook-05-c2-reviewed-source'
          if (Test-Path -LiteralPath $exportRoot) {
              throw "Export root already exists: $exportRoot"
          }
          New-Item -ItemType Directory -Path $exportRoot -Force:$false | Out-Null
          python -c "import pathlib,sys,tarfile; tarfile.open(sys.argv[1], 'r:gz').extractall(pathlib.Path(sys.argv[2]), filter='data')" `
              $archivePath `
              $exportRoot
          if ($LASTEXITCODE -ne 0) {
              throw "C2 payload extraction exited with code $LASTEXITCODE."
          }

          # The first complete Windows gate exposed one precise production
          # contract defect: a healthy cooldown observation legitimately has no
          # remaining descendants, but PowerShell rejects an empty mandatory
          # array without AllowEmptyCollection. Apply only that reviewed repair.
          $modulePath = Join-Path `
              $exportRoot `
              'scripts\testing\workbook05\Workbook05.Run.psm1'
          if (-not (Test-Path -LiteralPath $modulePath -PathType Leaf)) {
              throw "Extracted C2 module is missing: $modulePath"
          }
          $moduleText = Get-Content -LiteralPath $modulePath -Raw -Encoding utf8
          if ($moduleText -notmatch '\[AllowEmptyCollection\(\)\]') {
              $pattern = '(?m)^(?<indent>\s*)\[Parameter\(Mandatory\)\]\[int\[\]\]\s*\$RemainingProcessIds,'
              $matches = [regex]::Matches($moduleText, $pattern)
              if ($matches.Count -ne 1) {
                  throw "Expected exactly one mandatory RemainingProcessIds declaration; found $($matches.Count)."
              }
              $moduleText = [regex]::Replace(
                  $moduleText,
                  $pattern,
                  '${indent}[Parameter(Mandatory)]' + "`n" +
                  '${indent}[AllowEmptyCollection()]' + "`n" +
                  '${indent}[int[]] $RemainingProcessIds,',
                  1
              )
              [IO.File]::WriteAllText(
                  $modulePath,
                  $moduleText,
                  [Text.UTF8Encoding]::new($false)
              )
          }
          $repairedText = Get-Content -LiteralPath $modulePath -Raw -Encoding utf8
          if (
              $repairedText -notmatch '(?s)\[Parameter\(Mandatory\)\]\s*\[AllowEmptyCollection\(\)\]\s*\[int\[\]\]\s*\$RemainingProcessIds,'
          ) {
              throw 'The exact empty-descendant cooldown repair was not materialised.'
          }

          Get-ChildItem `
              -LiteralPath $exportRoot `
              -Directory `
              -Filter '__pycache__' `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          Get-ChildItem `
              -LiteralPath $exportRoot `
              -File `
              -Filter '*.pyc' `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Remove-Item -Force

          $manifestPath = Join-Path $exportRoot 'export-manifest.sha256'
          $manifestLines = @(
              Get-ChildItem -LiteralPath $exportRoot -File -Recurse |
              Where-Object { $_.FullName -ne $manifestPath } |
              Sort-Object FullName |
              ForEach-Object {
                  $relative = $_.FullName.Substring($exportRoot.Length + 1).Replace('\', '/')
                  $digest = (
                      Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
                  ).Hash.ToLowerInvariant()
                  "$digest  $relative"
              }
          )
          [IO.File]::WriteAllLines(
              $manifestPath,
              $manifestLines,
              [Text.UTF8Encoding]::new($false)
          )
          Write-Host "Exported C2 source files: $($manifestLines.Count)"
          Write-Host 'WORKBOOK05_C2_SOURCE_EXPORT_PASS'

      - name: Upload exact reviewed source export
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-c2-reviewed-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-c2-reviewed-source
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

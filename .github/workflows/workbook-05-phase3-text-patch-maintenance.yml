name: Workbook 05 Phase 3 text patch maintenance

on:
  push:
    branches:
      - design/workbook-05-phase3-dependency-preflight
    paths:
      - '.github/maintenance/workbook05-phase3-next-patch.txt'

# This temporary same-repository maintenance workflow exists only to apply a
# reviewed text patch whose complete bytes and expected base commit are checked
# before use. It is removed before the implementation head is offered for merge.
permissions:
  contents: write

concurrency:
  group: workbook-05-phase3-text-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-reviewed-text-patch:
    if: >-
      github.repository == 'arian20020/IBM-Granite-Edge-AI-Optimisation-using-TurboQuant' &&
      github.ref == 'refs/heads/design/workbook-05-phase3-dependency-preflight' &&
      github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      # The job must apply the patch to the exact revision named inside the
      # patch envelope. Retained credentials are limited to this temporary,
      # branch-scoped maintenance commit and are removed with the workflow.
      - name: Check out the exact patch-envelope revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Python 3.12.10 for repository checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Validate, apply, verify, commit, and push the reviewed text patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # Read a closed five-line metadata envelope followed by one base64
          # payload line. Arbitrary commands are never accepted from the file.
          $envelopePath = '.github/maintenance/workbook05-phase3-next-patch.txt'
          $lines = @([IO.File]::ReadAllLines($envelopePath))
          if ($lines.Count -ne 6) {
              throw 'The text-patch envelope must contain exactly six lines.'
          }
          $metadata = @{}
          foreach ($line in $lines[0..4]) {
              $parts = $line.Split('=', 2)
              if ($parts.Count -ne 2 -or $metadata.ContainsKey($parts[0])) {
                  throw "Malformed or duplicate patch metadata: $line"
              }
              $metadata[$parts[0]] = $parts[1]
          }
          $requiredKeys = @(
              'schema_version',
              'expected_parent',
              'commit_message_base64',
              'patch_sha256',
              'verification_mode'
          )
          if (@($metadata.Keys | Sort-Object) -join ',' -ne @($requiredKeys | Sort-Object) -join ',') {
              throw 'The patch metadata keys do not match the closed contract.'
          }
          if ($metadata.schema_version -ne '1.0') {
              throw 'Unsupported text-patch envelope schema.'
          }

          # The envelope commit is expected to be the one child of the approved
          # parent because adding the envelope itself triggers this job.
          $actualEnvelope = (git rev-parse HEAD).Trim()
          $actualParent = (git rev-parse HEAD^).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualParent -ne $metadata.expected_parent) {
              throw "Patch parent mismatch. Expected $($metadata.expected_parent), found $actualParent."
          }

          # Decode the compressed unified diff and verify its complete bytes
          # before asking Git to inspect or apply it.
          $compressedPath = Join-Path $env:RUNNER_TEMP 'wb05-phase3.patch.gz'
          $patchPath = Join-Path $env:RUNNER_TEMP 'wb05-phase3.patch'
          [IO.File]::WriteAllBytes(
              $compressedPath,
              [Convert]::FromBase64String($lines[5])
          )
          $input = [IO.File]::OpenRead($compressedPath)
          try {
              $gzip = [IO.Compression.GZipStream]::new(
                  $input,
                  [IO.Compression.CompressionMode]::Decompress
              )
              try {
                  $output = [IO.File]::Create($patchPath)
                  try { $gzip.CopyTo($output) } finally { $output.Dispose() }
              }
              finally { $gzip.Dispose() }
          }
          finally { $input.Dispose() }
          $actualPatchSha256 = (
              Get-FileHash -LiteralPath $patchPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualPatchSha256 -ne $metadata.patch_sha256) {
              throw "Patch SHA-256 mismatch: $actualPatchSha256"
          }

          # Reject binary patches and changes outside the reviewed repository
          # control surfaces before applying anything.
          $patchText = [IO.File]::ReadAllText($patchPath)
          if ($patchText -match 'GIT binary patch|Binary files .* differ') {
              throw 'Binary patches are forbidden.'
          }
          $paths = @(
              [regex]::Matches($patchText, '(?m)^\+\+\+ b/(.+)$') |
                  ForEach-Object { $_.Groups[1].Value } |
                  Where-Object { $_ -ne '/dev/null' } |
                  Sort-Object -Unique
          )
          if ($paths.Count -eq 0) {
              throw 'The patch contains no added or modified text path.'
          }
          foreach ($path in $paths) {
              if (
                  $path -notmatch '^(docs/|scripts/testing/|tests/testing/|experiments/granite_turboquant_intel/|\.github/workflows/workbook-05-phase3-dependency-preflight\.yml$)' -or
                  $path -match '(^|/)(models?|tokenizers?|converted|outputs?)(/|$)' -or
                  $path -match '\.(exe|dll|lib|pdb|whl|zip|tar|gz|7z|gguf|onnx|bin|safetensors)$'
              ) {
                  throw "Patch path is outside the approved text boundary: $path"
              }
          }

          git apply --check --whitespace=error-all $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'git apply --check failed.' }
          git apply --whitespace=error-all $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'git apply failed.' }
          Remove-Item -LiteralPath $envelopePath -Force

          # Verification mode is a closed enum implemented here rather than an
          # executable command supplied by the patch envelope.
          switch ($metadata.verification_mode) {
              'docs' {
                  git diff --check
                  if ($LASTEXITCODE -ne 0) { throw 'Documentation diff check failed.' }
              }
              'red-bootstrap' {
                  $outputText = ((
                      python -m unittest -v `
                          tests.testing.workbook05.test_phase3_dependency_lock `
                          tests.testing.workbook05.test_phase3_dependency_lock_cli `
                          tests.testing.workbook05.test_phase3_dependency_preflight 2>&1
                  ) | Out-String)
                  if ($LASTEXITCODE -eq 0) {
                      throw 'The RED bootstrap tests unexpectedly passed.'
                  }
                  if (
                      $outputText -notmatch 'requirements\.phase3-bootstrap' -or
                      $outputText -notmatch 'pip-tools==7\.6\.0'
                  ) {
                      throw "RED failed for an unexpected reason.`n$outputText"
                  }
                  Write-Host $outputText
              }
              'green-bootstrap' {
                  python -m unittest -v `
                      tests.testing.workbook05.test_phase3_dependency_lock `
                      tests.testing.workbook05.test_phase3_dependency_lock_cli `
                      tests.testing.workbook05.test_phase3_dependency_preflight `
                      tests.testing.workbook05.test_phase3_dependency_bundle_validation `
                      tests.testing.workbook05.test_phase3_conversion `
                      tests.testing.workbook05.test_phase3_asset_bundle_validation
                  if ($LASTEXITCODE -ne 0) { throw 'Focused GREEN tests failed.' }
                  git diff --check
                  if ($LASTEXITCODE -ne 0) { throw 'GREEN diff check failed.' }
              }
              default {
                  throw "Unsupported verification mode: $($metadata.verification_mode)"
              }
          }

          # Decode a UTF-8 commit message only after the fixed verification mode
          # succeeds, then make one auditable commit and push it to this branch.
          $commitMessage = [Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String($metadata.commit_message_base64)
          )
          if ([string]::IsNullOrWhiteSpace($commitMessage)) {
              throw 'The decoded commit message is empty.'
          }
          git config user.name 'arian20020'
          git config user.email 'arian20020@outlook.com'
          git add --all
          git commit -m $commitMessage
          if ($LASTEXITCODE -ne 0) { throw 'Patch commit failed.' }
          git push origin "HEAD:$($env:GITHUB_REF_NAME)"
          if ($LASTEXITCODE -ne 0) { throw 'Patch push failed.' }

name: Workbook 05 post-C workbook final materialisation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/workbook-05-post-c-bootstrap-final.yml'
  workflow_dispatch:

# Final one-time hosted materialisation. It restores the reviewed payload,
# applies the proven Windows PowerShell 5.1 path compatibility boundary,
# generates and verifies the complete pack, commits it to the PR branch, and
# deletes every bootstrap input and workflow. It never reaches a self-hosted
# runner and cannot download or execute a model.
permissions:
  contents: write
  actions: read

concurrency:
  group: workbook-05-post-c-bootstrap-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialise-final-pack:
    name: Materialise and validate the final workbook pack
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      generated_sha: ${{ steps.commit-pack.outputs.generated_sha }}

    steps:
      - name: Check out the exact final-bootstrap revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            .bootstrap
            .github/workflows
            docs/superpowers/plans
            docs/testing
            scripts/testing
            tests/testing/workbook05

      - name: Set up Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Restore and verify the reviewed source payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
              Get-ChildItem `
                  -LiteralPath '.\.bootstrap' `
                  -Filter 'workbook05-post-c-source.b64.part-*' `
                  -File |
                  Sort-Object Name
          )
          if ($parts.Count -ne 3) {
              throw "Expected exactly three source-payload parts; found $($parts.Count)."
          }

          $encoded = [string]::Concat(@(
              $parts | ForEach-Object {
                  Get-Content -LiteralPath $_.FullName -Raw -Encoding utf8
              }
          ))
          $archivePath = Join-Path $env:RUNNER_TEMP 'workbook05-post-c-source.tar.gz'
          [IO.File]::WriteAllBytes(
              $archivePath,
              [Convert]::FromBase64String($encoded)
          )

          $expectedDigest = 'fa2bfe925a95fcf9849941bad568cbd5638eb71a58d9fc6aafa621928c48bc0e'
          $actualDigest = (
              Get-FileHash -LiteralPath $archivePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualDigest -cne $expectedDigest) {
              throw "Payload digest mismatch. Expected $expectedDigest; observed $actualDigest."
          }

          python -c "import pathlib,sys,tarfile; tarfile.open(sys.argv[1], 'r:gz').extractall(pathlib.Path(sys.argv[2]), filter='data')" `
              $archivePath `
              $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
              throw "Source-payload extraction exited with code $LASTEXITCODE."
          }

      - name: Apply the verified Windows PowerShell relative-path boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $validatorPath = '.\scripts\testing\Validate-Workbook05-PostC-Workbooks.ps1'
          $text = [IO.File]::ReadAllText($validatorPath)
          $needle = '[IO.Path]::GetRelativePath'
          $anchor = 'Set-StrictMode -Version Latest'
          if (-not $text.Contains($needle) -or -not $text.Contains($anchor)) {
              throw 'The expected relative-path compatibility boundary was not found.'
          }

          $helper = @'

          # Windows PowerShell 5.1 uses .NET Framework and therefore lacks
          # System.IO.Path.GetRelativePath. Preserve canonical relative-path
          # behaviour through a URI-based compatibility helper.
          if (-not ('Wb05PathCompat' -as [type])) {
              Add-Type -TypeDefinition @"
          using System;
          using System.IO;

          public static class Wb05PathCompat
          {
              public static string GetRelativePath(string relativeTo, string path)
              {
                  string basePath = Path.GetFullPath(relativeTo);
                  if (!basePath.EndsWith(Path.DirectorySeparatorChar.ToString(), StringComparison.Ordinal))
                  {
                      basePath += Path.DirectorySeparatorChar;
                  }
                  Uri baseUri = new Uri(basePath, UriKind.Absolute);
                  Uri targetUri = new Uri(Path.GetFullPath(path), UriKind.Absolute);
                  string value = Uri.UnescapeDataString(
                      baseUri.MakeRelativeUri(targetUri).ToString()
                  );
                  return value.Replace('/', Path.DirectorySeparatorChar);
              }
          }
          "@
          }
          '@

          $repaired = $text.Replace(
              $needle,
              '[Wb05PathCompat]::GetRelativePath'
          )
          $repaired = $repaired.Replace(
              $anchor,
              $anchor + $helper
          )
          [IO.File]::WriteAllText(
              $validatorPath,
              $repaired,
              [Text.UTF8Encoding]::new($false)
          )

      - name: Install the pinned workbook toolchain
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\requirements.txt'

      - name: Generate all canonical and DOCX workbooks
        shell: powershell
        run: >-
          python '.\scripts\testing\workbook05\bootstrap_post_c_workbooks.py'
          --repository-root $env:GITHUB_WORKSPACE

      - name: Run the complete post-C workbook gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDirectory = Join-Path `
              $env:RUNNER_TEMP `
              'workbook-05-post-c-pack'
          & '.\scripts\testing\Validate-Workbook05-PostC-Workbooks.ps1' `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -PythonPath 'python' `
              -ArtifactDirectory $artifactDirectory

      - name: Verify repository patch integrity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) {
              throw "git diff --check exited with code $LASTEXITCODE."
          }

      - name: Remove all one-time post-C bootstrap material
        shell: powershell
        run: |
          Remove-Item -LiteralPath '.\.bootstrap' -Recurse -Force
          foreach ($path in @(
              '.\.github\workflows\workbook-05-post-c-bootstrap.yml',
              '.\.github\workflows\workbook-05-post-c-bootstrap-repair.yml',
              '.\.github\workflows\workbook-05-post-c-bootstrap-final.yml'
          )) {
              if (Test-Path -LiteralPath $path -PathType Leaf) {
                  Remove-Item -LiteralPath $path -Force
              }
          }

      - name: Commit the validated workbook pack to the PR branch
        id: commit-pack
        shell: powershell
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (-not (git diff --cached --quiet)) {
              git commit -m 'chore(workbook05): materialise post-C workbook pack'
              if ($LASTEXITCODE -ne 0) {
                  throw "git commit exited with code $LASTEXITCODE."
              }
              git push origin "HEAD:$env:TARGET_BRANCH"
              if ($LASTEXITCODE -ne 0) {
                  throw "git push exited with code $LASTEXITCODE."
              }
          }

          $generatedSha = (git rev-parse HEAD).Trim()
          "generated_sha=$generatedSha" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append
          Write-Host "Generated workbook-pack head: $generatedSha"

      - name: Upload the exact generated pack and reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbook-05-post-c-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-post-c-pack
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  independently-validate-final-pack:
    name: Independently validate the final pack
    needs: materialise-final-pack
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact generated workbook revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ needs.materialise-final-pack.outputs.generated_sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/superpowers/plans
            docs/testing
            scripts/testing
            tests/testing/workbook05

      - name: Set up independent Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Install the pinned validation toolchain
        shell: powershell
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r '.\scripts\testing\requirements.txt'

      - name: Download the exact same-attempt artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: workbook-05-post-c-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\workbook-05-post-c-pack

      - name: Re-run contracts and validate the artifact as untrusted data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest -v `
              tests.testing.workbook05.test_post_c_workbook_pack
          if ($LASTEXITCODE -ne 0) {
              throw "Focused contract run exited with code $LASTEXITCODE."
          }

          $artifactRoot = Join-Path `
              $env:RUNNER_TEMP `
              'workbook-05-post-c-pack'
          $report = Join-Path `
              $env:RUNNER_TEMP `
              'independent-post-c-workbook-validation.json'
          python -m scripts.testing.workbook05.post_c_workbook_pack `
              --repository-root $env:GITHUB_WORKSPACE `
              --artifact-root $artifactRoot `
              --report $report
          if ($LASTEXITCODE -ne 0) {
              throw "Independent artifact validation exited with code $LASTEXITCODE."
          }
          Write-Host 'WORKBOOK05_POST_C_FINAL_INDEPENDENT_PASS'

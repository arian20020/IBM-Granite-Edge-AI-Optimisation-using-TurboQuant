name: Phase 1 Task 6 xBind warning cleanup

on:
  push:
    branches:
      - refactor/model-inspection-cleanup
    paths:
      - '.github/workflows/phase1-task6-xbind-warning.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1-task6-xbind-warning-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh
    working-directory: D:\s

env:
  APP_PROJECT: 'IBM Granite with TurboQuant (Intel)/IBM Granite with TurboQuant (Intel).csproj'
  TEST_PROJECT: 'tests/UnitTests/GraniteEdgeAI.UnitTests/GraniteEdgeAI.UnitTests.csproj'
  TEST_RECIPE: 'tests/UnitTests/GraniteEdgeAI.UnitTests/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/GraniteEdgeAI.UnitTests.build.appxrecipe'

jobs:
  clean-warning-bindings:
    name: Clean compiler-reported WMC1506 bindings
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out required build inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          sparse-checkout: |
            .github
            docs
            IBM Granite with TurboQuant (Intel)
            infrastructure
            scripts
            shared
            tests
            tools
            workers

      - name: Stage build inputs at a short path
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = 'D:\s'
          robocopy $env:GITHUB_WORKSPACE $buildRoot /E /XD .git
          if ($LASTEXITCODE -ge 8) {
            throw "Failed to stage build inputs at $buildRoot"
          }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path (Join-Path $buildRoot 'global.json'))) {
            throw 'The staged checkout is incomplete: global.json was not found'
          }

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: D:/s/global.json

      - name: Add x64 MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
        with:
          msbuild-architecture: x64

      - name: Restore WinUI application
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild "$env:APP_PROJECT" `
            /target:Restore `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64
          if ($LASTEXITCODE -ne 0) {
            throw "WinUI restore failed with exit code $LASTEXITCODE"
          }

      - name: Capture exact warning locations
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:RUNNER_TEMP 'phase1-winui-build-before.log'

          msbuild "$env:APP_PROJECT" `
            /target:Build `
            /maxCpuCount `
            /verbosity:minimal `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64 `
            /property:PublishProfile= `
            /property:PublishTrimmed=false `
            /property:PublishReadyToRun=false `
            /property:AppxPackageSigningEnabled=false `
            /property:GenerateAppxPackageOnBuild=false 2>&1 |
            Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            throw "WinUI baseline build failed with exit code $LASTEXITCODE"
          }

          $warnings = @(
            Select-String -LiteralPath $logPath -Pattern 'WMC1506'
          )
          $locations = @(
            foreach ($warning in $warnings) {
              if ($warning.Line -match '(?<path>[A-Za-z]:\\.+?\.xaml)\((?<line>\d+),(?<column>\d+)\).*WMC1506') {
                "$($Matches.path)|$($Matches.line)|$($Matches.column)"
              }
            }
          ) | Sort-Object -Unique

          if ($locations.Count -ne 46) {
            throw "Expected 46 distinct WMC1506 locations but found $($locations.Count)"
          }

          $locations | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'wmc1506-locations.txt') -Encoding utf8
          Write-Host 'Captured 46 compiler-reported WMC1506 locations'

      - name: Remove OneWay only at compiler-reported locations
        run: |
          $ErrorActionPreference = 'Stop'
          $contentRelative = 'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Controls/InspectionContentCard.xaml'
          $modelRelative = 'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Controls/InspectionModelCard.xaml'
          $allowedPaths = @(
            [IO.Path]::GetFullPath((Join-Path 'D:\s' $contentRelative))
            [IO.Path]::GetFullPath((Join-Path 'D:\s' $modelRelative))
          )

          $targetsByFile = @{}
          $locations = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'wmc1506-locations.txt')
          foreach ($location in $locations) {
            $parts = $location -split '\|'
            if ($parts.Count -ne 3) {
              throw "Unexpected warning location format: $location"
            }

            $path = [IO.Path]::GetFullPath($parts[0])
            $lineNumber = [int]$parts[1]
            if ($path -notin $allowedPaths) {
              throw "WMC1506 was reported outside the two approved Task 6 files: $path"
            }

            if (-not $targetsByFile.ContainsKey($path)) {
              $targetsByFile[$path] = [System.Collections.Generic.HashSet[int]]::new()
            }
            [void]$targetsByFile[$path].Add($lineNumber)
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          foreach ($path in $targetsByFile.Keys) {
            $raw = [IO.File]::ReadAllText($path)
            $newLine = if ($raw.Contains("`r`n")) { "`r`n" } else { "`n" }
            $lines = $raw -split '\r?\n'

            foreach ($lineNumber in $targetsByFile[$path]) {
              $index = $lineNumber - 1
              if ($index -lt 0 -or $index -ge $lines.Count) {
                throw "Compiler location $path($lineNumber) is outside the file"
              }

              $occurrences = [regex]::Matches($lines[$index], ', Mode=OneWay').Count
              if ($occurrences -ne 1) {
                throw "Expected exactly one Mode=OneWay at compiler location $path($lineNumber) but found $occurrences"
              }

              $lines[$index] = $lines[$index].Replace(', Mode=OneWay', '')
            }

            [IO.File]::WriteAllText(
              $path,
              [string]::Join($newLine, $lines),
              $utf8NoBom)
          }

          $contentPath = Join-Path 'D:\s' $contentRelative
          $modelPath = Join-Path 'D:\s' $modelRelative
          $contentText = [IO.File]::ReadAllText($contentPath)
          $modelText = [IO.File]::ReadAllText($modelPath)

          if ($contentText -notmatch 'IsExpanded="\{x:Bind IsExpanded, Mode=TwoWay\}"') {
            throw 'InspectionContentCard IsExpanded TwoWay binding changed unexpectedly'
          }
          if ($modelText -notmatch 'IsExpanded="\{x:Bind IsInspectionDetailsExpanded, Mode=TwoWay\}"') {
            throw 'InspectionModelCard IsInspectionDetailsExpanded TwoWay binding changed unexpectedly'
          }

      - name: Rebuild and require zero WMC1506 warnings
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:RUNNER_TEMP 'phase1-winui-build-after.log'

          msbuild "$env:APP_PROJECT" `
            /target:Build `
            /maxCpuCount `
            /verbosity:minimal `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64 `
            /property:PublishProfile= `
            /property:PublishTrimmed=false `
            /property:PublishReadyToRun=false `
            /property:AppxPackageSigningEnabled=false `
            /property:GenerateAppxPackageOnBuild=false 2>&1 |
            Tee-Object -FilePath $logPath

          if ($LASTEXITCODE -ne 0) {
            throw "WinUI post-cleanup build failed with exit code $LASTEXITCODE"
          }

          $warnings = @(
            Select-String -LiteralPath $logPath -Pattern 'WMC1506'
          )
          if ($warnings.Count -ne 0) {
            $warnings | ForEach-Object { Write-Host $_.Line }
            throw "Model Inspection WMC1506 bindings remain after cleanup: $($warnings.Count)"
          }

          Write-Host 'WMC1506 warning count after cleanup: 0'

      - name: Restore and build packaged unit tests
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore "$env:TEST_PROJECT" --runtime win-x64 -p:Platform=x64
          if ($LASTEXITCODE -ne 0) {
            throw "Unit-test restore failed with exit code $LASTEXITCODE"
          }

          dotnet build "$env:TEST_PROJECT" `
            --configuration Release `
            --no-restore `
            --runtime win-x64 `
            -p:Platform=x64
          if ($LASTEXITCODE -ne 0) {
            throw "Unit-test build failed with exit code $LASTEXITCODE"
          }

      - name: Run focused selector and hidden-state tests
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) {
            throw 'Visual Studio app-container test runner was not found'
          }

          $recipe = "D:\s\$env:TEST_RECIPE"
          & $vstest $recipe /Platform:x64 /TestCaseFilter:"FullyQualifiedName~InspectionContentTemplateSelectorTests"
          if ($LASTEXITCODE -ne 0) {
            throw "Selector characterization tests failed with exit code $LASTEXITCODE"
          }

          & $vstest $recipe /Platform:x64 /TestCaseFilter:"FullyQualifiedName~InspectionContentCardPresentationTests"
          if ($LASTEXITCODE -ne 0) {
            throw "Hidden-state tests failed with exit code $LASTEXITCODE"
          }

      - name: Run full packaged WinUI application suite
        run: |
          $ErrorActionPreference = 'Stop'
          $resultsDirectory = Join-Path $env:RUNNER_TEMP 'Task6FullSuite'
          New-Item -ItemType Directory -Force -Path $resultsDirectory | Out-Null

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) {
            throw 'Visual Studio app-container test runner was not found'
          }

          & $vstest `
            "D:\s\$env:TEST_RECIPE" `
            /Platform:x64 `
            /Logger:"trx;LogFileName=Task6FullSuite.trx" `
            /ResultsDirectory:$resultsDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Full packaged test suite failed with exit code $LASTEXITCODE"
          }

          $trxPath = Join-Path $resultsDirectory 'Task6FullSuite.trx'
          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          if ([int]$counters.total -le 0 -or [int]$counters.total -ne [int]$counters.passed) {
            throw 'Full packaged test TRX contains a non-passing or empty result'
          }
          Write-Host "Full packaged tests passed: $($counters.passed)/$($counters.total)"

      - name: Copy verified XAML back and commit Task 6
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $contentRelative = 'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Controls/InspectionContentCard.xaml'
          $modelRelative = 'IBM Granite with TurboQuant (Intel)/Features/ModelInspection/Controls/InspectionModelCard.xaml'

          Copy-Item -LiteralPath (Join-Path 'D:\s' $contentRelative) -Destination (Join-Path $env:GITHUB_WORKSPACE $contentRelative) -Force
          Copy-Item -LiteralPath (Join-Path 'D:\s' $modelRelative) -Destination (Join-Path $env:GITHUB_WORKSPACE $modelRelative) -Force

          git diff --check -- "$contentRelative" "$modelRelative"
          if ($LASTEXITCODE -ne 0) {
            throw 'Task 6 XAML diff failed whitespace validation'
          }

          $changed = @(git diff --name-only)
          $expected = @($contentRelative, $modelRelative) | Sort-Object
          $actual = @($changed) | Sort-Object
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            $changed | ForEach-Object { Write-Host "changed: $_" }
            throw 'Task 6 changed files outside the two approved XAML files'
          }

          git fetch origin refactor/model-inspection-cleanup
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to refresh the cleanup branch before Task 6 commit'
          }
          $remoteHead = (git rev-parse 'origin/refactor/model-inspection-cleanup').Trim()
          if ($remoteHead -ne $env:GITHUB_SHA) {
            throw "Cleanup branch moved during Task 6 verification: $remoteHead"
          }

          git config user.name 'arian20020'
          git config user.email 'arian20020@outlook.com'
          git add -- "$contentRelative" "$modelRelative"
          $staged = @(git diff --cached --name-only) | Sort-Object
          if (($staged -join "`n") -ne ($expected -join "`n")) {
            throw 'Task 6 staged file set is not exactly the two approved XAML files'
          }

          git commit -m 'refactor(model-inspection): align compiled binding modes with snapshot state'
          if ($LASTEXITCODE -ne 0) {
            throw "Task 6 commit failed with exit code $LASTEXITCODE"
          }
          git push origin HEAD:refactor/model-inspection-cleanup
          if ($LASTEXITCODE -ne 0) {
            throw "Task 6 push failed with exit code $LASTEXITCODE"
          }

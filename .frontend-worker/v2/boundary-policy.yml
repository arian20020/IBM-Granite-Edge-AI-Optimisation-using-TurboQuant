version: 2
default_classification: blocked
precedence:
  - P0_immutable
  - P1_behavior_sensitive_ui
  - P2_presentation_logic
  - P3_visual_surface
  - P4_existing_fixture_evidence
  - P4_worker_infrastructure
classifications:
  P0_immutable:
    description: "Backend, operational, contract, runtime, worker, project, packaging, existing test, research-evidence, or model files."
    patterns:
      - "shared/**"
      - "infrastructure/**"
      - "runtime/**"
      - "workers/**"
      - "experiments/**"
      - "models/**"
      - "tests/**"
      - "research/**"
      - "release-evidence/**"
      - "**/Contracts/**"
      - "**/Domain/**"
      - "**/Application/**"
      - "**/Infrastructure/**"
      - "**/Runtime/**"
      - "**/Execution/**"
      - "**/Storage/**"
      - "**/QuickScan/**"
      - "**/*WorkerClient*/**"
      - "**/*Protocol*/**"
      - "**/*.targets"
      - "**/*.csproj"
      - "**/*.sln"
      - "**/*.slnx"
      - "**/Package.appxmanifest"
      - "**/app.manifest"
      - "**/App.xaml.cs"
    action: reject
  P1_behavior_sensitive_ui:
    description: "UI orchestration that can alter product behaviour."
    patterns:
      - "**/MainWindow.xaml.cs"
      - "**/*.xaml.cs"
      - "**/ViewModels/**"
      - "**/Controllers/**"
      - "**/Coordinators/**"
      - "**/Navigation/**"
      - "**/*Scheduler.cs"
      - "**/*StateMachine.cs"
      - "**/*Session.cs"
    action: require_explicit_manifest_guard_review_and_behavior_evidence
  P2_presentation_logic:
    description: "Presentation models, factories, display mapping, copy, visual-state, focus, accessibility announcement, and animation logic."
    patterns:
      - "**/Presentation/**/*.cs"
      - "**/*Presentation*.cs"
      - "**/*Display*.cs"
      - "**/*CopyCatalog.cs"
      - "**/*ViewState.cs"
      - "**/*Behavior.cs"
      - "**/*Converter.cs"
    action: require_manifest_and_output_contract_review
  P3_visual_surface:
    description: "Direct XAML, scoped resources, styles, localization, and approved visual assets."
    patterns:
      - "IBM Granite with TurboQuant (Intel)/**/*.xaml"
      - "IBM Granite with TurboQuant (Intel)/**/Themes/**/*.xaml"
      - "IBM Granite with TurboQuant (Intel)/**/Styles/**/*.xaml"
      - "IBM Granite with TurboQuant (Intel)/**/Assets/Branding/**"
      - "IBM Granite with TurboQuant (Intel)/**/Assets/Illustrations/**"
      - "IBM Granite with TurboQuant (Intel)/**/Strings/**"
    action: allow_only_after_authorization_and_exact_file_manifest
  P4_existing_fixture_evidence:
    description: "Existing application fixture galleries and UI evidence. Read-only by default; expected backend outcomes remain frozen."
    patterns:
      - "IBM Granite with TurboQuant (Intel)/**/DebugFixtures/**"
      - "tests/**/UI/**"
      - "tests/**/Presentation/**"
    action: require_explicit_manifest_and_no_backend_outcome_change
  P4_worker_infrastructure:
    description: "Frontend-worker policy, plugin, scripts, semantic guard, documentation, and dedicated bootstrap CI."
    patterns:
      - "AGENTS.md"
      - ".agents/plugins/**"
      - ".agents/skills/**"
      - ".codex/agents/**"
      - ".frontend-worker/**"
      - "plugins/granite-native-frontend-worker/**"
      - "scripts/Initialize-GraniteNativeFrontendWorkerV2.ps1"
      - "scripts/Test-GraniteNativeFrontendWorkerV2.ps1"
      - "scripts/Authorize-GraniteNativeFrontendWorkerV2.ps1"
      - "scripts/frontend-worker/**"
      - "tools/GraniteFrontendGuard/**"
      - "docs/frontend-worker/**"
      - "docs/superpowers/specs/2026-08-31-granite-native-frontend-worker-v2-design.md"
      - "docs/superpowers/plans/2026-08-31-granite-native-frontend-worker-v2-bootstrap.md"
      - ".github/workflows/frontend-worker-bootstrap.yml"
    action: allow_initialization_only
semantic_prohibitions:
  - "No new, removed, reordered, or retargeted backend call."
  - "No changed validation, scanning, parsing, compatibility, optimisation, persistence, networking, process, or filesystem semantics."
  - "No changed cancellation, retry, stale-result, confirmation, default-selection, enabled-state, or navigation semantics."
  - "No package, project reference, worker packaging, target, manifest, protocol, or serialization change."
  - "No existing test or fixture expectation may be weakened to conceal a regression."
  - "No unavailable capability may be presented as operational."

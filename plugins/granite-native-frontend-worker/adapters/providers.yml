version: 3
providers:
  microsoft-winui:
    required: true
    stage: all-native-technical-stages
    authority: implementation-platform
    may_write: false
    fallback: block-implementation
  superpowers:
    required: true
    stage: development-methodology
    authority: methodology-only
    may_write: false
    fallback: block-implementation
  uncodixfy-winui-v2:
    required: true
    stage:
      - post-direction-audit
      - post-render-audit
    authority: bundled-heuristic-audit
    may_write: false
    fallback: block-design-acceptance
  stark:
    required: false
    stage: design-direction
    authority: advisory
    may_write: false
    fallback: local-winui-design-director
  ui-ux-pro-max:
    required: false
    stage: narrow-question-only
    authority: advisory
    may_write: false
    fallback: continue-without-provider
  figma:
    required: false
    stage: approved-reference
    authority: approved-visual-source
    may_write: false
    fallback: approved-screenshots-and-screen-spec
  product-design:
    required: false
    stage: concept-exploration-only
    authority: advisory
    may_write: false
    fallback: local-winui-design-director
conflict_resolution:
  - backend-security-and-behaviour-contracts
  - existing-fixtures-and-product-truth
  - windows-accessibility-and-platform-correctness
  - human-approved-screen-specification
  - repository-architecture
  - microsoft-winui
  - approved-figma-reference
  - granite-design-system
  - stark
  - uncodixfy-winui-v2
  - ui-ux-pro-max
  - generic-model-preference
